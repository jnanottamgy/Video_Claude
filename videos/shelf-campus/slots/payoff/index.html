<!doctype html>
<html lang="en">

    <style>
      /* FRONT layer, output 45.500 -> 52.500 (210 frames). Local t = output - 45.5, frame k = t * 30.
         Bright natural beige wall: navy-glass SHELF cards with big soft warm shadows, all inside the
         top band (y 288-760), clear of both founders' heads (top ~740-770, x 560-990) and the caption band.
           k   7  45.733 "notes"     found-file card pops (searching spinner)
           k  31  46.533 "lost"      FOUND badge stamps onto the card (first visible k 29)
           k  51  47.200 "deadlines" calendar card pushes the file card out; the alarm rings
           k  74  47.967 "surprise"  alarm goes quiet (zzz), "On track" pill pops
           k  89  48.467 "anymore"   soft light sweep over the card
           k 114  49.300 "WhatsApp"  calendar card whips out; WhatsApp icon bounces in, red 999+ badge (k 118), shaking
           k 137  50.067 "Finally"   shaking stops, the badge counts down to 0 (k 137-174)
           k 175  51.333 "useful"    badge turns into a green check, calm green/blue halo
           k 186  51.700 FREEZE      "FINALLY USEFUL." stamp slams (first visible k 184) with an RGB split; hold to the cut */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }
      .rig { position: absolute; inset: 0; }

      /* ---------- navy glass card ---------- */
      .cardbox { position: absolute; left: 120px; top: 326px; width: 840px; height: 256px; perspective: 1400px; transform: scale(1.08); transform-origin: 50% 0%; }
      #a-move { transform-origin: 50% 100%; }
      #b-move { transform-origin: 50% 0%; }
      #a-pdf { transform-origin: 50% 70%; }
      #wa-move { transform-origin: 50% 100%; }
      .card {
        position: absolute;
        inset: 0;
        border-radius: 42px;
        overflow: hidden;
        background:
          radial-gradient(120% 140% at 0% 0%, rgba(120, 170, 255, 0.16) 0%, rgba(120, 170, 255, 0) 55%),
          linear-gradient(160deg, #24395f 0%, #121f3d 52%, #0b1529 100%);
        box-shadow:
          inset 0 0 0 1.5px rgba(150, 195, 255, 0.36),
          inset 0 2px 0 rgba(255, 255, 255, 0.2),
          0 44px 80px -18px rgba(38, 26, 8, 0.5),
          0 14px 28px rgba(28, 20, 8, 0.3),
          0 0 44px rgba(79, 157, 255, 0.2);
        font-family: var(--font-ui);
        color: #ffffff;
      }
      .card .row1 { position: absolute; left: 36px; right: 36px; top: 26px; height: 42px; display: flex; align-items: center; gap: 14px; }
      .card .divider { position: absolute; left: 36px; right: 36px; top: 86px; height: 2px; border-radius: 1px; background: rgba(150, 195, 255, 0.16); }
      .card .row2 { position: absolute; left: 36px; top: 108px; height: 124px; display: flex; align-items: center; gap: 30px; }
      .q-ico { width: 30px; height: 30px; flex: none; }
      .q-txt { font: 500 30px/42px var(--font-ui); color: rgba(226, 234, 248, 0.9); letter-spacing: -0.005em; }
      .q-caret { width: 3px; height: 32px; border-radius: 2px; background: var(--shelf-blue); margin-left: -8px; }
      .eyebrow { font: 600 26px/42px var(--font-brand); letter-spacing: 0.18em; color: rgba(165, 200, 255, 0.92); }
      .eyebrow-r { margin-left: auto; font: 600 27px/42px var(--font-ui); color: rgba(220, 230, 246, 0.7); }
      .pdf { width: 100px; height: 124px; flex: none; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.35)); }
      .doc-txt { display: flex; flex-direction: column; gap: 8px; }
      .doc-name { font: 600 46px/54px var(--font-ui); letter-spacing: -0.015em; color: #ffffff; white-space: nowrap; }
      .doc-meta { font: 500 30px/38px var(--font-ui); color: rgba(205, 218, 240, 0.74); white-space: nowrap; display: flex; align-items: center; gap: 16px; }

      /* spinner (searching) */
      .spin { position: absolute; right: 36px; top: 30px; width: 34px; height: 34px; }

      /* card sheen (light sweep), clipped by the card */
      .sheen {
        position: absolute;
        top: -40px;
        bottom: -40px;
        left: 0;
        width: 260px;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(190, 220, 255, 0.07) 35%, rgba(220, 236, 255, 0.24) 50%, rgba(190, 220, 255, 0.07) 65%, rgba(255, 255, 255, 0) 100%);
        opacity: 0;
      }

      /* ---------- FOUND badge (stamped onto card A) ---------- */
      .anchor { position: absolute; width: 0; height: 0; display: flex; align-items: center; justify-content: center; }
      .found {
        position: relative;
        flex: none;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 90px;
        padding: 0 28px 0 20px;
        border-radius: 22px;
        background: linear-gradient(180deg, #4fe68a 0%, #25d366 48%, #1cb658 100%);
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.45),
          inset 0 -3px 0 rgba(0, 90, 40, 0.25),
          0 14px 26px rgba(0, 70, 30, 0.38),
          0 4px 8px rgba(0, 0, 0, 0.2);
        font: 800 46px/1 var(--font-brand);
        letter-spacing: 0.06em;
        color: #ffffff;
        text-shadow: 0 2px 0 rgba(0, 80, 35, 0.35);
        transform-origin: 50% 50%;
      }
      .found::after {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 16px;
        border: 3px solid rgba(255, 255, 255, 0.85);
        pointer-events: none;
      }
      .found svg { width: 46px; height: 46px; flex: none; }
      .ring {
        position: absolute;
        flex: none;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 6px solid rgba(37, 211, 102, 0.9);
        box-shadow: 0 0 22px rgba(37, 211, 102, 0.55);
        opacity: 0;
      }
      .sparks { position: absolute; width: 0; height: 0; }
      .spark { position: absolute; left: 0; top: 0; border-radius: 50%; opacity: 0; }

      /* ---------- calendar card (B) ---------- */
      .cal {
        width: 108px;
        height: 124px;
        flex: none;
        border-radius: 26px;
        overflow: hidden;
        background: linear-gradient(180deg, #ffffff 0%, #eef2f8 100%);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.32), inset 0 -2px 0 rgba(0, 0, 0, 0.06);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .cal-top { width: 100%; height: 36px; background: linear-gradient(180deg, #ff5a4f, #e8372c); color: #fff; font: 800 22px/36px var(--font-ui); letter-spacing: 0.12em; text-align: center; }
      .cal-num { font: 700 62px/86px var(--font-ui); color: #111827; letter-spacing: -0.03em; }
      .ontrack {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        height: 42px;
        padding: 0 18px 0 14px;
        border-radius: 21px;
        background: #25d366;
        color: #0b141a;
        font: 700 25px/42px var(--font-ui);
        letter-spacing: -0.005em;
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
        transform-origin: 10% 50%;
      }
      .ontrack i { display: block; width: 12px; height: 12px; border-radius: 50%; background: #0b141a; opacity: 0.8; }
      .alarm-anchor { position: absolute; left: 640px; top: 112px; width: 150px; height: 120px; }
      .alarm-shake { position: absolute; inset: 0; transform-origin: 50% 60%; }
      .alarm-shake svg { position: absolute; inset: 0; width: 150px; height: 120px; overflow: visible; }
      .zzz { position: absolute; left: 0; top: 0; font: 700 30px/1 var(--font-brand); color: #9cc6ff; opacity: 0; text-shadow: 0 0 12px rgba(79, 157, 255, 0.6); }

      /* ---------- WhatsApp icon (C) ---------- */
      .wa-pos { position: absolute; left: 390px; top: 302px; width: 300px; height: 300px; }
      .halo {
        position: absolute;
        left: -230px;
        top: -230px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(37, 211, 102, 0.62) 0%, rgba(40, 205, 150, 0.46) 22%, rgba(79, 157, 255, 0.3) 40%, rgba(79, 157, 255, 0.1) 54%, rgba(79, 157, 255, 0) 68%);
        opacity: 0;
      }
      .halo-ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 300px;
        border-radius: 27%;
        border: 5px solid rgba(37, 211, 102, 0.85);
        box-shadow: 0 0 26px rgba(37, 211, 102, 0.6), inset 0 0 16px rgba(79, 157, 255, 0.4);
        opacity: 0;
      }
      .wa-glow {
        position: absolute;
        inset: 0;
        border-radius: 24%;
        box-shadow: 0 0 60px 16px rgba(37, 211, 102, 0.6), 0 0 130px 40px rgba(79, 157, 255, 0.34);
        opacity: 0;
      }
      .wa-icon {
        position: absolute;
        inset: 0;
        border-radius: 24%;
        background:
          radial-gradient(120% 90% at 30% 0%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 55%),
          linear-gradient(180deg, #62f08f 0%, #2ad66a 46%, #18b257 100%);
        box-shadow:
          inset 0 3px 0 rgba(255, 255, 255, 0.35),
          inset 0 -6px 12px rgba(0, 80, 30, 0.22),
          0 40px 70px -14px rgba(10, 70, 30, 0.5),
          0 14px 26px rgba(0, 0, 0, 0.22);
        display: grid;
        place-items: center;
      }
      .wa-icon svg { width: 226px; height: 226px; display: block; filter: drop-shadow(0 3px 4px rgba(0, 90, 40, 0.25)); }
      .badge-anchor { position: absolute; left: 272px; top: 28px; width: 0; height: 0; display: flex; align-items: center; justify-content: center; }
      .badge {
        position: relative;
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 92px;
        height: 92px;
        padding: 0 24px;
        border-radius: 46px;
        background: linear-gradient(180deg, #ff5a52 0%, #ff3b30 55%, #e2251b 100%);
        color: #ffffff;
        font: 700 56px/1 var(--font-ui);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), 0 10px 22px rgba(120, 0, 0, 0.35), 0 0 0 5px rgba(255, 255, 255, 0.95);
        transform-origin: 50% 50%;
        white-space: nowrap;
      }
      .badge.green {
        position: absolute;
        padding: 0;
        width: 92px;
        background: linear-gradient(180deg, #4fe68a 0%, #25d366 55%, #1cb658 100%);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4), 0 10px 22px rgba(0, 90, 40, 0.35), 0 0 0 5px rgba(255, 255, 255, 0.95), 0 0 30px rgba(37, 211, 102, 0.6);
      }
      .badge.green svg { width: 56px; height: 56px; }
      .ping {
        position: absolute;
        flex: none;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 5px solid rgba(255, 59, 48, 0.85);
        opacity: 0;
      }

      /* ---------- FINALLY USEFUL. stamp ---------- */
      .fu-anchor { position: absolute; left: 540px; top: 650px; width: 0; height: 0; display: flex; align-items: center; justify-content: center; }
      .fu {
        position: relative;
        flex: none;
        height: 156px;
        padding: 0 50px;
        display: flex;
        align-items: center;
        border-radius: 30px;
        background: linear-gradient(180deg, #3fdc7d 0%, #22c862 46%, #179f4e 100%);
        font: 800 92px/1 var(--font-brand);
        letter-spacing: -0.005em;
        color: #ffffff;
        white-space: nowrap;
        transform-origin: 50% 50%;
      }
      .fu::after {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 22px;
        border: 4px solid rgba(255, 255, 255, 0.9);
        pointer-events: none;
      }
      .fu .fx { position: absolute; inset: 0; border-radius: 30px; background: #ffffff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>

    <script>
      (function () {
        var DUR = 7;
        var F = 1 / 30;
        var E = 0.004; // a tween that starts at K(k) shows its start pose on frame k
        function K(k) { return k * F - E; }
        function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
        function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
        function env(t, a0, a1, b0, b1) {
          if (t <= a0 || t >= b1) return 0;
          if (t < a1) return (t - a0) / (a1 - a0);
          if (t <= b0) return 1;
          return 1 - (t - b0) / (b1 - b0);
        }
        function $(id) { return document.getElementById(id); }

        // ---- cue frames ----
        var A_IN = 7, FOUND_HIT = 31, B_IN = 51, QUIET = 74, ANYMORE = 89, C_IN = 114, BADGE_IN = 118;
        var FINALLY = 137, COUNT_END = 174, USEFUL = 175, FU_HIT = 186;

        // ---- particle pools (built once, deterministic) ----
        function pool(container, n, seed, colors, sizeMin, sizeMax) {
          var arr = [];
          for (var i = 0; i < n; i++) {
            var el = document.createElement("div");
            el.className = "spark";
            var s = sizeMin + hash(seed + i * 3.1) * (sizeMax - sizeMin);
            el.style.width = s.toFixed(1) + "px";
            el.style.height = s.toFixed(1) + "px";
            el.style.marginLeft = (-s / 2).toFixed(1) + "px";
            el.style.marginTop = (-s / 2).toFixed(1) + "px";
            el.style.background = colors[i % colors.length];
