<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>founders / built_behind</title>
    <script src="./vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      /* BEHIND layer (under the person cut-out), on the navy wall. Output 21.100 -> 22.767 (50 frames), t = out - 21.1.
         "So we built something for it."  Kartik's head: top ~690, x ~545-1015 at hair height.
           21.567 "built": a blueprint grid sweeps in, construction lines snap out, then the SHELF mark (traced from
                  design/shelf-mark.png) draws itself in thin glowing blue lines, three pen heads plotting at once;
                  dimension ticks and the label "PROJECT: ??? · v0.1" type on.
           22.133 "something": the drawing completes and every line flashes bright (glow pulse, faint fill).
           22.600-22.733: everything powers down (surge, then flicker out); the picture cuts to black at 22.767. */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }

      #bp { position: absolute; inset: 0; transform-origin: 330px 600px; }
      #grid {
        position: absolute;
        left: 40px;
        top: 250px;
        width: 1000px;
        height: 760px;
        background:
          repeating-linear-gradient(90deg, rgba(110, 175, 255, 0.30) 0px, rgba(110, 175, 255, 0.30) 1.5px, transparent 1.5px, transparent 100px),
          repeating-linear-gradient(0deg, rgba(110, 175, 255, 0.30) 0px, rgba(110, 175, 255, 0.30) 1.5px, transparent 1.5px, transparent 100px),
          repeating-linear-gradient(90deg, rgba(110, 175, 255, 0.11) 0px, rgba(110, 175, 255, 0.11) 1px, transparent 1px, transparent 20px),
          repeating-linear-gradient(0deg, rgba(110, 175, 255, 0.11) 0px, rgba(110, 175, 255, 0.11) 1px, transparent 1px, transparent 20px);
        -webkit-mask-image: radial-gradient(52% 58% at 30% 46%, #000 0%, rgba(0, 0, 0, 0.75) 45%, transparent 100%);
        mask-image: radial-gradient(52% 58% at 30% 46%, #000 0%, rgba(0, 0, 0, 0.75) 45%, transparent 100%);
      }
      #gridWipe { position: absolute; inset: 0; clip-path: inset(0 100% 0 0); }
      svg.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      #drawGlow { filter: brightness(1) drop-shadow(0 0 5px rgba(90, 160, 255, 0.95)) drop-shadow(0 0 14px rgba(79, 157, 255, 0.5)); }
      .main { fill: none; stroke: #a9d4ff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .cons { fill: none; stroke: rgba(110, 175, 255, 0.55); stroke-width: 1.3; stroke-linecap: round; }
      .dim { fill: none; stroke: #7fbaff; stroke-width: 1.6; stroke-linecap: round; }
      .face { stroke: none; fill: rgba(79, 157, 255, 0.0); }
      .pen { fill: #ffffff; }
      .dimtxt { font: 700 20px/1 var(--font-mono); fill: #8fc6ff; letter-spacing: 0.06em; }
      #label {
        position: absolute;
        left: 92px;
        top: 870px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 18px;
        border: 1.5px solid rgba(127, 186, 255, 0.7);
        background: rgba(8, 20, 46, 0.35);
        box-shadow: 0 0 18px rgba(var(--glow), 0.35), inset 0 0 14px rgba(var(--glow), 0.15);
        font: 700 30px/1 var(--font-mono);
        letter-spacing: 0.06em;
        color: #b7dcff;
        text-shadow: 0 0 10px rgba(var(--glow), 0.85);
        white-space: nowrap;
      }
      #label .txt { display: inline-block; white-space: pre; }
      #label .ch { opacity: 0; }
      .snap { fill: none; stroke: #d6ebff; stroke-width: 1.6; }
      #caret { width: 16px; height: 30px; background: #b7dcff; box-shadow: 0 0 10px rgba(var(--glow), 0.9); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="1.666667" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="1.666667" data-track-index="0">
        <div id="bp" data-layout-allow-overflow>
          <div id="gridWipe"><div id="grid"></div></div>
          <svg class="layer" id="drawFlat" viewBox="0 0 1080 1920" aria-hidden="true"></svg>
          <svg class="layer" id="drawGlow" viewBox="0 0 1080 1920" aria-hidden="true">
            <defs>
              <radialGradient id="hot"><stop offset="0" stop-color="#ffffff" stop-opacity="1" /><stop offset="0.35" stop-color="#cfe6ff" stop-opacity="0.8" /><stop offset="1" stop-color="#4f9dff" stop-opacity="0" /></radialGradient>
            </defs>
          </svg>
          <div id="label" data-layout-allow-overflow></div>
        </div>
      </div>
    </div>
    <script>
      // ---------- geometry: the SHELF mark's edges, traced from design/shelf-mark.png (446 x 510 px) ----------
      var S = 0.9, OX = 112, OY = 318;                 // mark px -> screen: x = OX + S * mx, y = OY + S * my
      function P(x, y) { return [OX + S * x, OY + S * y]; }
      var A = P(19, 170), B = P(299, 19), C = P(428, 76), D = P(139, 227);
      var A2 = P(19, 176), D2 = P(139, 233), C2 = P(428, 83);
      var E = P(19, 421), F = P(139, 357);
      var M1 = P(140, 280), M2 = P(220, 317), M3 = P(337, 257), M5 = P(210, 196);
      var R1 = P(426, 297), R2 = P(426, 349);
      var G = P(162, 488), E2 = P(19, 427), G2 = P(162, 494), R2b = P(426, 355);
      // three pens plot in parallel; each pen draws its polylines in order
      var PENS = [
        [[A, B, C, D, A], [D, D2], [A, A2, D2, C2, C]],                 // top plank
        [[A2, E], [D2, F], [M1, M2, M3, M5], [M3, R1, R2]],              // left panel + middle shelf + right lip
        [[E, G, R2], [E, M2], [E, E2, G2, R2b, R2], [G, G2]],            // bottom plank
      ];
      // faint faces that flash on "something"
      var FACES = [[A, B, C, D], [M1, M2, M3, M5], [E, G, R2, R1, M3, M2]];
      // construction lines: the iso axes and the bounding box, extended past the shape
      function ext(p, q, a, b) {
        var dx = q[0] - p[0], dy = q[1] - p[1];
        return [[p[0] - a * dx, p[1] - a * dy], [q[0] + b * dx, q[1] + b * dy]];
      }
      var CONS = [
        ext(A, B, 0.22, 0.25), ext(E, R2, 0.18, 0.2), ext(A, D, 0.5, 1.1), ext(G, R2, 0.25, 0.12),
        [P(19, -20), P(19, 560)], [P(428, -20), P(428, 545)], [P(-40, 19), P(480, 19)], [P(-40, 494), P(480, 494)],
      ];

      var NS = "http://www.w3.org/2000/svg";
      var svgFlat = document.getElementById("drawFlat"), svgGlow = document.getElementById("drawGlow");
      function node(tag, attrs, parent) {
        var e = document.createElementNS(NS, tag);
        for (var k in attrs) e.setAttribute(k, attrs[k]);
        parent.appendChild(e);
        return e;
      }
      function pts(list) { return list.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "); }
      function len(list) {
        var L = 0;
        for (var i = 1; i < list.length; i++) L += Math.hypot(list[i][0] - list[i - 1][0], list[i][1] - list[i - 1][1]);
        return L;
      }

      var gCons = node("g", { id: "consG" }, svgFlat);
      var gDim = node("g", { id: "dimG" }, svgFlat);
      var gFace = node("g", { id: "faceG" }, svgGlow);
      var gGlow = node("g", { id: "glowG" }, svgGlow);
      var gPen = node("g", { id: "penG" }, svgGlow);

      var consEls = CONS.map(function (l) { return node("polyline", { class: "cons", points: pts(l), pathLength: "1", "stroke-dasharray": "1 1", "stroke-dashoffset": "1" }, gCons); });
      var faceEls = FACES.map(function (f) { return node("polygon", { class: "face", points: pts(f) }, gFace); });
      var pens = PENS.map(function (lines) {
        var segs = lines.map(function (l) {
          return { el: node("polyline", { class: "main", points: pts(l), pathLength: "1", "stroke-dasharray": "1 1", "stroke-dashoffset": "1" }, gGlow), pts: l, L: len(l) };
        });
        var total = segs.reduce(function (s, x) { return s + x.L; }, 0);
        var dot = node("g", { opacity: "0" }, gPen);
        node("circle", { r: "16", cx: 0, cy: 0, fill: "url(#hot)" }, dot);
        node("circle", { class: "pen", r: "4.5", cx: 0, cy: 0 }, dot);
        return { segs: segs, total: total, dot: dot };
      });

      // dimension lines: width under the shape, height on the left, the iso angle at A
      var yW = OY + S * 540, xH = OX + S * -48;
      var dimEls = [
        node("polyline", { class: "dim", points: pts([P(19, 500), [OX + S * 19, yW + 10]]), pathLength: "1", "stroke-dasharray": "1 1", "stroke-dashoffset": "1" }, gDim),
        node("polyline", { class: "dim", points: pts([P(428, 360), [OX + S * 428, yW + 10]]), pathLength: "1", "stroke-dasharray": "1 1", "stroke-dashoffset": "1" }, gDim),
        node("polyline", { class: "dim", points: pts([[OX + S * 19, yW], [OX + S * 428, yW]]), pathLength: "1", "stroke-dasharray": "1 1", "stroke-dashoffset": "1" }, gDim),
        node("polyline", { class: "dim", points: pts([[xH, OY + S * 19], [xH, OY + S * 494]]), pathLength: "1", "stroke-dasharray": "1 1", "stroke-dashoffset": "1" }, gDim),
      ];
      // end ticks (architectural slashes)
      var ticks = [[OX + S * 19, yW], [OX + S * 428, yW], [xH, OY + S * 19], [xH, OY + S * 494]].map(function (p) {
        return node("line", { class: "dim", x1: p[0] - 7, y1: p[1] + 7, x2: p[0] + 7, y2: p[1] - 7, opacity: "0" }, gDim);
      });
      var dimTxt = [
        node("text", { class: "dimtxt", x: OX + S * 223, y: yW - 12, "text-anchor": "middle", opacity: "0" }, gDim),
        node("text", { class: "dimtxt", x: xH - 12, y: OY + S * 256, "text-anchor": "middle", transform: "rotate(-90 " + (xH - 12) + " " + (OY + S * 256) + ")", opacity: "0" }, gDim),
      ];
      dimTxt[0].textContent = "410";
      dimTxt[1].textContent = "475";
      var arc = node("path", { class: "dim", d: "M" + (A[0] + 58) + "," + A[1] + " A58,58 0 0,0 " + (A[0] + 58 * Math.cos(-0.494)) + "," + (A[1] + 58 * Math.sin(-0.494)), opacity: "0" }, gDim);
      var ang = node("text", { class: "dimtxt", x: A[0] + 66, y: A[1] - 8, opacity: "0" }, gDim);
      ang.textContent = "28°";

      // label: typed on character by character
      var label = document.getElementById("label");
      var LABEL = "PROJECT: ??? · v0.1";
      var txt = document.createElement("span");
      txt.className = "txt";
      label.appendChild(txt);
      var chars = LABEL.split("").map(function (ch) {
        var s = document.createElement("span");
        s.className = "ch";
        s.textContent = ch;
        txt.appendChild(s);
        return s;
      });
      var caret = document.createElement("span");
      caret.id = "caret";
      label.appendChild(caret);

      // ---------- timeline ----------
      var T0 = 21.1;
      function at(out) { return Math.round(out * 30) / 30 - T0 - 0.004; } // first frame shows the pose
      var tl = gsap.timeline({ paused: true });
      var TB = at(21.57), TS = at(22.13), TOFF = at(22.6);

      // "built": the grid sweeps in, construction lines snap out
      tl.fromTo("#gridWipe", { clipPath: "inset(0px 100% 0px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: 0.32, ease: "expo.out" }, TB);
      tl.fromTo("#grid", { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "power2.out" }, TB + 0.1);
      consEls.forEach(function (e, i) {
        tl.fromTo(e, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.2, ease: "power3.out" }, TB + i * 0.012);
      });

      // the three pens plot the mark between "built" and "something" (one linear driver; pure function of time)
      var DRAW0 = TB + 0.04, DRAW1 = TS;
      var drive = { p: 0 };
      function plot() {
        var e = drive.p;                                         // 0..1, eased below
        var q = e < 0.5 ? 2 * e * e : 1 - Math.pow(-2 * e + 2, 2) / 2;   // power1.inOut
        pens.forEach(function (pen) {
          var target = q * pen.total, acc = 0, tip = null;
          pen.segs.forEach(function (sg) {
            var f = Math.max(0, Math.min(1, (target - acc) / sg.L));
            sg.el.setAttribute("stroke-dashoffset", (1 - f).toFixed(4));
            if (f > 0 && f < 1 && !tip) {
              var d = f * sg.L, a2 = 0;
              for (var i = 1; i < sg.pts.length; i++) {
                var l = Math.hypot(sg.pts[i][0] - sg.pts[i - 1][0], sg.pts[i][1] - sg.pts[i - 1][1]);
                if (a2 + l >= d) {
                  var u = (d - a2) / l;
                  tip = [sg.pts[i - 1][0] + u * (sg.pts[i][0] - sg.pts[i - 1][0]), sg.pts[i - 1][1] + u * (sg.pts[i][1] - sg.pts[i - 1][1])];
                  break;
                }
                a2 += l;
              }
            }
            acc += sg.L;
          });
          if (tip) pen.dot.setAttribute("transform", "translate(" + tip[0].toFixed(1) + " " + tip[1].toFixed(1) + ")");
          pen.dot.setAttribute("opacity", q > 0 && q < 1 ? "1" : "0");
        });
      }
      tl.fromTo(drive, { p: 0 }, { p: 1, duration: DRAW1 - DRAW0, ease: "none", onUpdate: plot }, DRAW0);
      plot();

      // dimensions + angle draw while the mark plots
      dimEls.forEach(function (e, i) {
        tl.fromTo(e, { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.24, ease: "power2.out" }, TB + 0.22 + i * 0.05);
      });
      tl.fromTo(ticks, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.06, stagger: 0.03, ease: "none" }, TB + 0.42);
      tl.fromTo(dimTxt, { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.1, stagger: 0.05, ease: "power2.out" }, TB + 0.44);
      tl.fromTo([arc, ang], { attr: { opacity: 0 } }, { attr: { opacity: 1 }, duration: 0.1, ease: "power2.out" }, TB + 0.3);

      // label types on (21.62 -> ~21.98), caret blinks
      tl.set(caret, { opacity: 1 }, TB + 0.04);
      chars.forEach(function (c, i) { tl.set(c, { opacity: 1 }, TB + 0.06 + i * 0.019); });
      [0.5, 0.62, 0.74, 0.86, 1.0, 1.12].forEach(function (dt, i) { tl.set(caret, { opacity: i % 2 ? 1 : 0 }, TB + dt); });
      tl.fromTo("#label", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.16, ease: "power3.out" }, TB);

      // "something": complete; every line flashes bright, faces glow faintly
      // CAD snap points pop on the vertices as the drawing completes
      var VERTS = [A, B, C, D, E, G, R1, R2, M2, M3];
      var snaps = VERTS.map(function (v) { return node("rect", { class: "snap", x: v[0] - 6, y: v[1] - 6, width: 12, height: 12, opacity: "0" }, gPen); });
      snaps.forEach(function (r, i) {
        var v = VERTS[i];
        tl.fromTo(r, { attr: { opacity: 0 }, scale: 2.2, svgOrigin: v[0].toFixed(1) + " " + v[1].toFixed(1) },
          { attr: { opacity: 1 }, scale: 1, svgOrigin: v[0].toFixed(1) + " " + v[1].toFixed(1), duration: 0.16, ease: "back.out(2)", immediateRender: false }, TS - 0.03 + i * 0.012);
      });
      var mains = gsap.utils.toArray("#drawGlow .main");
      tl.fromTo(mains, { strokeWidth: 2.6 }, { strokeWidth: 4.4, duration: 0.05, ease: "power2.out", immediateRender: false }, TS);
      tl.to(mains, { strokeWidth: 2.9, duration: 0.4, ease: "power2.out" }, TS + 0.05);
      tl.fromTo("#drawGlow", { filter: "brightness(1) drop-shadow(0 0 5px rgba(90, 160, 255, 0.95)) drop-shadow(0 0 14px rgba(79, 157, 255, 0.5))" },
        { filter: "brightness(1.9) drop-shadow(0 0 12px rgba(150, 205, 255, 1)) drop-shadow(0 0 30px rgba(79, 157, 255, 0.9))", duration: 0.05, ease: "power2.out", immediateRender: false }, TS);
      tl.to("#drawGlow", { filter: "brightness(1.15) drop-shadow(0 0 7px rgba(90, 160, 255, 0.95)) drop-shadow(0 0 18px rgba(79, 157, 255, 0.6))", duration: 0.42, ease: "power2.out" }, TS + 0.05);
      tl.fromTo(faceEls, { fill: "rgba(120,185,255,0)" }, { fill: "rgba(120,185,255,0.30)", duration: 0.05, ease: "power2.out", immediateRender: false }, TS);
      tl.to(faceEls, { fill: "rgba(120,185,255,0.10)", duration: 0.42, ease: "power2.out" }, TS + 0.05);
      tl.fromTo("#grid", { opacity: 0.95 }, { opacity: 0.55, duration: 0.42, ease: "power2.out", immediateRender: false }, TS);

      // 22.60 -> 22.733: power down: a surge, then flicker out (one value per frame)
      var flick = [[1, 1.6], [0.28, 1], [0.8, 1.1], [0.12, 1], [0.32, 0.9]];
      flick.forEach(function (v, i) { tl.set("#bp", { opacity: v[0], filter: "brightness(" + v[1] + ")" }, TOFF + i / 30); });
      tl.set("#bp", { scaleY: 0.985, scaleX: 1.01 }, TOFF + 2 / 30);
      tl.set("#bp", { scaleY: 1, scaleX: 1 }, TOFF + 3 / 30);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
