      /* FULL-FRAME scene. Output 22.767 -> 27.433 (140 frames). Local t = output - 22.767; frame k shows t = k/30.
           f4   22.900  ping: one green WhatsApp unread pill "1" pops in the dark with two ripples, fades
           f17  23.350  emergence: a thin rim-light traces the mark's edges from its top corner (both ways)
           f35  23.933  the trace closes; inner edges draw; the chrome fades up out of the dark
           f52  24.516  a slow light sweep crosses the chrome (haze beam + dust motes in it)
           f70  25.100  shimmer build: glints on the corners, motes pulled in, a ring contracts, the mark trembles
           f87  25.667  DROP (25.683): white-hot mark, flash, shockwave, blue lightning, navy+blue bloom, SHELF slams
           f97  26.033  CAMPUS snaps in, tracking out from tight to wide
           f105 26.267  glow pulse 1

    <script>
      (function () {
        "use strict";
        var FR = 1 / 30;
        var D = 140 / 30;
        var H = MO.hit;
        var hash = MO.hash, seg = MO.seg;
        // frame indices (0-based) of the cues; frame k shows t = k/30 = output 22.767 + k/30
        var K = { ping: 4, emerge: 17.5, b2: 35, b3: 52, b4: 70, drop: 87, campus: 97, p1: 105, p2: 122 };
        var T = {};
        for (var k in K) T[k] = K[k] * FR;
        var TD = H(K.drop);
        var eIO = MO.ease("power2.inOut"), eIn = MO.ease("power2.in"), eOut = MO.ease("power3.out");

        // ---------- geometry: the mark box and its wireframe (art px -> frame px) ----------
        var MS = 0.745, MX = 373.86, MY = 540;
        function P(x, y) { return [MX + x * MS, MY + y * MS]; }
        var V = {
          T: P(298, 17.5), R: P(428, 75), N: P(213, 197), MR: P(338, 254), BR: P(427, 299),
          BR2: P(427, 347), BF: P(163, 490), BL: P(18, 421), L: P(18, 170), F: P(139, 230)
        };
        var C = [540, 728]; // mark centre (frame px)

        // ---------- lightning: seeded midpoint-displacement bolts, 3 variants per slot ----------
        function bolt(rng, a, b, rough, depth) {
          var pts = [a, b];
          var disp = Math.hypot(b[0] - a[0], b[1] - a[1]) * rough;
          for (var d = 0; d < depth; d++) {
            var np = [pts[0]];
            for (var i = 0; i < pts.length - 1; i++) {
              var p = pts[i], q = pts[i + 1];
              var dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy) || 1;
              var off = (rng() - 0.5) * 2 * disp;
              np.push([(p[0] + q[0]) / 2 - (dy / L) * off, (p[1] + q[1]) / 2 + (dx / L) * off]);
              np.push(q);
            }
            pts = np;
            disp *= 0.56;
          }
          return pts;
        }
        function toD(pts) {
          var s = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
          for (var i = 1; i < pts.length; i++) s += "L" + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1);
          return s;
        }
        function radial(a, angDeg, len) {
          var r = (angDeg * Math.PI) / 180;
          return [a[0] + Math.cos(r) * len, a[1] + Math.sin(r) * len];
        }
        var SLOTS = [
          { a: V.T, ang: -84, len: 250 },
          { a: V.T, ang: -38, len: 230 },
          { a: V.R, ang: -12, len: 270 },
          { a: V.BR2, ang: 16, len: 250 },
          { a: V.BL, ang: 166, len: 250 },
          { a: V.L, ang: 196, len: 270 },
          { a: V.L, ang: 236, len: 230 },
          { crawl: [V.T, V.R] },
          { crawl: [V.BL, V.L] },
          { crawl: [V.MR, V.BR2] },
        ];
        var BOLTS = SLOTS.map(function (s, si) {
          var vars = [];
          for (var v = 0; v < 3; v++) {
            var rng = MO.rng(9001 + si * 97 + v * 13);
            var d;
            if (s.crawl) {
              d = toD(bolt(rng, s.crawl[0], s.crawl[1], 0.16, 5));
            } else {
              var end = radial(s.a, s.ang + (rng() - 0.5) * 14, s.len * (0.85 + rng() * 0.3));
              var main = bolt(rng, s.a, end, 0.2, 6);
              d = toD(main);
              var nb = 1 + Math.floor(rng() * 2);
              for (var b = 0; b < nb; b++) {
                var idx = Math.floor(main.length * (0.3 + rng() * 0.4));
                var o = main[idx];
                var ang = s.ang + (rng() < 0.5 ? -1 : 1) * (28 + rng() * 26);
                d += toD(bolt(rng, o, radial(o, ang, s.len * (0.25 + rng() * 0.2)), 0.22, 4));
              }
            }
            vars.push(d);
          }
          return vars;
        });
        var SVGNS = "http://www.w3.org/2000/svg";
        var boltEls = [];
        ["boltGlow", "boltMid", "boltCore"].forEach(function (gid, layer) {
          var g = document.getElementById(gid);
          for (var i = 0; i < SLOTS.length; i++) {
            var p = document.createElementNS(SVGNS, "path");
            p.setAttribute("fill", "none");
            p.setAttribute("stroke-linecap", "round");
            p.setAttribute("stroke-linejoin", "round");
            p.setAttribute("stroke", layer === 0 ? "#2f7dff" : layer === 1 ? "#9fcbff" : "#f6fbff");
            p.setAttribute("stroke-width", layer === 0 ? "13" : layer === 1 ? "4.2" : "1.7");
            p.setAttribute("opacity", "0");
            g.appendChild(p);
            (boltEls[i] = boltEls[i] || [])[layer] = p;
          }
        });
        function boltsAt(f) {
          var on = [];
          if (f === K.drop) {
            for (var s = 0; s < SLOTS.length; s++) on.push([s, 0, 1]);
          } else if (f > K.drop && f <= K.drop + 14) {
            var prob = 0.8 - (f - K.drop - 1) * 0.045;
            for (var s2 = 0; s2 < SLOTS.length; s2++) {
              if (hash(f, s2) < prob) on.push([s2, Math.floor(hash(f, s2 + 50) * 3), 0.55 + 0.45 * hash(f, s2 + 90)]);
            }
          } else if (f === K.p1 || f === K.p1 + 1 || f === K.p2 || f === K.p2 + 1) {
            var base = f >= K.p2 ? 3 : 0;
            on.push([7 + ((f + base) % 3), f % 3, 0.85]);
            on.push([(f * 7 + base) % 7, (f + 1) % 3, 0.6]);
          }
          return on;
        }
        var boltState = [];
        function drawBolts(f) {
          var on = boltsAt(f);
          var vis = {};
          for (var i = 0; i < on.length; i++) vis[on[i][0]] = on[i];
          for (var s = 0; s < SLOTS.length; s++) {
            var e = vis[s];
            var key = e ? e[1] + ":" + e[2].toFixed(2) : "off";
            if (boltState[s] === key) continue;
            boltState[s] = key;
            for (var layer = 0; layer < 3; layer++) {
              var el = boltEls[s][layer];
              if (!e) { el.setAttribute("opacity", "0"); continue; }
              el.setAttribute("d", BOLTS[s][e[1]]);
              el.setAttribute("opacity", (e[2] * (layer === 0 ? 0.75 : layer === 1 ? 0.9 : 1)).toFixed(2));
            }
          }
        }

        // ---------- rim light: traced from the top corner both ways (23.350 -> 23.933), then the inner edges ----------
        var rimGlowPaths = document.querySelectorAll("#rimGlow path");
        var rimCorePaths = document.querySelectorAll("#rimCore path");
        var sparkA = document.getElementById("sparkA");
        var sparkB = document.getElementById("sparkB");
        var lenA = rimCorePaths[0].getTotalLength();
        var lenB = rimCorePaths[1].getTotalLength();
        var RIM_T0 = T.emerge, RIM_DUR = T.b2 - T.emerge + 0.02;
        var INNER = [[2, T.b2 - 0.08, 0.42], [3, T.b2 - 0.02, 0.3], [4, T.b2 + 0.06, 0.3], [5, T.b2 + 0.1, 0.48]];
        function rimLevel(t) {
          if (t < RIM_T0) return 0;
          if (t < T.b2 + 0.1) return 1;
          if (t < T.b4) return 1 - 0.45 * eOut(seg(t, T.b2 + 0.1, 0.5));
          if (t < TD) return 0.55 + 0.45 * eIn(seg(t, T.b4, TD - T.b4));
          return 1 - eOut(seg(t, TD + 0.1, 0.55));
        }
        var lastRim = {};
        function setRim(i, prog, level) {
          var off = (1 - prog).toFixed(4);
          var op = prog <= 0 ? 0 : level;
          var key = off + "|" + op.toFixed(3);
          if (lastRim[i] === key) return;
          lastRim[i] = key;
          rimCorePaths[i].style.strokeDashoffset = off;
          rimGlowPaths[i].style.strokeDashoffset = off;
          rimCorePaths[i].style.opacity = op.toFixed(3);
          rimGlowPaths[i].style.opacity = Math.min(1, op * 0.95).toFixed(3);
        }
        var lastSpark = "";
        function drawRim(t) {
          var lv = rimLevel(t);
          var p = eIO(seg(t, RIM_T0, RIM_DUR));
          setRim(0, p, lv);
          setRim(1, p, lv);
          for (var j = 0; j < INNER.length; j++) setRim(INNER[j][0], eIO(seg(t, INNER[j][1], INNER[j][2])), lv * 0.9);
          var drawing = p > 0 && p < 1;
          var sOp = drawing ? Math.min(1, p * 8, (1 - p) * 8) : 0;
          var key = drawing ? p.toFixed(4) : "off";
          if (key === lastSpark) return;
          lastSpark = key;
          if (drawing) {
            var a = rimCorePaths[0].getPointAtLength(p * lenA);
            var b = rimCorePaths[1].getPointAtLength(p * lenB);
            sparkA.setAttribute("cx", a.x.toFixed(1));
            sparkA.setAttribute("cy", a.y.toFixed(1));
            sparkB.setAttribute("cx", b.x.toFixed(1));
            sparkB.setAttribute("cy", b.y.toFixed(1));
          }
          sparkA.setAttribute("opacity", sOp.toFixed(3));
          sparkB.setAttribute("opacity", sOp.toFixed(3));
        }

        // ---------- dust motes in the beam: pulled in before the drop, blown out on it ----------
        var dust = document.getElementById("dust").getContext("2d");
        var MOTES = [];
        (function () {
          var r = MO.rng(4242);
          for (var i = 0; i < 110; i++) {
            MOTES.push({
              x: 540 + (r() - 0.5) * 1150, y: 180 + r() * 1450, vx: (r() - 0.5) * 12, vy: -(6 + r() * 26),
              wob: 5 + r() * 16, wf: 0.35 + r() * 0.9, ph: r() * 6.283, size: 0.7 + Math.pow(r(), 2.2) * 3.0,
              tw: r() * 6.283, twf: 1.2 + r() * 3.2,
            });
          }
        })();
        function drawDust(t) {
          dust.clearRect(0, 0, 1080, 1920);
          var base = eIO(seg(t, T.emerge, 1.2));
          if (base <= 0) return;
          var pull = t < T.b4 ? 0 : t < TD ? 0.42 * Math.pow(seg(t, T.b4, TD - T.b4), 2.2) : 0.42 * Math.exp(-(t - TD) * 9);
          var blast = t < TD ? 0 : 1 - Math.exp(-(t - TD) * 4.2);
          var lit = t < TD ? 1 : 1.25 + 1.6 * Math.exp(-(t - TD) * 3);
          dust.globalCompositeOperation = "lighter";
          for (var i = 0; i < MOTES.length; i++) {
            var m = MOTES[i];
            var x = m.x + m.vx * t + m.wob * Math.sin(m.wf * t + m.ph);
            var y = m.y + m.vy * t;
            var dx = x - C[0], dy = y - C[1];
            var dist = Math.hypot(dx, dy) || 1;
            x -= dx * pull;
            y -= dy * pull;
            var push = (blast * 320) / (1 + dist / 420);
            x += (dx / dist) * push;
            y += (dy / dist) * push;
            var cone = 150 + Math.max(0, y) * 0.2;
            var inBeam = Math.exp(-Math.pow((x - 540) / cone, 2));
            var tw = 0.55 + 0.45 * Math.sin(m.twf * t + m.tw);
            var a = Math.min(1, base * (0.18 + 0.82 * inBeam) * tw * 0.75 * lit);
            if (a < 0.01) continue;
            dust.fillStyle = "rgba(170,205,255," + (a * 0.16).toFixed(3) + ")";
            dust.beginPath();
            dust.arc(x, y, m.size * 3.2, 0, 6.2832);
            dust.fill();
            dust.fillStyle = "rgba(225,238,255," + a.toFixed(3) + ")";
            dust.beginPath();
            dust.arc(x, y, m.size, 0, 6.2832);
            dust.fill();
          }
        }

        // ---------- embers blown out of the mark on the drop ----------
        var sp = document.getElementById("sparks").getContext("2d");
        var EMBERS = [];
        (function () {
          var poly = [V.T, V.R, P(428, 82), V.N, V.MR, V.BR, V.BR2, V.BF, V.BL, V.L];
          var cum = [0];
          for (var i = 0; i < poly.length; i++) {
            var q0 = poly[i], q1 = poly[(i + 1) % poly.length];
            cum.push(cum[i] + Math.hypot(q1[0] - q0[0], q1[1] - q0[1]));
          }
          var per = cum[cum.length - 1];
          var r = MO.rng(777);
          for (var e = 0; e < 60; e++) {
            var u = r() * per, j = 0;
            while (cum[j + 1] < u) j++;
            var a0 = poly[j], a1 = poly[(j + 1) % poly.length];
            var w = (u - cum[j]) / (cum[j + 1] - cum[j]);
            var ox = a0[0] + (a1[0] - a0[0]) * w, oy = a0[1] + (a1[1] - a0[1]) * w;
            var ang = Math.atan2(oy - C[1], ox - C[0]) + (r() - 0.5) * 0.7;
            var speed = 420 + r() * 1100;
            EMBERS.push({ ox: ox, oy: oy, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, life: 0.4 + r() * 0.7, w: 1.2 + r() * 2.0, hue: r() });
          }
        })();
        function emberPos(e, tau) {
          var f = (1 - Math.exp(-3.4 * tau)) / 3.4;
          return [e.ox + e.vx * f, e.oy + e.vy * f + 160 * tau * tau];
        }
        function drawEmbers(t) {
          sp.clearRect(0, 0, 1080, 1920);
          var tau = t - TD;
          if (tau < 0 || tau > 1.2) return;
          sp.globalCompositeOperation = "lighter";
          sp.lineCap = "round";
          for (var i = 0; i < EMBERS.length; i++) {
            var e = EMBERS[i];
            if (tau > e.life) continue;
            var a = Math.pow(1 - tau / e.life, 1.3);
            var p1 = emberPos(e, tau);
            var p0 = emberPos(e, Math.max(0, tau - 0.028));
            var col = e.hue < 0.55 ? "200,225,255" : "110,170,255";
            sp.strokeStyle = "rgba(" + col + "," + (a * 0.3).toFixed(3) + ")";
            sp.lineWidth = e.w * 3.4;
            sp.beginPath();
            sp.moveTo(p0[0], p0[1]);
            sp.lineTo(p1[0], p1[1]);
            sp.stroke();
            sp.strokeStyle = "rgba(240,248,255," + (a * 0.9).toFixed(3) + ")";
            sp.lineWidth = e.w;
            sp.beginPath();
            sp.moveTo(p0[0], p0[1]);
            sp.lineTo(p1[0], p1[1]);
            sp.stroke();
            sp.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
            sp.beginPath();
            sp.arc(p1[0], p1[1], e.w * 0.9, 0, 6.2832);
            sp.fill();
          }
        }

        // ---------- camera shake (drop + pulses), mark tremble (build), grain offset ----------
        var shakeEl = document.getElementById("shake");
        var trembleEl = document.getElementById("markTremble");
        var grainEl = document.getElementById("grain");
        var lastShake = "", lastTremble = "", lastGrain = "";
        function camera(t, f) {
          var A = 0;
          if (t >= TD) A += 20 * Math.exp(-(t - TD) * 7.5);
          if (t >= H(K.p1)) A += 5 * Math.exp(-(t - H(K.p1)) * 12);
          if (t >= H(K.p2)) A += 5 * Math.exp(-(t - H(K.p2)) * 12);
          var s = A > 0.05
            ? "translate(" + (A * (hash(f, 3) - 0.5) * 2).toFixed(2) + "px," + (A * (hash(f, 4) - 0.5) * 2).toFixed(2) + "px) rotate(" + (A * 0.04 * (hash(f, 5) - 0.5)).toFixed(3) + "deg)"
            : "none";
          if (s !== lastShake) { shakeEl.style.transform = s; lastShake = s; }
          var B = t >= T.b4 + 0.15 && t < TD ? 2.4 * Math.pow(seg(t, T.b4 + 0.15, TD - T.b4 - 0.15), 2) : 0;
          var s2 = B > 0.05 ? "translate(" + (B * (hash(f, 11) - 0.5) * 2).toFixed(2) + "px," + (B * (hash(f, 12) - 0.5) * 2).toFixed(2) + "px)" : "none";
          if (s2 !== lastTremble) { trembleEl.style.transform = s2; lastTremble = s2; }
          var g = Math.floor(hash(f, 21) * 256) + "px " + Math.floor(hash(f, 22) * 256) + "px";
          if (g !== lastGrain) { grainEl.style.backgroundPosition = g; lastGrain = g; }
        }

        // ================= keyframe rigs (all pure functions of t) =================
        var R = [];
        function rig(sel, init, write) { var r = MO.rig(sel, init, write); R.push(r); return r; }
        function pulses(track, peak, rest) {
          [K.p1, K.p2].forEach(function (k) { MO.pulse(track, H(k), peak, 0.06, 0.45, rest); });
        }

        // ---- ping (frame 4 = 22.900): the green unread pill pops with two ripples, then fades ----
        var tPop = 3 * FR + 0.001; // frame 3 still black, frame 4 shows the pop at ~2/3 size
        var ping = rig("#pingCore", { o: 0, s: 0.35, b: 0 });
        ping.to("o", tPop, 0.02, 1, "none").to("s", tPop, 0.32, 1, "back.out(2.6)");
        ping.to("o", 0.44, 0.26, 0, "power2.in").to("s", 0.44, 0.26, 0.55, "power2.in").to("b", 0.44, 0.26, 4, "power2.in");
        var pglow = rig("#pingGlow", { o: 0, s: 0.5 });
        pglow.to("o", tPop, 0.12, 1, "power2.out").to("s", tPop, 0.12, 1, "power2.out");
        pglow.to("o", 0.24, 0.5, 0, "power2.in").to("s", 0.24, 0.5, 1.25, "power2.in");
        rig("#rip1", { o: 0, s: 1 }).to("o", H(K.ping), 0.8, 0, "power2.out", 0.95).to("s", H(K.ping), 0.8, 5.2, "power2.out", 1);
        rig("#rip2", { o: 0, s: 1 }).to("o", H(K.ping) + 0.13, 0.75, 0, "power2.out", 0.8).to("s", H(K.ping) + 0.13, 0.75, 4.2, "power2.out", 1);

        // ---- camera: slow push-in through the emergence, punch on the drop, drift through the hold ----
        rig("#world", { s: 0.9 }).to("s", T.emerge, T.drop - T.emerge, 1, "power1.in").to("s", T.drop, D - T.drop, 1.035, "power1.out");
        rig("#punch", { s: 1 }).to("s", TD, 0.55, 1, "expo.out", 1.085);

        // ---- haze, beam, bloom ----
        rig("#beamWrap", { o: 0 }).to("o", T.emerge, 1.4, 0.32, "sine.inOut").to("o", TD, 0.4, 0.1, "power2.out");
        var fogA = rig("#fogA", { o: 0, x: 0, y: 0 });
        fogA.to("o", T.emerge, 1.4, 0.075, "sine.inOut").to("o", TD, 0.8, 0.12, "power2.out", 0.3);
        fogA.to("x", T.emerge, D - T.emerge, -60, "none").to("y", T.emerge, D - T.emerge, -40, "none");
        rig("#fogBeamWrap", { o: 0 }).to("o", T.emerge + 0.2, 1.5, 0.42, "sine.inOut").to("o", TD, 0.4, 0.16, "power2.out");
        rig("#fogB", { x: 0, y: 0 }).to("x", T.emerge, D - T.emerge, 46, "none").to("y", T.emerge, D - T.emerge, -30, "none");
        var bloom = rig("#bloom", { o: 0, s: 1 });
        bloom.to("o", T.emerge, 1.7, 0.16, "sine.inOut").to("o", T.b4, 0.4, 0.28, "power2.in");
        bloom.to("o", TD - 0.14, 0.12, 0.08, "power2.in"); // the inhale before the drop
        bloom.to("o", TD, 0.8, 0.6, "power2.out", 1).to("s", TD, 0.8, 1, "power2.out", 1.12);
        pulses(bloom.tr.o, 0.95, 0.6);
        pulses(bloom.tr.s, 1.06, 1);
        rig("#bgNavy", { o: 0 }).set("o", TD, 1);

        // ---- the chrome rising out of the dark ----
        var mark = rig("#markImg", { o: 0, br: 0.18, sa: 1.5 });
        mark.to("o", T.b2 - 0.15, 1.45, 0.95, "sine.inOut").to("br", T.b2 - 0.15, 1.45, 0.5, "sine.inOut").to("sa", T.b2 - 0.15, 1.45, 1.25, "sine.inOut");
        mark.to("br", T.b4, TD - T.b4 - 0.06, 0.7, "power2.in");
        mark.set("o", TD, 1).to("br", TD, 0.5, 1.02, "power2.out", 1.6).to("sa", TD, 0.5, 1.05, "power2.out", 1);
        var mglow = rig("#markGlowWrap", { o: 0 });
        mglow.to("o", T.b2, 1.0, 0.2, "sine.inOut").to("o", T.b4, TD - T.b4, 0.55, "power2.in").to("o", TD, 0.7, 0.42, "power2.out", 1);
        pulses(mglow.tr.o, 0.85, 0.42);
        // the slow light sweep (24.516) and a quick gloss pass after pulse 1
        var sweep = rig("#sweepBand", { xp: -150, r: 18, o: 0 });
        sweep.to("xp", T.b3, 1.05, 200, "sine.inOut", -150).to("o", T.b3, 0.15, 1, "none").to("o", T.b3 + 0.85, 0.2, 0, "power1.in");
        sweep.to("xp", T.p1 + 0.02, 0.5, 200, "power2.inOut", -150).to("o", T.p1 + 0.02, 0.05, 0.85, "none", 0).to("o", T.p1 + 0.45, 0.08, 0, "none");

        // ---- shimmer build (25.100 -> 25.667): glints, a contracting ring (rim + tremble in the driver) ----
        var GT = [T.b4 + 0.05, T.b4 + 0.17, T.b4 + 0.27, T.b4 + 0.36, T.b4 + 0.43, T.b4 + 0.49];
        document.querySelectorAll(".glint i").forEach(function (el, i) {
          var gr = rig(el, { o: 0, s: 0.2, r: 0 });
          gr.to("o", GT[i], 0.07, 1, "power2.out").to("s", GT[i], 0.07, 1, "power2.out").to("r", GT[i], 0.19, 90, "none");
          gr.to("o", GT[i] + 0.07, 0.12, 0, "power2.in").to("s", GT[i] + 0.07, 0.12, 0.3, "power2.in");
        });
        rig("#ringIn", { o: 0, s: 4.6 }).to("o", T.b4 + 0.2, TD - T.b4 - 0.2, 0.75, "power3.in").to("s", T.b4 + 0.2, TD - T.b4 - 0.2, 0.85, "power3.in").set("o", TD, 0);

        // ---- DROP (frame 87): flash, white-hot mark, shockwaves, anamorphic streak ----
        rig("#flash", { o: 0 }).to("o", TD, 0.26, 0, "expo.out", 0.9);
        rig("#markHot", { o: 0 }).set("o", TD, 1).to("o", TD + 2 * FR, 0.45, 0, "power1.out", 1);
        rig("#shock1", { o: 0, s: 0.42 }).to("o", TD, 0.55, 0, "power1.in", 1).to("s", TD, 0.55, 4.4, "power3.out", 0.42);
        rig("#shock2", { o: 0, s: 0.35 }).to("o", TD, 0.7, 0, "power2.in", 0.95).to("s", TD, 0.7, 3.4, "power3.out", 0.35);
        rig("#streak", { o: 0, sx: 0.15 }).to("sx", TD, 0.3, 1, "expo.out").set("o", TD, 1).to("o", TD + 0.08, 0.55, 0, "power2.in");
        var pr = rig("#pulseRing", { o: 0, s: 0.95 });
        [K.p1, K.p2].forEach(function (k) {
          pr.to("o", H(k), 0.55, 0, "power2.out", 0.7).to("s", H(k), 0.55, 2.3, "power2.out", 0.95);
        });

        // ---- SHELF slams in under the mark: huge, blurred and white-hot on the drop frame, crisp 5 frames later ----
        rig("#shelfWrap", { o: 0, s: 1.36, y: -22, b: 9 }).set("o", TD, 1)
          .to("s", TD, 0.3, 1, "expo.out").to("y", TD, 0.3, 0, "expo.out").to("b", TD, 0.13, 0, "power2.out");
        rig("#shelfHot", { o: 0 }).set("o", TD, 1).to("o", TD + 2 * FR, 0.38, 0, "power2.out", 1);
        var sglow = rig("#shelfGlow", { o: 0.4 });
        sglow.to("o", TD, 0.7, 0.4, "power2.out", 1);
        pulses(sglow.tr.o, 0.85, 0.4);
        rig("#shelfSheen", { p: -30 }, function (r, v) { r.el.style.setProperty("--p", v.p.toFixed(2) + "%"); })
          .to("p", T.p1 + 0.12, 0.5, 130, "power2.inOut");

        // ---- CAMPUS (frame 97 = 26.033): snaps in, tracking out from tight to wide ----
        var TC = H(K.campus);
        rig("#campus", { o: 0, ls: 0, b: 8 }, function (r, v) {
          r.css("opacity", v.o.toFixed(3));
          r.css("letterSpacing", v.ls.toFixed(4) + "em");
          r.css("paddingLeft", v.ls.toFixed(4) + "em");
          r.css("filter", v.b > 0.05 ? "blur(" + v.b.toFixed(2) + "px)" : "none");
        }).to("o", TC, 0.1, 1, "power2.out").to("ls", TC, 0.55, 0.34, "expo.out").to("b", TC, 0.3, 0, "power2.out");
        rig("#ruleL", { o: 0, sx: 0 }).to("sx", TC + 0.04, 0.55, 1, "expo.out").to("o", TC + 0.04, 0.15, 1, "none");
        rig("#ruleR", { o: 0, sx: 0 }).to("sx", TC + 0.04, 0.55, 1, "expo.out").to("o", TC + 0.04, 0.15, 1, "none");

        // ---- tagline on pulse 2 (26.833) ----
        rig("#tag", { o: 0, y: 14, b: 6, ls: 0.32 }, function (r, v) {
          r.css("opacity", v.o.toFixed(3));
          r.css("transform", "translateY(" + v.y.toFixed(2) + "px)");
          r.css("filter", v.b > 0.05 ? "blur(" + v.b.toFixed(2) + "px)" : "none");
          r.css("letterSpacing", v.ls.toFixed(4) + "em");
          r.css("paddingLeft", v.ls.toFixed(4) + "em");
        }).to("o", H(K.p2), 0.22, 1, "power2.out").to("y", H(K.p2), 0.35, 0, "power3.out").to("b", H(K.p2), 0.22, 0, "power2.out").to("ls", H(K.p2), 0.4, 0.2, "power3.out");

        function render(t) {
          var f = Math.round(t * 30 + 1e-6);
          for (var i = 0; i < R.length; i++) R[i].apply(t);
          drawRim(t);
          drawDust(t);
          drawEmbers(t);
          drawBolts(f);
          camera(t, f);
        }

        // ONE linear driver: every frame is render(t) of the timeline time
        var tl = gsap.timeline({ paused: true });
        var drive = { t: 0 };
        tl.fromTo(drive, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: function () { render(drive.t); } }, 0);
        render(0);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
