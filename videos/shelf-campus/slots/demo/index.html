      /* demo: full, opaque. 32.100 -> 45.500 (402 frames). NO NEW APP / JUST WHATSAPP, then SHELF Campus in a

      .scene { position: absolute; inset: 0; overflow: hidden; }

        position: absolute; left: -210px; top: 470px; width: 1500px; height: 1500px; border-radius: 50%;

      #vig { background: radial-gradient(115% 80% at 50% 48%, rgba(0, 0, 0, 0) 56%, rgba(0, 0, 0, 0.5) 100%); pointer-events: none; }

        background-size: 200px 200px;

      #chat { position: absolute; left: 0; top: 200px; width: 630px; height: 1200px; overflow: hidden; }
