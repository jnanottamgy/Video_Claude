<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>founders / poster_bg</title>
    <script src="./vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      /* FULL layer (opaque). Output 15.200 -> 18.100 (87 frames), t = out - 15.2.
         "TWO FOUNDERS." poster backdrop: the compositor puts both founders' cut-outs on top (J head ~(300, 930-1150),
         K head ~(895, 1000-1220)), then poster_text. Deep navy studio: blue backlight glows behind both heads, a
         horizon glow at shoulder height with a perspective floor grid below it (visible between and beside them),
         soft light beams from above, drifting dust, a slow push 1 -> 1.06. The glows kick on the text slams
         (15.199, 15.782, 16.366), the detail (16.949) and the pulse (17.532). No text. */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050a16; }
      .scene { position: absolute; inset: 0; }

      #world { position: absolute; inset: 0; transform-origin: 560px 1060px; }
      #base {
        position: absolute;
        inset: -80px;
        background:
          radial-gradient(70% 46% at 54% 56%, #13284f 0%, #0c1a36 38%, #081127 64%, #050a16 100%),
          #050a16;
      }
      .glow { position: absolute; border-radius: 50%; pointer-events: none; }
      #glowJ, #glowK { opacity: 0.62; }
      #glowJ {
        left: -160px;
        top: 600px;
        width: 920px;
        height: 920px;
        background: radial-gradient(circle at center, rgba(96, 168, 255, 0.55) 0%, rgba(79, 157, 255, 0.30) 26%, rgba(31, 95, 214, 0.12) 50%, rgba(31, 95, 214, 0) 70%);
      }
      #glowK {
        left: 440px;
        top: 660px;
        width: 920px;
        height: 920px;
        background: radial-gradient(circle at center, rgba(96, 168, 255, 0.50) 0%, rgba(79, 157, 255, 0.28) 26%, rgba(31, 95, 214, 0.11) 50%, rgba(31, 95, 214, 0) 70%);
      }
      #glowTop {
        left: 40px;
        top: 160px;
        width: 1000px;
        height: 760px;
        background: radial-gradient(ellipse at center, rgba(58, 110, 200, 0.20) 0%, rgba(40, 80, 170, 0.08) 45%, rgba(40, 80, 170, 0) 70%);
      }
      /* light beams from above */
      .beam {
        position: absolute;
        top: -260px;
        width: 260px;
        height: 1700px;
        transform-origin: 50% 0%;
        background: linear-gradient(90deg, rgba(140, 190, 255, 0) 0%, rgba(140, 190, 255, 0.075) 35%, rgba(170, 210, 255, 0.11) 50%, rgba(140, 190, 255, 0.075) 65%, rgba(140, 190, 255, 0) 100%);
        -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.8) 45%, transparent 92%);
        mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.8) 45%, transparent 92%);
        filter: blur(6px);
      }
      /* horizon + floor */
      #horizon {
        position: absolute;
        left: -100px;
        top: 1176px;
        width: 1280px;
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg, rgba(79, 157, 255, 0) 0%, rgba(120, 185, 255, 0.55) 30%, rgba(200, 228, 255, 0.85) 50%, rgba(120, 185, 255, 0.55) 70%, rgba(79, 157, 255, 0) 100%);
        box-shadow: 0 0 30px rgba(var(--glow), 0.55), 0 0 90px rgba(var(--glow), 0.35);
        filter: blur(1.5px);
      }
      #floorWrap { position: absolute; left: 0; top: 1180px; width: 1080px; height: 740px; overflow: hidden; perspective: 520px; perspective-origin: 50% 0%; }
      #floor {
        position: absolute;
        left: -1460px;
        top: 0;
        width: 4000px;
        height: 2400px;
        transform-origin: 50% 0%;
        transform: rotateX(78deg);
        background:
          repeating-linear-gradient(90deg, rgba(110, 175, 255, 0.55) 0px, rgba(110, 175, 255, 0.55) 3px, transparent 3px, transparent 100px),
          repeating-linear-gradient(0deg, rgba(110, 175, 255, 0.55) 0px, rgba(110, 175, 255, 0.55) 3px, transparent 3px, transparent 100px);
        -webkit-mask-image: radial-gradient(60% 70% at 50% 0%, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.45) 40%, transparent 85%);
        mask-image: radial-gradient(60% 70% at 50% 0%, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.45) 40%, transparent 85%);
        opacity: 0.55;
      }
      #floorShade {
        position: absolute;
        left: 0;
        top: 1180px;
        width: 1080px;
        height: 740px;
        background: linear-gradient(180deg, rgba(5, 10, 22, 0) 0%, rgba(5, 10, 22, 0.35) 40%, rgba(5, 10, 22, 0.85) 100%);
      }
      /* dust */
      #dust { position: absolute; inset: 0; }
      .mote { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(220, 236, 255, 0.95) 0%, rgba(150, 200, 255, 0.5) 45%, rgba(150, 200, 255, 0) 70%); }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(85% 62% at 50% 55%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="2.9" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="2.9" data-track-index="0">
        <div id="world" data-layout-allow-overflow>
          <div id="base"></div>
          <div class="glow" id="glowTop"></div>
          <div class="beam" id="beam1" style="left: 120px"></div>
          <div class="beam" id="beam2" style="left: 410px"></div>
          <div class="beam" id="beam3" style="left: 700px"></div>
          <div class="glow" id="glowJ"></div>
          <div class="glow" id="glowK"></div>
          <div id="floorWrap"><div id="floor"></div></div>
          <div id="floorShade"></div>
          <div id="horizon"></div>
          <div id="dust" aria-hidden="true"></div>
        </div>
        <div id="vignette"></div>
      </div>
    </div>
    <script>
      // ---------- deterministic dust ----------
      function mulberry32(a) {
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          var t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rnd = mulberry32(20261024);
      var dust = document.getElementById("dust");
      var motes = [];
      for (var i = 0; i < 54; i++) {
        var far = rnd() < 0.7;                       // most are small and sharp; some big soft bokeh
        var size = far ? 3 + rnd() * 5 : 10 + rnd() * 16;
        var m = document.createElement("div");
        m.className = "mote";
        m.style.width = m.style.height = size.toFixed(1) + "px";
        m.style.left = (rnd() * 1080).toFixed(1) + "px";
        m.style.top = (220 + rnd() * 1250).toFixed(1) + "px";
        if (!far) m.style.filter = "blur(" + (2 + rnd() * 3).toFixed(1) + "px)";
        m.setAttribute("data-layout-allow-overlap", "");
        dust.appendChild(m);
        motes.push({ el: m, dx: (rnd() - 0.5) * (far ? 40 : 90), dy: -(20 + rnd() * (far ? 50 : 110)), a: far ? 0.35 + rnd() * 0.5 : 0.18 + rnd() * 0.25, ph: rnd() });
      }

      // ---------- timeline ----------
      var T0 = 15.2;
      function at(out) { return Math.max(0, Math.round(out * 30) / 30 - T0 - 0.004); }
      var D = 2.9;
      var tl = gsap.timeline({ paused: true });

      // slow push
      tl.fromTo("#world", { scale: 1 }, { scale: 1.06, duration: D, ease: "sine.inOut" }, 0);
      // beams sway
      tl.fromTo("#beam1", { rotation: 16 }, { rotation: 12, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo("#beam2", { rotation: 4 }, { rotation: -1, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo("#beam3", { rotation: -12 }, { rotation: -17, duration: D, ease: "sine.inOut" }, 0);
      // floor drifts toward camera (grid lines slide down a cell over the shot)
      tl.fromTo("#floor", { y: 0 }, { y: 100, duration: D, ease: "none" }, 0);
      // dust drifts up and twinkles: one linear driver, every mote a pure function of time (seek-safe)
      var drive = { t: 0 };
      function paintDust() {
        var u = drive.t;
        for (var j = 0; j < motes.length; j++) {
          var o = motes[j], p = u / D;
          var tw = 0.5 + 0.5 * Math.sin(6.2832 * (o.ph + u * (0.45 + o.ph * 0.7)));
          o.el.style.transform = "translate(" + (o.dx * p).toFixed(2) + "px," + (o.dy * p).toFixed(2) + "px)";
          o.el.style.opacity = (o.a * (0.35 + 0.65 * tw)).toFixed(3);
        }
      }
      tl.fromTo(drive, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: paintDust }, 0);
      paintDust();

      // glow kicks on the beats (the text slams; the detail; the pulse)
      var kicks = [[at(15.199), 1.0], [at(15.782), 0.85], [at(16.366), 0.85], [at(16.949), 0.5], [at(17.532), 0.6]];
      var REST = 0.62; // = the CSS opacity of the two head glows
      kicks.forEach(function (k, idx) {
        var tp = k[0], amp = k[1];
        var dk = idx < kicks.length - 1 ? Math.min(0.5, kicks[idx + 1][0] - tp - 0.08) : 0.5;
        tl.to(["#glowJ", "#glowK"], { opacity: REST + (1 - REST) * amp, scale: 1 + 0.06 * amp, duration: 0.06, ease: "power2.out", immediateRender: false }, tp);
        tl.to(["#glowJ", "#glowK"], { opacity: REST, scale: 1, duration: dk, ease: "power2.out", immediateRender: false }, tp + 0.06);
        tl.fromTo("#horizon", { opacity: 1 }, { opacity: 0.7, duration: dk + 0.06, ease: "power2.out", immediateRender: false }, tp);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
