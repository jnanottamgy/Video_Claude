  <body>
    <!--
      evidence_behind: the investigation board. Output window 4.267 -> 9.933 s (170 frames), layer BEHIND.
      Three pieces of WhatsApp evidence slap onto the wall, get pinned and joined by red string; on
      Kartik's "Bro, what assignment!" the board panics and an UNSOLVED tag slaps across it.
      All motion is a pure function of time (one linear GSAP driver tween samples render(t)).
    -->
    <div id="stage" data-composition-id="main" data-start="0" data-duration="5.666" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="5.666" data-track-index="0">
        <div id="board">
          <div id="hdr"><div class="tape l"></div><div class="strip"></div><span class="txt" id="hdrTxt"></span><div class="tape r"></div></div>
          <div id="exLayer"></div>
          <div id="tentLayer"></div>
          <svg id="strs" width="1080" height="1920" viewBox="0 0 1080 1920">
            <defs><filter id="sblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4" /></filter></defs>
          </svg>
          <div id="pinLayer"></div>
          <div id="tag">
            <div class="t-sh"></div><div class="t-glow"></div>
            <div class="t-body"><div class="rule1"></div><div class="hole"></div><div class="q"><span>?</span></div><div class="w">UNSOLVED</div></div>
            <svg class="loop" viewBox="0 0 130 120"><path d="M118 46 C 92 30, 40 22, 18 52 C 2 76, 20 104, 52 98" fill="none" stroke="#c1121f" stroke-width="4.5" stroke-linecap="round" /></svg>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var FPS = 30;
        var DUR = 5.666;
        function T(f) { return f / FPS; }
        function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
        function lerp(a, b, p) { return a + (b - a) * p; }
        function seg(t, t0, d) { return clamp((t - t0) / d, 0, 1); }
        var ez = WA.ease;
        var P2O = ez("power2.out"), P3O = ez("power3.out"), P2IO = ez("power2.inOut"), P2I = ez("power2.in"), EXO = ez("expo.out");
        var BACK = ez("back.out(1.4)"), BACK2 = ez("back.out(2.4)"), BACK3 = ez("back.out(1.15)");
        var D2R = Math.PI / 180;
        function rot(x, y, deg) { var a = deg * D2R, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; }

        /* ---------- cues: comp frames (frame 0 = output 4.2667 s; output frame = 128 + n) ---------- */
        var CUE = {
          type0: 1, type1: 13,          // header types 4.30 -> 4.70
          e1: 3,                         // "Maths" 4.37: EXHIBIT 1 lands
          e1pins: [5, 6],
          tent1: 14,                     // beat 4.735*
          mark1: 25,                     // "group" 5.09: red marker ring on its PDF
          e2: 39,                        // "Computer Science" 5.57: EXHIBIT 2 lands
          e2pins: [41, 42],
          s12: [40, 49],                 // string 1 -> 2 draws 5.60 -> lands on the beat 5.901
          tent2: 53,
          mark2: 67,                     // beat 6.485 / "another": marker ring on its PDF
          cut2: 84,                      // 7.067 cut (J punched in ~14% by the compositor)
          e3: 90,                        // "assignment" 7.27: EXHIBIT 3 lands
          e3pins: [92, 93],
          tent3: 97,
          s13: 102,                      // string 1 -> 3 snaps on the beat 7.651
          ring: 107,                     // "deadline" 7.83: the alarm clock rings
          s23: 119,                      // string 2 -> 3 snaps on the beat 8.234
          cut3: 124,                     // 8.400 cut to Kartik
          j1: 127, j2: 137, j3: 147,     // jolts: "Bro" 8.49, beat 8.818, "what" 9.15
          slap: 155                      // "assignment" 9.42: UNSOLVED slaps, string snaps, card swings
        };

        /* ---------- glyphs ---------- */
        var SV = {
          back: '<svg class="back" viewBox="0 0 48 48"><path d="M22 11 9 24l13 13M10 24h30" fill="none" stroke="#aebac1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
          kebab: '<svg class="kebab" viewBox="0 0 8 26"><circle cx="4" cy="4" r="2.6" fill="#aebac1"/><circle cx="4" cy="13" r="2.6" fill="#aebac1"/><circle cx="4" cy="22" r="2.6" fill="#aebac1"/></svg>',
          sigma: '<svg viewBox="0 0 48 48"><path d="M35 11H13l11.5 13L13 37h22" fill="none" stroke="#fff" stroke-width="4.6" stroke-linejoin="round" stroke-linecap="round"/></svg>',
          code: '<svg viewBox="0 0 48 48"><path d="M16 14 6 24l10 10M32 14l10 10-10 10M27.5 10l-7 28" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
          tail: '<svg class="tail" viewBox="0 0 10 13"><path d="M10 0H2.2C.4 0-.5 2 .9 3.3L10 13z" fill="#202c33"/></svg>',
          pdf: '<svg class="pdf" viewBox="0 0 40 50"><path d="M5 1h21l13 13v31a4 4 0 0 1-4 4H5a4 4 0 0 1-4-4V5a4 4 0 0 1 4-4z" fill="#e5534b"/><path d="M26 1v9a4 4 0 0 0 4 4h9z" fill="#f4a49e"/><text x="20" y="40" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11" fill="#fff" letter-spacing="0.4">PDF</text></svg>',
          pin: '<svg viewBox="0 0 16 16"><path d="M10.6 1.4l4 4-2.2.6-2.9 2.9.3 3.3-1.2 1.2-2.6-2.6-3.6 3.6-.9-.1-.1-.9 3.6-3.6L2.4 7.2l1.2-1.2 3.3.3L9.8 3.4z" fill="#8a857a"/></svg>'
        };

        /* ---------- build the exhibits ---------- */
        var exLayer = document.getElementById("exLayer");
        function div(cls, html) { var d = document.createElement("div"); if (cls) d.className = cls; if (html) d.innerHTML = html; return d; }

        // print: a WhatsApp group screenshot, printed with a white border and an EXHIBIT caption
        function makePrint(id, o) {
          var el = div("ex print"); el.id = id;
          el.style.width = o.w + "px"; el.style.height = o.h + "px";
          var sh = div("sh", "<i></i>");
          var body = div("body");
          body.appendChild(div("paper"));
          body.appendChild(div("grain"));
          var shot = div("shot");
          var head = div("wa-head", SV.back + '<div class="wa-av" style="background:' + o.av + '">' + o.glyph + '</div><div class="wa-ht"><div class="wa-name">' + o.name + '</div><div class="wa-sub">' + o.sub + '</div></div>' + SV.kebab);
          var chat = div("wa-chat");
          var bub = div("bub", SV.tail + '<div class="snd" style="color:' + o.sc + '">' + o.sender + '</div><div class="doc">' + SV.pdf + '<div class="doc-t"><div class="doc-n">' + o.file + '</div><div class="doc-m">' + o.meta + '</div></div></div><div class="bt">' + o.time + "</div>");
          bub.style.width = o.bw + "px";
          chat.appendChild(bub);
          shot.appendChild(head); shot.appendChild(chat);
          body.appendChild(shot);
          body.appendChild(div("cap", WA.G.waIcon("wag" + id).replace("<svg ", '<svg class="wa" ') + '<span class="x">EXHIBIT ' + o.n + "</span>"));
          var fx = div("clipfx"); var sheen = div("sheen"); fx.appendChild(sheen); body.appendChild(fx);
          // red marker ring around the PDF (drawn later); ellipse in print coordinates
          var m = o.mark;
          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("class", "mark"); svg.setAttribute("width", o.w); svg.setAttribute("height", o.h); svg.setAttribute("viewBox", "0 0 " + o.w + " " + o.h);
          var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", ringPath(m[0], m[1], m[2], m[3], m[4]));
          svg.appendChild(path); body.appendChild(svg);
          el.appendChild(sh); el.appendChild(body);
          exLayer.appendChild(el);
          var len = path.getTotalLength();
          path.style.strokeDasharray = len + " " + (len + 20);
          path.style.strokeDashoffset = len;
          return { el: el, sh: sh, body: body, sheen: sheen, mark: path, markLen: len };
        }
        // a hand-drawn marker loop: an ellipse that overshoots its start, slightly wobbly
        function ringPath(cx, cy, rx, ry, a0) {
          var pts = [], N = 46, sweep = 2 * Math.PI * 1.13;
          for (var i = 0; i <= N; i++) {
            var u = i / N, a = a0 + sweep * u;
            var wob = 1 + 0.035 * Math.sin(u * 9.0 + 1.3) + 0.06 * u;
            pts.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * (wob - 0.03 * u)]);
          }
          var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
          for (var j = 1; j < pts.length; j++) d += " L" + pts[j][0].toFixed(1) + " " + pts[j][1].toFixed(1);
          return d;
        }

        var P1 = makePrint("e1", {
          n: 1, w: 500, h: 326, name: "MATHS &middot; SEM 4", sub: "214 members",
          av: "linear-gradient(160deg,#7d7bff 0%,#4b48d6 100%)", glyph: SV.sigma,
          sender: "~ Ananya", sc: "#fc9775", file: "M3_Unit2_notes.pdf", meta: "24 pages &middot; PDF &middot; 3.1 MB", time: "11:42 pm",
          bw: 344, mark: [214, 172, 182, 56, -2.75]
        });
        var P2 = makePrint("e2", {
          n: 2, w: 500, h: 326, name: "COMPUTER SCIENCE &middot; CSE-B", sub: "187 members",
          av: "linear-gradient(160deg,#2fb8d8 0%,#137a94 100%)", glyph: SV.code,
          sender: "~ Rahul (CR)", sc: "#53bdeb", file: "DBMS_Unit3_<wbr>FINAL_final_v2.pdf", meta: "18 pages &middot; PDF &middot; 2.4 MB", time: "9:05 pm",
          bw: 372, mark: [228, 186, 196, 72, -2.6]
        });

        // EXHIBIT 3: a torn calendar page with a red alarm clock
        var E3W = 400, E3H = 266;

            var p = P2O(seg(t, T(mk[1]), 0.22));
            var v = (mk[0].markLen * (1 - p)).toFixed(1);
            if (mk[0]._mo !== v) { mk[0]._mo = v; mk[0].mark.style.strokeDashoffset = v; mk[0].mark.style.opacity = p > 0 ? "0.92" : "0"; }
          });

          /* alarm clock: rings on "deadline", again on every jolt and on the slap */
          var RINGS = [[CUE.ring, 1.0, 0.42], [CUE.j1, 0.75, 0.3], [CUE.j2, 0.5, 0.24], [CUE.j3, 0.65, 0.28], [CUE.slap, 1.0, 0.7]];
          var ra = 0;
          for (var ri = 0; ri < RINGS.length; ri++) { var uu = t - T(RINGS[ri][0]); if (uu >= 0) ra = Math.max(ra, RINGS[ri][1] * Math.exp(-uu / RINGS[ri][2])); }
          var par = f % 2 ? 1 : -1;
          var ca = ra > 0.04 ? par * 13 * ra : 0, cy = ra > 0.04 ? -Math.abs(par) * 3 * ra : 0, cs = 1 + 0.12 * ra * (ra > 0.5 ? 1 : 0);
          var ringPop = 0; var ur = t - T(CUE.ring); if (ur >= 0 && ur < 0.2) ringPop = 0.22 * (1 - ur / 0.2);
          setT(P3.clock, LT, "transform", "translateY(" + f1(cy) + "px) rotate(" + ca.toFixed(2) + "deg) scale(" + (0.88 * (cs + ringPop)).toFixed(3) + ")");
          var la = clamp(ra * 1.8, 0, 1);
          setT(P3.ringA, LT, "opacity", (f % 2 ? la : la * 0.35).toFixed(2));
          setT(P3.ringB, LT, "opacity", (f % 2 ? la * 0.35 : la).toFixed(2));
          P3.hammer.setAttribute("transform", ra > 0.04 ? "rotate(" + (par * 28 * Math.min(1, ra * 1.5)).toFixed(1) + " 78 12)" : "");

          /* tents */
          TENTS.forEach(function (tn, i) {
            var c = EX[tn.id], P = PS[tn.id];
            var at = T(c.tentAt) - 1 / FPS;
            if (!P || t < at - 1e-4) { setT(tn.el, tn.L, "visibility", "hidden"); return; }
            setT(tn.el, tn.L, "visibility", "visible");
            var w = world(tn.id, P, c.tent[0], c.tent[1]);
            var p = seg(t, at, 0.34), sy = BACK2(p), sx = lerp(0.6, 1, P3O(p));
            var hop = 0, tr = 0;
            for (var j = 0; j < JOLTS.length; j++) {
              var u = t - T(JOLTS[j][0]);
              if (u >= 0 && u < 0.26) { var hh = (j === 3 ? 30 : 18) * JOLTS[j][1]; hop -= hh * Math.sin(Math.PI * u / 0.26); }
              if (u >= 0) tr += JOLTS[j][1] * 7 * Math.exp(-u / 0.2) * Math.sin(2 * Math.PI * 4 * u + i) * (i % 2 ? 1 : -1);
            }
            var r = P.r * 0.5 + tr + (i === 0 ? -4 : i === 1 ? 5 : -3);
            setT(tn.el, tn.L, "transform", "translate(" + f1(w[0] - 42) + "px," + f1(w[1] - 98 + hop) + "px) rotate(" + r.toFixed(2) + "deg) scale(" + sx.toFixed(3) + "," + Math.max(0.001, sy).toFixed(3) + ")");
          });

          /* pins */
          var PW = {};
          PINS.forEach(function (pn) {
            var P = PS[pn.id];
            var key = pn.id + pn.j;
            if (!P || t < T(pn.at) - 1 / FPS - 1e-4) { setT(pn.el, pn.L, "visibility", "hidden"); PW[key] = P ? world(pn.id, P, pn.lp[0], pn.lp[1]) : null; return; }
            var w = world(pn.id, P, pn.lp[0], pn.lp[1]);
            var sc = 1, so = 1, op = 1;
            var u = t - T(pn.at);
            if (u < -1e-4) { sc = 1.45; so = 3.2; }
            else if (u < 0.1) { sc = lerp(0.9, 1, P2O(u / 0.1)); }
            if (pn === POP) {
              var ul = t - T(CUE.j3);
              if (ul >= 0) { sc *= 1 + 0.16 * Math.exp(-ul / 0.08) + 0.07 * (1 - Math.exp(-ul / 0.05)); so = Math.max(so, 1.9); }
              var up = t - T(CUE.slap);
              if (up >= 0) {
                w = [w[0] + 560 * up, w[1] - 900 * up + 0.5 * 3000 * up * up];
                sc = 1 + 1.4 * up; so = 1 + 18 * up;
                PW.pop = true;
              }
            }
            PW[key] = w;
            setT(pn.el, pn.L, "visibility", op ? "visible" : "hidden");
            var spin = pn === POP && t >= T(CUE.slap) ? (t - T(CUE.slap)) * 900 : 0;
            setT(pn.el, pn.L, "transform", "translate(" + f1(w[0] - 17) + "px," + f1(w[1] - 17) + "px) rotate(" + spin.toFixed(1) + "deg) scale(" + sc.toFixed(3) + ")");
            setT(pn.sh, pn.L, "transform", "translate(" + f1(3 * so) + "px," + f1(5 * so) + "px)");
            setT(pn.sh, pn.L, "opacity", (so > 3 ? 0.25 : 0.85).toFixed(2));
          });

          /* strings */
          var A1 = PW.e10, B2 = PW.e20, C3a = PW.e30, C3b = PW.e31;
          // 1 -> 2: draws 5.60 -> 5.901, twangs, snaps at the slap
          var s12d = null, s12a = null, s12b = null;
          if (A1 && B2 && t >= T(CUE.s12[0]) - 1e-4) {
            var dp = P2IO(seg(t, T(CUE.s12[0]), T(CUE.s12[1] - CUE.s12[0])));
            var g = 7, wv = twang(t, CUE.s12[1], 14, 0);
            if (t < T(CUE.slap)) {
              var E = [lerp(A1[0], B2[0], dp), lerp(A1[1], B2[1], dp) - 46 * Math.sin(Math.PI * dp)];
              s12d = qd(A1, E, g * dp, dp < 1 ? 0 : wv);
            } else {
              // snapped: two halves recoil toward their pins and fall like pendulums
              var us = t - T(CUE.slap);
              var Mx = qpt(A1, B2, g, 0, 0.5);
              s12a = half(A1, Mx, us, 1);
              s12b = half(B2, Mx, us, -1);
            }
          }
          setPath(S12, s12d); setPath(S12a, s12a); setPath(S12b, s12b);
          // 1 -> 3 and 2 -> 3: snap onto EXHIBIT 3 (fast shoot, hard twang)
          setPath(S13, snapString(A1, C3a, CUE.s13, t, 1.1));
          setPath(S23, snapString(B2, C3b, CUE.s23, t, -1.3));

          /* UNSOLVED tag slap */
          var tu = t - T(CUE.slap);
          var TD = 0.2, thit = 1 / 2.15; // back.out(1.15) reaches 1 at p = 1/2.15
          var t0 = T(CUE.slap) - thit * TD;
          if (t < t0 - 1e-4) setT(tag, LT, "visibility", "hidden");
          else {
            setT(tag, LT, "visibility", "visible");
            var p = seg(t, t0, TD), e = BACK3(p), q = 1 - e;
            var sq = tu >= 0 && tu < 0.12 ? 0.06 * Math.sin(Math.PI * tu / 0.12) : 0;
            var sc = 1 + 1.1 * Math.max(q, -0.05);
            var tr = TAG.r - 14 * q;
            var bl = clamp(q * 30, 0, 12);
            setT(tag, LT, "transform", "translate(" + f1(TAG.cx - TAG.w / 2 + 60 * q) + "px," + f1(TAG.cy - TAG.h / 2 - 40 * q) + "px) rotate(" + tr.toFixed(2) + "deg) scale(" + (sc + sq).toFixed(4) + "," + (sc - sq).toFixed(4) + ")");
            setT(tag, LT, "filter", bl > 0.4 ? "blur(" + bl.toFixed(1) + "px)" : "none");
            setT(tagGlow, LT, "opacity", (tu >= 0 ? 0.85 * Math.exp(-tu / 0.06) : 0).toFixed(3));
          }
        }

        // a snapped string half: pinned at P, free end starts at M, recoils and swings down
        function half(P, M, u, side) {
          var dx = M[0] - P[0], dy = M[1] - P[1];
          var L0 = Math.hypot(dx, dy);
          var a0 = Math.atan2(dy, dx), ad = Math.PI / 2;
          var da = ((ad - a0 + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          var ang = ad - da * Math.exp(-u / 0.3) * Math.cos(2 * Math.PI * 1.6 * u) + side * 0.35 * (1 - Math.exp(-u / 0.12));
          var L = L0 * (0.34 + 0.66 * Math.exp(-u / 0.045));
          var F = [P[0] + Math.cos(ang) * L, P[1] + Math.sin(ang) * L];
          var slack = 0.32 * L * (1 - Math.exp(-u / 0.05)) * side;
          var d = qd(P, F, 0, slack);
          // frayed end
          var fx = Math.cos(ang), fy = Math.sin(ang);
          d += " M" + f1(F[0]) + " " + f1(F[1]) + " l" + f1(fx * 9 - fy * 5) + " " + f1(fy * 9 + fx * 5);
          d += " M" + f1(F[0]) + " " + f1(F[1]) + " l" + f1(fx * 10 + fy * 4) + " " + f1(fy * 10 - fx * 4);
          return d;
        }
        function snapString(A, B, land, t, ph) {
          if (!A || !B) return null;
          var D = 4 / FPS, t0 = T(land) - D;
          if (t < t0 + 1e-4) return null;
          var p = P2I(seg(t, t0, D));
          var E = [lerp(A[0], B[0], p), lerp(A[1], B[1], p) - 22 * Math.sin(Math.PI * p)];
          var w = p < 1 ? 0 : twang(t, land, 20, ph);
          return qd(A, E, 5 * p, w);
        }

        var tl = gsap.timeline({ paused: true });
        var clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(clock.t); } }, 0);
        render(0);
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
