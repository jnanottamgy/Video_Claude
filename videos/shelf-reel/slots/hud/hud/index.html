    <style>
      /* ===== S.H.E.L.F reel - HUD slot: exam countdown + phone-call UI =====
         Window 14.300 -> 51.833 s of the reel (1126 frames). Transparent canvas. */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }
      .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      :root { --green: #34c759; }

      /* ---- label: red dot + EXAM IN, em-based so it scales as one piece ---- */
      .lbl { display: inline-flex; align-items: center; font-family: var(--font-ui); font-weight: 700; line-height: 1; letter-spacing: 0.3em; white-space: nowrap; }
      .lbl .ldot { position: relative; flex: none; width: 0.6em; height: 0.6em; margin-right: 0.55em; border-radius: 50%; background: var(--alert); box-shadow: 0 0 0.5em rgba(255, 59, 48, 0.95); }
      .lbl .ping { position: absolute; inset: 0; border-radius: 50%; border: 0.1em solid var(--alert); opacity: 0; }
      .lbl .ltxt { margin-right: -0.3em; }
      .lbl .ch { display: inline-block; white-space: pre; }

      /* ---- big slam clock ---- */
      #slamScrim { position: absolute; left: -100px; top: 206px; width: 1280px; height: 680px; opacity: 0;
        background: radial-gradient(closest-side, rgba(12, 5, 7, 0.7), rgba(12, 5, 7, 0.46) 50%, rgba(12, 5, 7, 0) 100%); }
      #slamShake { position: absolute; left: 0; top: 0; width: 1080px; height: 1000px; }
      #slamBloom { position: absolute; left: 70px; top: 372px; width: 940px; height: 356px; opacity: 0;
        background: radial-gradient(closest-side, rgba(255, 74, 54, 0.78), rgba(255, 40, 30, 0.3) 55%, rgba(255, 40, 30, 0) 100%); }
      #bigLabelFly { position: absolute; left: 0; top: 392px; width: 1080px; height: 30px; display: flex; justify-content: center; align-items: center; }
      #bigLabel { font-size: 30px; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55), 0 0 18px rgba(0, 0, 0, 0.5); }
      #bigClockFly { position: absolute; left: 0; top: 454px; width: 1080px; height: 184px; display: flex; justify-content: center; align-items: center; }
      .bigclock { display: flex; font-family: var(--font-mono); font-weight: 800; font-size: 184px; line-height: 184px; color: var(--alert);
        text-shadow: 0 0 1px rgba(255, 120, 108, 0.7), 0 0 18px rgba(255, 59, 48, 0.55), 0 0 60px rgba(255, 40, 30, 0.4), 0 10px 30px rgba(50, 0, 0, 0.45); }
      #bigClock { opacity: 0; filter: blur(16px); }
      .bigclock .d { width: 0.6em; text-align: center; }
      .bigclock .k { position: relative; display: block; width: 0.34em; height: 184px; }
      .bigclock .k i { position: absolute; left: 13px; width: 36px; height: 36px; border-radius: 7px; background: var(--alert);
        box-shadow: 0 0 18px rgba(255, 59, 48, 0.55), 0 0 60px rgba(255, 40, 30, 0.4), 0 10px 30px rgba(50, 0, 0, 0.45); }
      .bigclock .k i:first-child { top: 40px; }
      .bigclock .k i:last-child { top: 105px; }

      /* ---- exam pill (top-left) ---- */
      #examWrap { position: absolute; left: 64px; top: 236px; height: 64px; opacity: 0; }
      #examPulse { position: relative; height: 64px; transform-origin: 0% 50%; }
      #examPill.hud-pill, .exam-static.hud-pill { position: relative; padding: 0 24px 0 22px; gap: 0; background: rgba(14, 14, 16, 0.84);
        box-shadow: 0 0 0 1.5px rgba(255, 110, 100, 0.26) inset, 0 10px 26px rgba(0, 0, 0, 0.42); }
      .pc { display: flex; align-items: center; gap: 16px; }
      #pillLabel, #pillClock { opacity: 0; }
      .plabel { font-size: 20px; color: rgba(245, 246, 248, 0.68); }
      .pclock { display: flex; align-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 30px; color: var(--text-1); }
      .pclock .col { position: relative; display: block; width: 0.6em; height: 52px; overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 9px, #000 43px, transparent 52px);
        mask-image: linear-gradient(to bottom, transparent 0, #000 9px, #000 43px, transparent 52px); }
      .pclock .row, .pclock .one { position: absolute; left: 0; top: 6px; display: block; width: 100%; height: 40px; line-height: 40px; text-align: center; }
      .pclock .k { position: relative; display: block; width: 0.34em; height: 52px; }

      .pclock .k i:first-child { top: 17.5px; }
      .pclock .k i:last-child { top: 28.5px; }
      #examGlow { position: absolute; inset: 0; border-radius: 32px; opacity: 0;
        box-shadow: 0 0 24px 3px rgba(255, 59, 48, 0.95), 0 0 64px 12px rgba(255, 59, 48, 0.5); }

      .exam-static .ldot { background: #fff; }
      #examFlash, #examHot { position: absolute; inset: 0; border-radius: 32px; background: #fff; opacity: 0; }
      #examHot { box-shadow: 0 0 16px 2px rgba(255, 255, 255, 0.95), 0 0 42px 8px rgba(255, 70, 50, 0.85); }

      /* ---- call card -> call pill ---- */
      #callLayer { opacity: 0; }
      #callShell { position: absolute; left: 160px; top: 236px; width: 856px; height: 270px; overflow: visible;
        filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.44)) drop-shadow(0 3px 8px rgba(0, 0, 0, 0.3)); }

        border: 3px solid rgba(166, 184, 255, 0.95); opacity: 0; }
      #ripG { border-color: rgba(52, 199, 89, 0.95); }
      #avatar { position: absolute; left: 192px; top: 362px; width: 112px; height: 112px; }
      #avatarPop, #avatarThump { position: absolute; inset: 0; }
      .avdisc { position: absolute; inset: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      #avatarFace { background: linear-gradient(150deg, #93adff 0%, #6d5cf6 52%, #9d5cf2 100%);
        box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.34), inset 0 -8px 16px rgba(46, 24, 130, 0.32);
        font: 700 54px/1 var(--font-ui); color: #fff; text-shadow: 0 2px 8px rgba(40, 20, 120, 0.35); }
      #avatarGreen { background: var(--green); opacity: 0; box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.25); }
      #avatarHandset { width: 56px; height: 56px; fill: #fff; }
      #callName { position: absolute; left: 332px; top: 372px; height: 50px; font: 700 42px/50px var(--font-ui); color: var(--text-1);
        white-space: nowrap; transform-origin: 0% 50%; }
      #callStatus { position: absolute; left: 332px; top: 428px; width: 320px; height: 36px; }
      #statusCalling { position: absolute; left: 0; top: 0; font: 500 28px/36px var(--font-ui); color: var(--text-2); white-space: nowrap; }
      #statusCalling .cdot { display: inline-block; width: 9px; text-align: center; }
      #statusLive { position: absolute; left: 0; top: 0; height: 36px; display: flex; align-items: center; gap: 10px; opacity: 0; }
      #liveDot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px rgba(52, 199, 89, 0.85); }
      .tclock { display: flex; align-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 28px; color: rgba(245, 246, 248, 0.88); }
      .tclock .col { position: relative; display: block; width: 0.6em; height: 44px; overflow: hidden;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 5px, #000 39px, transparent 44px);
        mask-image: linear-gradient(to bottom, transparent 0, #000 5px, #000 39px, transparent 44px); }
      .tclock .row { position: absolute; left: 0; top: 3px; display: block; width: 100%; height: 38px; line-height: 38px; text-align: center; }
      .tclock .k { position: relative; display: block; width: 0.34em; height: 44px; }
      .tclock .k i { position: absolute; left: 1.96px; width: 5.6px; height: 5.6px; border-radius: 1.5px; background: currentColor; }
      .tclock .k i:first-child { top: 14px; }
      .tclock .k i:last-child { top: 24.4px; }
      #callEnded { position: absolute; left: 849px; top: 249px; height: 38px; font: 700 28px/38px var(--font-ui); color: #fff; white-space: nowrap; opacity: 0; }
      #cardGlyph { position: absolute; left: 812px; top: 380px; width: 76px; height: 76px; border-radius: 50%;
        background: rgba(52, 199, 89, 0.17); box-shadow: inset 0 0 0 1.5px rgba(52, 199, 89, 0.38);
        display: flex; align-items: center; justify-content: center; }
      #cardGlyphIcon { width: 38px; height: 38px; fill: var(--green); }
    </style>

  <body>

    <script>
      (function () {
        "use strict";

        /* ---- render-chunk hook: chunk renders rewrite these two numbers (0 = full render) ---- */
        var CHUNK_START_FRAME = 0;
        var CHUNK_FRAMES = 0;

        var FPS = 30;
        var DUR = 37.533333; // 1126 frames: output 14.300 -> 51.833

        /* ---- cues, composition seconds (= output seconds - 14.300) ---- */
        var T_IN = 0.24;        // "in"     14.54  -> EXAM IN label
        var T_SLAM = 0.5;       // "8"      14.80  -> 08:00:00 slam
        var T_START = 0.77;     // "hours"  15.07  -> countdown starts (07:59:59 at 16.07)
        var T_CARD = 1.6;       // 15.90 call card slides down
        var T_LAND = 1.8;       // 16.10 clock lands in the corner pill
        var T_CONNECT = 6.98;   // 21.28 "What's up bro?"
        var T_MORPH = 7.24;     // card -> pill, done by 22.0
        var T_END = 30.1;       // 44.40 call ended (cut to laptop)
        var T_RACE = 30.35;     // 44.65 "What the f*ck" -> time-lapse
        var T_RACE_END = 37.1;  // 51.40
        var T_GLITCH = 37.15;   // 51.45 glitch-out, gone by 51.76
        // avatar pulse rings, synced to the ring tones measured in the source audio
        // (ring 1: crescendo 15.87-17.02, ring 2: 18.50-20.03 output s)
        var RIPPLES = [1.92, 2.3, 2.68, 4.21, 4.63, 5.05, 5.47];

        /* ---- layout constants (text widths measured in Chrome with the shipped fonts) ---- */
        var PILL_X = 64, PILL_Y = 236, PILL_H = 64, PILL_CY = PILL_Y + PILL_H / 2;
        var LBL20_W = 145.078;                       // dot + "EXAM IN" at 20px
        var EXAM_DIGITS_W = 6 * 18 + 2 * 0.34 * 30;  // mono 30px cells
        var pillLabelCX = PILL_X + 22 + LBL20_W / 2;
        var pillDigitsCX = PILL_X + 22 + LBL20_W + 16 + EXAM_DIGITS_W / 2;
        var BIG_LBL_CY = 392 + 15, BIG_CLK_CY = 454 + 92, BIG_CX = 540;

        var NAME28_W = 90.922, ENDED28_W = 144.875, TIMER28_W = 4 * 16.8 + 0.34 * 28;
        var CP_R = 1016;                                                   // call pill right edge
        var cpW = 10 + 44 + 12 + NAME28_W + 10 + TIMER28_W + 22;
        var cpL = CP_R - cpW;
        var ceW = 10 + 44 + 12 + ENDED28_W + 22;
        var ceL = CP_R - ceW;
        var SHELL_X = 160;
        var AV_CX = 248, AV_CY = 418, NAME_X = 332, NAME_CY = 397, TIMER_X = 354, TIMER_CY = 446;

        var $ = function (id) { return document.getElementById(id); };
        var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
        var smooth = function (x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
        var smoother = function (x) { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };
        var easeRoll = gsap.parseEase("power3.out");
        var easeOutCubic = gsap.parseEase("power3.out");

        /* ---- seeded PRNG -> fixed jitter table (deterministic, frame-indexed) ---- */
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(0x5eed1426);
        var JN = 4096, J = new Float64Array(JN);
        for (var ji = 0; ji < JN; ji++) J[ji] = rnd();
        function jr(n) { return J[((n % JN) + JN) % JN] * 2 - 1; } // -1..1

        /* ======================= countdown model ======================= */
        // C(t) = elapsed countdown seconds. Real time from T_START, then a time-lapse whose
        // log-rate ramps up (seconds blur, minutes then hours fall) and brakes into ~05:44.
        var V0 = 8 * 3600;
        var C_END = 8148.5;                       // lands on 28800 - 8148 = 05:44:12
        var C_R0 = T_RACE - T_START;              // 29.58
        var RDT = 1 / 600;
        var RN = Math.round((T_RACE_END - T_RACE) / RDT);
        var RTOT = T_RACE_END - T_RACE;
        function rate(tau, Lmax) {
          var brake = 1 - smooth((tau - (RTOT - 0.34)) / 0.34);
          return Math.exp(Lmax * smoother(tau / 5.4)) * brake;
        }
        function integrate(Lmax, out) {
          var c = 0, prev = rate(0, Lmax);
          if (out) out[0] = 0;
          for (var k = 1; k <= RN; k++) {
            var r = rate(k * RDT, Lmax);
            c += 0.5 * (r + prev) * RDT; prev = r;
            if (out) out[k] = c;
          }
          return c;
        }
        var lo = 1, hi = 14, target = C_END - C_R0;
        for (var it = 0; it < 60; it++) { var mid = 0.5 * (lo + hi); if (integrate(mid) < target) lo = mid; else hi = mid; }
        var CR = new Float64Array(RN + 1);
        var cr = integrate(0.5 * (lo + hi), CR);
        for (var k0 = 1; k0 <= RN; k0++) CR[k0] *= target / cr;  // exact landing

        // tick i (1-based) happens when C crosses i
        var nTicks = Math.floor(C_END);
        var ticks = new Float64Array(nTicks);
        var kk = 0;
        for (var i = 1; i <= nTicks; i++) {
          if (i < C_R0) { ticks[i - 1] = T_START + i; continue; }
          var need = i - C_R0;
          while (kk < RN && CR[kk + 1] < need) kk++;
          var seg = CR[kk + 1] - CR[kk];
          var f = seg > 0 ? (need - CR[kk]) / seg : 0;
          ticks[i - 1] = T_RACE + (kk + clamp(f, 0, 1)) * RDT;
        }

        /* ======================= odometer columns ======================= */
        function buildOdometer(host, layout, rowH) {
          var cols = [];
          layout.forEach(function (it) {
            if (it === ":") {
              var k = document.createElement("span"); k.className = "k"; k.innerHTML = "<i></i><i></i>"; host.appendChild(k); return;
            }
            // odometer column: a 4-row window (rows base-1 .. base+2) slides past a masked slot
            var col = document.createElement("span"); col.className = "col";
            col.setAttribute("data-layout-allow-overflow", "");
            var rows = [];
            for (var r = 0; r < 4; r++) { var s = document.createElement("span"); s.className = "row"; col.appendChild(s); rows.push(s); }
            host.appendChild(col);
            cols.push({ el: col, rows: rows, B: it.B, M: it.M, rowH: rowH, ev: null, n0: 0, dir: -1, idx: cols.length });
          });
          return cols;
        }
        var examCols = buildOdometer($("pillClock"), [
          { B: 36000, M: 10 }, { B: 3600, M: 10 }, ":", { B: 600, M: 6 }, { B: 60, M: 10 }, ":", { B: 10, M: 6 }, { B: 1, M: 10 }
        ], 40);
        // the very first tick (08:00:00 -> 07:59:59, the moment the clock lands) rolls as a
        // right-to-left carry cascade; every later tick rolls all changing columns together
        var CASCADE = { 1: 0, 10: 0.035, 60: 0.07, 600: 0.105, 3600: 0.14, 36000: 0.175 };
        examCols.forEach(function (c) {
          c.n0 = Math.floor(V0 / c.B); c.dir = -1;
          var ev = [];
          for (var i = 1; i <= nTicks; i++) if ((V0 - (i - 1)) % c.B === 0) ev.push(ticks[i - 1] + (i === 1 ? CASCADE[c.B] : 0));
          c.ev = new Float64Array(ev);
        });
        var callCols = buildOdometer($("callTimer"), [{ B: 600, M: 6 }, { B: 60, M: 10 }, ":", { B: 10, M: 6 }, { B: 1, M: 10 }], 38);
        var callTicks = [];
        for (var ct = 1; T_CONNECT + ct < T_END; ct++) callTicks.push(ct);
        callCols.forEach(function (c) {
          c.n0 = 0; c.dir = 1;
          c.ev = new Float64Array(callTicks.filter(function (k) { return k % c.B === 0; }).map(function (k) { return T_CONNECT + k; }));
        });

        var ROLL = 0.22;
        function colPos(c, t) {
          var ev = c.ev, a = 0, b = ev.length;
          while (a < b) { var m = (a + b) >> 1; if (ev[m] <= t) a = m + 1; else b = m; }
          var partial = 0;
          for (var k = a - 1; k >= 0; k--) {
            var dt = t - ev[k];
            if (dt >= ROLL) break;
            partial += 1 - easeRoll(dt / ROLL);
          }
          return c.n0 + c.dir * (a - partial);
        }
        function placeCol(c, p) {
          var base = Math.floor(p + 1e-9);
          for (var j = 0; j < 4; j++) {
            var k = base - 1 + j;
            var dg = String(((k % c.M) + c.M) % c.M);
            var sp = c.rows[j];
            if (sp.textContent !== dg) sp.textContent = dg;
            var o = Math.abs(k - p) < 0.985 ? "1" : "0";  // rows fully outside the slot are hidden
            if (sp.style.opacity !== o) sp.style.opacity = o;
            sp.style.transform = "translate3d(0," + ((k - p) * c.rowH).toFixed(2) + "px,0)";
          }
        }

        // final digits for the static glitch copies
        function fmt2(n) { return (n < 10 ? "0" : "") + n; }
        var VEND = V0 - nTicks;
        var endStr = fmt2(Math.floor(VEND / 3600)) + ":" + fmt2(Math.floor((VEND % 3600) / 60)) + ":" + fmt2(VEND % 60);
        function staticPill() {
          var el = document.createElement("div");
          el.className = "hud-pill exam-static";
          var cells = "";
          for (var q = 0; q < endStr.length; q++) {
            var ch = endStr.charAt(q);
            cells += ch === ":" ? '<span class="k"><i></i><i></i></span>' : '<span class="col"><span class="one">' + ch + "</span></span>";
          }
          el.innerHTML = '<div class="pc"><span class="lbl plabel"><span class="ldot"></span><span class="ltxt">EXAM IN</span></span><span class="pclock">' + cells + "</span></div>";
          return el;
        }
        var BANDS = [[0, 27], [27, 51], [51, 77], [77, 100]];
        var slices = BANDS.map(function (b) {
          var s = staticPill();
          s.style.clipPath = "inset(" + b[0] + "% -40px " + (100 - b[1]) + "% -40px)";
          $("slices").appendChild(s);
          return s;
        });

        /* ======================= procedural layer ======================= */
        var el = {
          examPulse: $("examPulse"), examGlow: $("examGlow"), pillPing: $("pillPing"), bigPing: $("bigPing"),
          ghostC: $("ghostC"), ghostM: $("ghostM"), shake: $("slamShake"), glyph: $("cardGlyphIcon"),
          thump: $("avatarThump"), cdots: document.querySelectorAll("#statusCalling .cdot")
        };
        function ping(node, t, tp, dur) {
          var u = (t - tp) / dur;
          if (tp < 0 || u < 0 || u >= 1) { node.style.opacity = "0"; return; }
          node.style.opacity = (0.85 * Math.pow(1 - u, 1.4)).toFixed(3);
          node.style.transform = "scale(" + (1 + 2.1 * easeOutCubic(u)).toFixed(3) + ")";
        }
        var THUMPS = RIPPLES.concat([T_CONNECT]);

        function renderProc(t) {
          var fr = Math.round(t * FPS);
          var racing = t >= T_RACE;
          var tau = Math.min(t, T_GLITCH) - T_RACE;

          /* exam odometer: rolls, motion blur when racing, slight jitter */
          var jit = racing ? 1.7 * smooth(tau / 2.5) : 0;
          for (var c = 0; c < examCols.length; c++) {
            var col = examCols[c];
            var p = colPos(col, t);
            placeCol(col, p);
            var blur = 0;
            if (racing && t < T_RACE_END + 0.2) {
              var v = Math.abs(p - colPos(col, t - 1 / FPS));
              blur = clamp((v - 0.3) * 2.0, 0, 3.4);
            }
            col.el.style.filter = blur > 0.05 ? "blur(" + blur.toFixed(2) + "px)" : "none";
            col.el.style.transform = jit > 0 && t < T_GLITCH
              ? "translate(" + (jr(fr * 7 + c * 31) * jit).toFixed(2) + "px," + (jr(fr * 5 + c * 17 + 3) * jit * 0.6).toFixed(2) + "px)"
              : "none";
          }

          /* call timer odometer */
          for (var d = 0; d < callCols.length; d++) placeCol(callCols[d], colPos(callCols[d], t));

          /* dot pings: big label on "hours", pill once per real-time tick */
          ping(el.bigPing, t, T_START, 0.75);
          var pillTick = -1;
          if (t >= T_START + 1 && t < T_RACE) pillTick = T_START + Math.floor(t - T_START);
          ping(el.pillPing, t, pillTick, 0.75);

          /* pill: landing bump, then race pulses (accelerating 1.5 -> 6 Hz) */
          var s = 1, glow = 0;
          var dl = t - T_LAND;
          if (dl > 0 && dl < 0.6) s = 1 + 0.06 * Math.exp(-dl * 9) * Math.sin(dl * 21);
          if (racing) {
            var ph = 1.5 * tau + (4.5 / (2 * RTOT)) * tau * tau;
            var pulse = Math.exp(-(ph - Math.floor(ph)) * 4.2);
            s = 1 + 0.085 * smooth(tau / 0.45) + 0.05 * pulse;
            glow = (0.3 + 0.7 * pulse) * smooth(tau / 0.2);
            if (t >= T_GLITCH) glow *= Math.max(0, 1 - (t - T_GLITCH) / 0.15);
          }
          el.examPulse.style.transform = "scale(" + s.toFixed(4) + ")";
          el.examGlow.style.opacity = glow.toFixed(3);

          /* "Calling..." dots */
          var st = Math.floor(Math.max(0, t - T_CARD) / 0.3) % 4;
          for (var q = 0; q < el.cdots.length; q++) el.cdots[q].style.opacity = q < st ? "1" : "0.2";

          /* ringing: glyph wiggle bursts + avatar thump on every pulse ring */
          var rot = 0, th = 0;
          for (var r = 0; r < RIPPLES.length; r++) {
            var x = (t - RIPPLES[r]) / 0.32;
            if (x > 0 && x < 1) rot += 15 * Math.sin(Math.PI * x) * Math.sin(2 * Math.PI * 11 * (t - RIPPLES[r]));
          }
          for (var h = 0; h < THUMPS.length; h++) {
            var y = (t - THUMPS[h]) / 0.3;
            if (y > 0 && y < 1) th += 0.075 * Math.sin(Math.PI * y) * (1 - y);
          }
          el.glyph.style.transform = "rotate(" + rot.toFixed(2) + "deg)";
          el.thump.style.transform = "scale(" + (1 + th).toFixed(4) + ")";

          /* slam impact shake */
          var ds = t - T_SLAM;
          if (ds > 0 && ds < 0.34) {
            var a = 9 * Math.exp(-ds * 12);
            el.shake.style.transform = "translate(" + (jr(fr * 3 + 11) * a).toFixed(2) + "px," + (jr(fr * 9 + 5) * a * 0.6).toFixed(2) + "px)";
          } else el.shake.style.transform = "none";

          /* glitch-out: RGB ghosts + slice tear (quantized per frame) */
          var g = t - T_GLITCH;
          if (g >= 0 && g < 0.34) {
            var env = g < 0.16 ? 1 : Math.max(0, 1 - (g - 0.16) / 0.08);
            for (var sl = 0; sl < slices.length; sl++) {
              var rr = J[(fr * 13 + sl * 7) % JN];
              var off = rr < 0.3 ? 0 : jr(fr * 29 + sl * 13) * 28;
              slices[sl].style.transform = "translateX(" + (off * env).toFixed(2) + "px)";
            }
            el.ghostC.style.transform = "translate(" + (-(5 + 13 * J[(fr * 3 + 1) % JN]) * env).toFixed(2) + "px," + (jr(fr * 5 + 2) * 3 * env).toFixed(2) + "px)";
            el.ghostM.style.transform = "translate(" + ((5 + 13 * J[(fr * 7 + 4) % JN]) * env).toFixed(2) + "px," + (jr(fr * 11 + 6) * 3 * env).toFixed(2) + "px)";
          } else {
            for (var sm = 0; sm < slices.length; sm++) slices[sm].style.transform = "none";
            el.ghostC.style.transform = "none";
            el.ghostM.style.transform = "none";
          }
        }

        /* driver: GSAP writes t through a property setter (never suppressed on seek) */
        var driver = { _t: 0 };
        Object.defineProperty(driver, "t", {
          get: function () { return this._t; },
          set: function (v) { this._t = v; renderProc(v); }
        });

        /* ======================= timeline ======================= */
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(driver, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);

        /* 1. EXAM IN on "in", 08:00:00 slams on "8" */
        tl.fromTo("#slamScrim", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, T_IN);
        // tracking-in: each glyph slides in from a wider spread (transform-only), dot pops
        tl.fromTo("#bigLabel", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, T_IN);
        tl.fromTo("#bigLabel .ch", { x: function (i) { return (i - 3) * 22; } }, { x: 0, duration: 0.42, ease: "expo.out" }, T_IN);
        tl.fromTo("#bigDot", { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(3)" }, T_IN + 0.04);
        tl.fromTo("#bigClock", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", immediateRender: false }, T_SLAM);
        tl.fromTo("#bigClock", { scale: 1.34 }, { scale: 1, duration: 0.2, ease: "back.out(2.4)" }, T_SLAM);
        tl.fromTo("#bigClock", { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.12, ease: "power2.out", immediateRender: false }, T_SLAM);
        tl.fromTo("#slamBloom", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.05, ease: "power2.out" }, T_SLAM);
        tl.to("#slamBloom", { opacity: 0, scale: 1.35, duration: 0.65, ease: "power2.out" }, T_SLAM + 0.05);

        /* 2. shrink + fly into the top-left pill (15.66 -> 16.05); blur peaks at max velocity */
        tl.to("#bigLabelFly", { scale: 1.04, duration: 0.08, ease: "power2.out" }, 1.27);
        tl.to("#bigClockFly", { scale: 1.04, duration: 0.08, ease: "power2.out" }, 1.29);
        tl.to("#slamScrim", { opacity: 0, duration: 0.22, ease: "power1.in" }, 1.36);
        tl.to("#bigLabelFly", { x: pillLabelCX - BIG_CX, y: PILL_CY - BIG_LBL_CY, scale: 20 / 30, duration: 0.34, ease: "power3.inOut" }, 1.36);
        tl.to("#bigClockFly", { x: pillDigitsCX - BIG_CX, y: PILL_CY - BIG_CLK_CY, scale: 30 / 184, duration: 0.37, ease: "power3.inOut" }, 1.38);
        tl.fromTo("#bigLabelFly", { filter: "blur(0px)" }, { filter: "blur(5px)", duration: 0.17, ease: "sine.in", immediateRender: false }, 1.36);
        tl.to("#bigLabelFly", { filter: "blur(0px)", duration: 0.17, ease: "sine.out" }, 1.53);
        tl.fromTo("#bigClockFly", { filter: "blur(0px)" }, { filter: "blur(9px)", duration: 0.185, ease: "sine.in", immediateRender: false }, 1.38);
        tl.to("#bigClockFly", { filter: "blur(0px)", duration: 0.185, ease: "sine.out" }, 1.565);
        tl.fromTo("#examWrap", { opacity: 0, scaleX: 0.35, scaleY: 0.6 }, { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.3, ease: "expo.out" }, 1.5);
        // hand-off: flying copies dissolve into the pill's own label / digits before the first tick (16.07)
        tl.to("#bigLabelFly", { opacity: 0, duration: 0.05, ease: "none" }, 1.65);
        tl.fromTo("#pillLabel", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 1.64);
        tl.to("#bigClockFly", { opacity: 0, duration: 0.05, ease: "none" }, 1.7);
        tl.fromTo("#pillClock", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, 1.69);

        /* 3. in-call card slides down (15.90) */
        tl.fromTo("#callLayer", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.out" }, T_CARD);
        tl.fromTo("#callLayer", { y: -120 }, { y: 0, duration: 0.55, ease: "expo.out", immediateRender: false }, T_CARD);
        tl.fromTo("#callLayer", { filter: "blur(6px)" }, { filter: "blur(0px)", duration: 0.22, ease: "power2.out", immediateRender: false }, T_CARD);
        tl.fromTo("#avatarPop", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, T_CARD + 0.12);
        tl.fromTo("#callName", { x: -18, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, T_CARD + 0.18);
        tl.fromTo("#callStatus", { x: -14, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, T_CARD + 0.24);
        tl.fromTo("#cardGlyph", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" }, T_CARD + 0.28);
        RIPPLES.forEach(function (t0, i) {
          tl.fromTo("#rip" + i, { scale: 1, opacity: 0.8 }, { scale: 1.95, opacity: 0, duration: 0.95, ease: "power2.out", immediateRender: false }, t0);
        });

        /* 4. connected (21.28): timer, green ring */
        tl.to("#statusCalling", { y: -14, opacity: 0, duration: 0.12, ease: "power2.in" }, T_CONNECT);
        tl.fromTo("#statusLive", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "expo.out", immediateRender: false }, T_CONNECT + 0.1);
        tl.fromTo("#ripG", { scale: 1, opacity: 0.95 }, { scale: 2.05, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, T_CONNECT);
        tl.to("#cardGlyph", { backgroundColor: "#34c759", duration: 0.18, ease: "power1.out" }, T_CONNECT);
        tl.to("#cardGlyphIcon", { fill: "#ffffff", duration: 0.18, ease: "power1.out" }, T_CONNECT);

        /* 5. card collapses into the top-right pill (done by 22.0) */
        var MD = 0.5, ME = "power3.inOut";
        tl.to("#shellRect", { attr: { x: cpL - SHELL_X, y: 0, width: cpW, height: 64, rx: 32 }, duration: MD, ease: ME }, T_MORPH);
        tl.to("#avatar", { x: cpL + 32 - AV_CX, y: PILL_CY - AV_CY, scale: 44 / 112, duration: MD, ease: ME }, T_MORPH);
        tl.fromTo("#avatarGreen", { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.inOut", immediateRender: false }, T_MORPH + 0.1);
        tl.to("#avatarFace", { opacity: 0, duration: 0.04, ease: "none" }, T_MORPH + 0.36);
        tl.to("#callName", { x: cpL + 66 - NAME_X, y: PILL_CY - NAME_CY, scale: 28 / 42, duration: MD, ease: ME }, T_MORPH);
        tl.to("#callTimer", { x: cpL + 76 + NAME28_W - TIMER_X, y: PILL_CY - TIMER_CY, duration: MD, ease: ME }, T_MORPH);
        tl.to("#callTimer", { opacity: 0, duration: 0.08, ease: "power1.in" }, T_MORPH);
        tl.to("#callTimer", { opacity: 1, duration: 0.12, ease: "power1.out" }, T_MORPH + MD - 0.1);
        tl.to("#liveDot", { scale: 0, opacity: 0, duration: 0.2, ease: "power2.in" }, T_MORPH);
        tl.to("#cardGlyph", { scale: 0.5, opacity: 0, duration: 0.22, ease: "power2.in" }, T_MORPH);

        /* 6. call ended (44.40): flash red, "Call ended", slide away by 44.90 */
        $("callEnded").style.left = (ceL + 66).toFixed(2) + "px";
        tl.to("#shellRect", { fill: "#ffd0ca", duration: 0.03, ease: "none" }, T_END);
        tl.to("#shellRect", { fill: "#ff3b30", duration: 0.14, ease: "power1.out" }, T_END + 0.03);
        tl.to("#shellRect", { attr: { x: ceL - SHELL_X, width: ceW }, duration: 0.32, ease: "expo.out" }, T_END);
        tl.to("#avatar", { x: ceL + 32 - AV_CX, duration: 0.32, ease: "expo.out" }, T_END);
        tl.to("#avatarGreen", { backgroundColor: "rgba(255,255,255,0.24)", duration: 0.12, ease: "power1.out" }, T_END);
        tl.to("#avatarHandset", { rotation: 135, duration: 0.34, ease: "back.out(1.7)" }, T_END);
        tl.to(["#callName", "#callTimer"], { opacity: 0, duration: 0.1, ease: "power1.in" }, T_END);
        tl.fromTo("#callEnded", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.24, ease: "expo.out", immediateRender: false }, T_END + 0.05);
        tl.to("#shellRect", { fill: "#a3190f", duration: 0.05, ease: "none" }, T_END + 0.2);
        tl.to("#shellRect", { fill: "#ff3b30", duration: 0.05, ease: "none" }, T_END + 0.26);
        tl.to("#callLayer", { x: 470, duration: 0.2, ease: "power3.in" }, T_END + 0.3);
        tl.to("#callLayer", { filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, T_END + 0.3);
        tl.to("#callLayer", { opacity: 0, duration: 0.08, ease: "none" }, T_END + 0.42);

        /* 7. breakdown (44.65): pill goes full red, clock races */
        tl.fromTo("#examFlash", { opacity: 0 }, { opacity: 0.85, duration: 0.03, ease: "none", immediateRender: false }, T_RACE - 0.02);
        tl.to("#examFlash", { opacity: 0, duration: 0.32, ease: "power2.out" }, T_RACE + 0.01);
        tl.to("#examPill", { backgroundColor: "#ff3b30", duration: 0.05, ease: "none" }, T_RACE);
        tl.to("#pillLabel", { color: "rgba(255,255,255,0.94)", duration: 0.05, ease: "none" }, T_RACE);
        tl.to("#pillDot", { backgroundColor: "#ffffff", duration: 0.05, ease: "none" }, T_RACE);

        /* 8. glitch-out (51.45 -> 51.76): RGB ghosts + tear, collapse to a line, gone */
        tl.set("#examPill", { opacity: 0 }, T_GLITCH);
        tl.set("#slices", { opacity: 1 }, T_GLITCH);
        tl.set(["#ghostC", "#ghostM"], { opacity: 0.85 }, T_GLITCH);
        tl.to("#examWrap", { scaleY: 0.05, scaleX: 1.25, duration: 0.07, ease: "expo.in" }, T_GLITCH + 0.16);
        tl.fromTo("#examHot", { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power2.in", immediateRender: false }, T_GLITCH + 0.17);
        tl.to("#examWrap", { scaleX: 0, duration: 0.07, ease: "expo.in" }, T_GLITCH + 0.235);
        tl.to("#examWrap", { opacity: 0, duration: 0.03, ease: "none" }, T_GLITCH + 0.28);

        /* ======================= register ======================= */
        if (CHUNK_FRAMES > 0) {
          // chunked png render: this file plays frames [CHUNK_START_FRAME, +CHUNK_FRAMES) of the master timeline
          var off = CHUNK_START_FRAME / FPS, len = CHUNK_FRAMES / FPS;
          var outer = gsap.timeline({ paused: true });
          outer.fromTo(tl, { time: off }, { time: off + len, duration: len, ease: "none" }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = outer;
          outer.seek(0);
        } else {
          window.__timelines = window.__timelines || {};
          window.__timelines["main"] = tl;
          tl.seek(0);
        }
      })();
    </script>
  </body>
</html>
