<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>titles / jnanottam_behind</title>
    <script src="./vendor/gsap.min.js"></script>
    <!-- design/ links to videos/shelf-reel/design: fonts + tokens + base components -->
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      /* BEHIND layer: composited UNDER the person cut-out. Output 60.600 -> 64.967 (131 frames).
         "Jnanottam" spoken at 60.83 (t 0.23): letters rise in. The two lines drift toward each other
         and lock into a flush-left block exactly at the freeze (63.50, t 2.90), where the word flashes
         brighter and holds. namecard_j (front) sits flush-left under OTTAM at x = 64. */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }

      /* giant word = .giant look (Sora 800, silver gradient, blue glow) + a soft navy depth shadow */
      .line {
        position: absolute;
        left: 57px; /* ink of J / O starts at x = 64 */
        display: flex;
        font: 800 245px/0.9 var(--font-brand);
        white-space: nowrap;
        filter: drop-shadow(0 0 30px rgba(var(--glow), 0.35)) drop-shadow(0 3px 5px rgba(4, 10, 26, 0.22)) drop-shadow(0 14px 28px rgba(4, 10, 26, 0.36));
      }
      #l1 { top: 377px; } /* JNAN  : cap 391-570, baseline 571 */
      #l2 { top: 584px; } /* OTTAM : cap 598-777, baseline 778 */
      .slot { position: relative; display: inline-block; }
      .slot .in { position: relative; display: block; }
      .slot .b {
        display: block;
        background: linear-gradient(180deg, #ffffff 0%, #e3eaf4 50%, #a9b8cd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: brightness(1);
      }
      .slot .g {
        position: absolute;
        left: 0;
        top: 0;
        color: rgb(var(--glow));
        filter: blur(24px);
        opacity: 0;
      }
      /* specular sweep: a white copy of the line, masked to a moving diagonal band */
      .sheen {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        color: #ffffff;
        --p: -30%;
        -webkit-mask-image: linear-gradient(104deg, transparent calc(var(--p) - 10%), #000 var(--p), transparent calc(var(--p) + 10%));
        mask-image: linear-gradient(104deg, transparent calc(var(--p) - 10%), #000 var(--p), transparent calc(var(--p) + 10%));
        opacity: 0.9;
      }
      .sheen span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.366667" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="4.366667" data-track-index="0">
        <div class="line" id="l1" data-text="JNAN" aria-hidden="true" data-layout-allow-overflow></div>
        <div class="line" id="l2" data-text="OTTAM" aria-hidden="true" data-layout-allow-overflow></div>
      </div>
    </div>
    <script>
      // ---- letter builder: slot > in > (g = blue bloom copy, b = silver letter); plus one sheen copy per line
      var KERN = { TA: -0.07 }; // restore kerning lost by splitting letters into boxes
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }
      function buildWord(line) {
        var text = line.getAttribute("data-text");
        var sheen = el("div", "sheen");
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          var k = KERN[(text[i - 1] || "") + ch] || 0;
          var slot = el("span", "slot");
          var inn = el("span", "in");
          var g = el("span", "g", ch);
          var b = el("span", "b", ch);
          g.setAttribute("data-layout-allow-overlap", "");
          g.setAttribute("data-layout-allow-occlusion", "");
          b.setAttribute("data-layout-allow-occlusion", "");
          inn.appendChild(g);
          inn.appendChild(b);
          slot.appendChild(inn);
          var s = el("span", "", ch);
          s.setAttribute("data-layout-allow-overlap", "");
          s.setAttribute("data-layout-allow-occlusion", "");
          if (k) { slot.style.marginLeft = k + "em"; s.style.marginLeft = k + "em"; }
          line.appendChild(slot);
          sheen.appendChild(s);
        }
        line.appendChild(sheen);
      }
      buildWord(document.getElementById("l1"));
      buildWord(document.getElementById("l2"));

      var tl = gsap.timeline({ paused: true });
      var slots = gsap.utils.toArray(".line > .slot");
      var inners = gsap.utils.toArray(".line > .slot > .in");
      var glows = gsap.utils.toArray(".line > .slot .g");
      var bases = gsap.utils.toArray(".line > .slot .b");
      var sheens = gsap.utils.toArray(".line > .sheen");

      // rise-in on "Jnanottam" (60.83 = t 0.23): JNAN then OTTAM, letter by letter, blur resolving to sharp
      var T_IN = 0.2, ST = 0.045;
      tl.fromTo(slots, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.85, ease: "power4.out", stagger: ST }, T_IN);
      tl.fromTo(inners, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.45, ease: "power2.out", stagger: ST }, T_IN);
      tl.fromTo(glows, { opacity: 0 }, { opacity: 0.4, duration: 0.25, ease: "power2.out", stagger: ST }, T_IN + 0.1);
      tl.to(glows, { opacity: 0.12, duration: 0.6, ease: "power2.inOut", stagger: ST, immediateRender: false }, T_IN + 0.45);

      // slow parallax drift: the lines converge and lock flush-left at the freeze
      var T_FREEZE = 2.9;
      tl.fromTo("#l1", { x: -44 }, { x: 0, duration: T_FREEZE - T_IN, ease: "sine.inOut" }, T_IN);
      tl.fromTo("#l2", { x: 44 }, { x: 0, duration: T_FREEZE - T_IN, ease: "sine.inOut" }, T_IN);

      // freeze (63.50): glow pulse + brightness flash + one fast light sweep, then hold
      tl.to(glows, { opacity: 0.95, duration: 0.05, ease: "power2.out", immediateRender: false }, T_FREEZE);
      tl.to(glows, { opacity: 0.3, duration: 0.8, ease: "power2.out", immediateRender: false }, T_FREEZE + 0.05);
      tl.fromTo(bases, { filter: "brightness(1)" }, { filter: "brightness(1.9)", duration: 0.05, ease: "power2.out" }, T_FREEZE);
      tl.to(bases, { filter: "brightness(1)", duration: 0.6, ease: "power2.out", immediateRender: false }, T_FREEZE + 0.05);
      tl.fromTo(sheens, { "--p": "-30%" }, { "--p": "130%", duration: 0.42, ease: "power2.inOut", stagger: 0.06 }, T_FREEZE + 0.02);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
