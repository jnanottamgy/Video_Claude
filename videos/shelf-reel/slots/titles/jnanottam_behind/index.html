<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>titles / jnanottam_behind</title>
    <script src="./vendor/gsap.min.js"></script>
    <!-- design/ links to videos/shelf-reel/design: fonts + tokens + base components -->
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      /* BEHIND layer: composited UNDER the person cut-out. Output 60.600 -> 64.967 (131 frames).
         "Jnanottam" spoken at 60.83 (t 0.23): letters rise in, in S.H.E.L.F wall-sign navy (the wall
         behind him is near-white). The two lines drift toward each other and lock into a flush-left
         block at the freeze (63.50, t 2.90). There the name LIGHTS UP: on the compositor's white flash
         it switches from navy to the silver S.H.E.L.F nameplate with a blue glow pulse (the freeze
         darkens the room to ~40 % grey, where silver reads and navy would not), then holds.
         Camera-safe: pre-warp ink x 102..959 stays inside the frame at the 1.10x freeze push and the
         60.83 punch. namecard_j (front) sits flush-left under OTTAM and follows the same camera. */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }

      .line {
        position: absolute;
        left: 95px; /* ink of J / O starts at x = 102 */
        display: flex;
        font: 800 228px/0.9 var(--font-brand);
        white-space: nowrap;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3));
      }
      #l1 { top: 406px; } /* JNAN  : cap 420-586, baseline 586 */
      #l2 { top: 598px; } /* OTTAM : cap 612-778, baseline 778 */
      .slot { position: relative; display: inline-block; }
      .slot .in { position: relative; display: block; }
      /* navy wall-sign letter */
      .slot .b {
        position: relative;
        display: block;
        background: linear-gradient(180deg, #0d1b36 0%, #152b55 55%, #1f3a6e 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* the same letter in silver (.giant look), revealed at the freeze */
      .slot .s {
        position: absolute;
        left: 0;
        top: 0;
        background: linear-gradient(180deg, #ffffff 0%, #e3eaf4 50%, #a9b8cd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
        filter: brightness(1);
      }
      /* top-edge highlight: a light copy 3 px higher, peeking out above the letter */
      .slot .hl {
        position: absolute;
        left: 0;
        top: -3px;
        color: rgba(165, 200, 255, 0.55);
      }
      /* blue glow copy, only used from the freeze on */
      .slot .g {
        position: absolute;
        left: 0;
        top: 0;
        color: rgb(var(--glow));
        filter: blur(24px);
        opacity: 0;
      }
      /* specular sweep at the freeze */
      .sheen {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        color: #ffffff;
        --p: -30%;
        -webkit-mask-image: linear-gradient(104deg, transparent calc(var(--p) - 10%), #000 var(--p), transparent calc(var(--p) + 10%));
        mask-image: linear-gradient(104deg, transparent calc(var(--p) - 10%), #000 var(--p), transparent calc(var(--p) + 10%));
        opacity: 0.9;
      }
      .sheen span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4.366667" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="4.366667" data-track-index="0">
        <div class="line" id="l1" data-text="JNAN" aria-hidden="true" data-layout-allow-overflow></div>
        <div class="line" id="l2" data-text="OTTAM" aria-hidden="true" data-layout-allow-overflow></div>
      </div>
    </div>
    <script>
      // ---- letter builder: slot > in > (g glow, hl top-edge highlight, b navy letter, s silver letter); plus a sheen copy
      var KERN = { TA: -0.07 }; // restore kerning lost by splitting letters into boxes
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }
      function layered(e) {
        e.setAttribute("data-layout-allow-overlap", "");
        e.setAttribute("data-layout-allow-occlusion", "");
        return e;
      }
      function buildWord(line) {
        var text = line.getAttribute("data-text");
        var sheen = el("div", "sheen");
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          var k = KERN[(text[i - 1] || "") + ch] || 0;
          var slot = el("span", "slot");
          var inn = el("span", "in");
          inn.appendChild(layered(el("span", "g", ch)));
          inn.appendChild(layered(el("span", "hl", ch)));
          var b = el("span", "b", ch);
          b.setAttribute("data-layout-allow-occlusion", "");
          inn.appendChild(b);
          inn.appendChild(layered(el("span", "s", ch)));
          slot.appendChild(inn);
          var s = layered(el("span", "", ch));
          if (k) { slot.style.marginLeft = k + "em"; s.style.marginLeft = k + "em"; }
          line.appendChild(slot);
          sheen.appendChild(s);
        }
        line.appendChild(sheen);
      }
      buildWord(document.getElementById("l1"));
      buildWord(document.getElementById("l2"));

      var tl = gsap.timeline({ paused: true });
      var slots = gsap.utils.toArray(".line > .slot");
      var inners = gsap.utils.toArray(".line > .slot > .in");
      var glows = gsap.utils.toArray(".line > .slot .g");
      var silvers = gsap.utils.toArray(".line > .slot .s");
      var navies = gsap.utils.toArray(".line > .slot .b");
      var sheens = gsap.utils.toArray(".line > .sheen");

      // rise-in on "Jnanottam" (60.83 = t 0.23): JNAN then OTTAM, letter by letter, blur resolving to sharp
      var T_IN = 0.2, ST = 0.045;
      tl.fromTo(slots, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.85, ease: "power4.out", stagger: ST }, T_IN);
      tl.fromTo(inners, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.45, ease: "power2.out", stagger: ST }, T_IN);

      // slow parallax drift: the lines converge and lock flush-left at the freeze
      var T_FREEZE = 2.9;
      tl.fromTo("#l1", { x: -24 }, { x: 0, duration: T_FREEZE - T_IN, ease: "sine.inOut" }, T_IN);
      tl.fromTo("#l2", { x: 24 }, { x: 0, duration: T_FREEZE - T_IN, ease: "sine.inOut" }, T_IN);

      // freeze (63.50): the name lights up - navy -> silver under the flash, blue glow pulse, one sweep, hold
      // (the flash starts just after the last moving frame so its peak lands ON the first freeze frame)
      var T_FLASH = T_FREEZE - 0.03;
      tl.fromTo(silvers, { opacity: 0, filter: "brightness(1.9)" }, { opacity: 1, filter: "brightness(1.9)", duration: 0.05, ease: "power2.out" }, T_FLASH);
      tl.to(silvers, { filter: "brightness(1)", duration: 0.6, ease: "power2.out", immediateRender: false }, T_FLASH + 0.05);
      tl.fromTo(navies, { opacity: 1 }, { opacity: 0, duration: 0.05, ease: "power2.in" }, T_FLASH + 0.01);
      tl.fromTo(glows, { opacity: 0 }, { opacity: 0.95, duration: 0.05, ease: "power2.out" }, T_FLASH);
      tl.to(glows, { opacity: 0.3, duration: 0.8, ease: "power2.out", immediateRender: false }, T_FLASH + 0.05);
      tl.fromTo(sheens, { "--p": "-30%" }, { "--p": "130%", duration: 0.42, ease: "power2.inOut", stagger: 0.06 }, T_FREEZE + 0.02);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
