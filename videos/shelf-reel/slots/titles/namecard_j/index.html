<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>titles / namecard_j</title>
    <script src="./vendor/gsap.min.js"></script>
    <!-- design/ links to videos/shelf-reel/design: fonts + tokens + base components -->
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      /* FRONT layer (over the person). Output 63.400 -> 64.967 (47 frames); the freeze starts at
         63.50 (t 0.10). Role lockup for Jnanottam: flush-left at x = 64 directly under the giant
         "OTTAM" of jnanottam_behind (baseline y 778), left of his face, clear of the caption band. */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }

      .card { position: absolute; left: 64px; top: 800px; width: 300px; height: 90px; }
      /* thin silver corner bracket + rule */
      .rule {
        position: absolute;
        left: 0;
        top: 0;
        width: 276px;
        height: 2px;
        background: linear-gradient(90deg, #ffffff 0%, #e3eaf4 45%, rgba(169, 184, 205, 0) 100%);
        box-shadow: 0 0 10px rgba(var(--glow), 0.6);
        transform-origin: 0% 50%;
      }
      .tick {
        position: absolute;
        left: 0;
        top: 0;
        width: 2px;
        height: 13px;
        background: linear-gradient(180deg, #ffffff, rgba(227, 234, 244, 0.2));
        box-shadow: 0 0 8px rgba(var(--glow), 0.7);
        transform-origin: 50% 0%;
      }
      .role {
        position: absolute;
        left: -1px;
        top: 17px;
        font: 700 31px/1 var(--font-brand);
        letter-spacing: 0.18em;
        color: var(--silver-hi);
        white-space: nowrap;
        text-shadow: 0 0 14px rgba(var(--glow), 0.55), 0 2px 10px rgba(0, 0, 0, 0.55);
      }
      .brand {
        position: absolute;
        left: 0;
        top: 59px;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
      }
      .brand img {
        display: block;
        width: 24px;
        height: 28px;
        filter: drop-shadow(0 0 6px rgba(var(--glow), 0.7));
      }
      .brand span {
        font: 600 22px/1 var(--font-brand);
        letter-spacing: 0.36em;
        color: #b4d6ff;
        text-shadow: 0 0 12px rgba(var(--glow), 0.75), 0 2px 8px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="1.566667" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="1.566667" data-track-index="0">
        <div class="card" id="card">
          <div class="rule" id="rule"></div>
          <div class="tick" id="tick"></div>
          <div class="role" id="role">CO-FOUNDER</div>
          <div class="brand" id="brand"><img src="./design/shelf-mark.png" alt="" /><span>S.H.E.L.F</span></div>
        </div>
      </div>
    </div>
    <script>
      var tl = gsap.timeline({ paused: true });
      var T = 0.1; // freeze starts at 63.50

      // snap in with a quick slide: bracket + rule draw, then the two lines slide in and sharpen
      tl.fromTo("#tick", { scaleY: 0 }, { scaleY: 1, duration: 0.14, ease: "power3.out" }, T);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "expo.out" }, T);
      tl.fromTo("#role", { x: -44, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, T + 0.03);
      tl.fromTo("#brand", { x: -44, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, T + 0.09);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
