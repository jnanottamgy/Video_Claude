<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>titles / shelf_behind</title>
    <script src="./vendor/gsap.min.js"></script>
    <!-- design/ links to videos/shelf-reel/design: fonts + tokens + base components -->
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      /* BEHIND layer: composited UNDER the person cut-out. Output 54.100 -> 55.533 (43 frames).
         "SHELF" lands at 54.88 (t 0.78): letters slam in, one light sweep, hold. The footage cuts to
         the next shot at output frame 1665 (55.500, t 1.40), so the scene clip ends at t = 1.39 and
         frame 43 is empty on purpose.
         Ink: the S.H.E.L.F wall-sign navy (the bed sheet is light). Sized for the compositor's camera
         (push + 0.06 punch at 54.88 peak at ~1.11x about (520, 800), shake 7 px): pre-warp ink spans
         x 92..984 so it stays inside the frame on screen. His head pokes into the bottom of "HEL". */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }

      /* wall-sign ink: deep navy gradient, a faint lighter top edge, soft dark shadow (no glow) */
      .word {
        position: absolute;
        left: 86px;  /* ink 92..984 */
        top: 424px;  /* cap 441-650, baseline 650 */
        display: flex;
        font: 800 286px/0.9 var(--font-brand);
        white-space: nowrap;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.2)) drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3));
      }
      .slot { position: relative; display: inline-block; transform-origin: 50% 62%; }
      .slot .in { position: relative; display: block; }
      .slot .b {
        position: relative;
        display: block;
        background: linear-gradient(180deg, #0d1b36 0%, #152b55 55%, #1f3a6e 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* top-edge highlight: a light copy 3 px higher, peeking out above the navy letter */
      .slot .hl {
        position: absolute;
        left: 0;
        top: -3px;
        color: rgba(165, 200, 255, 0.55);
      }
      /* blue impact bloom (accent only, gone within ~0.4 s) */
      .slot .g {
        position: absolute;
        left: 0;
        top: 0;
        color: var(--shelf-blue);
        filter: blur(26px);
        opacity: 0;
      }
      /* one light sweep: a blue-white copy masked to a moving diagonal band */
      .sheen {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        color: #8fc0ff;
        --p: -30%;
        -webkit-mask-image: linear-gradient(104deg, transparent calc(var(--p) - 10%), #000 var(--p), transparent calc(var(--p) + 10%));
        mask-image: linear-gradient(104deg, transparent calc(var(--p) - 10%), #000 var(--p), transparent calc(var(--p) + 10%));
        opacity: 0.75;
      }
      .sheen span { display: inline-block; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="1.433333" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="1.39" data-track-index="0">
        <div class="word" id="word" data-text="SHELF" aria-hidden="true" data-layout-allow-overflow></div>
      </div>
    </div>
    <script>
      // ---- letter builder: slot > in > (g = blue bloom, hl = top-edge highlight, b = navy letter); plus a sheen copy
      function el(tag, cls, text) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }
      function layered(e) {
        e.setAttribute("data-layout-allow-overlap", "");
        e.setAttribute("data-layout-allow-occlusion", "");
        return e;
      }
      function buildWord(line) {
        var text = line.getAttribute("data-text");
        var sheen = el("div", "sheen");
        sheen.id = "sheen";
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          var slot = el("span", "slot");
          var inn = el("span", "in");
          inn.appendChild(layered(el("span", "g", ch)));
          inn.appendChild(layered(el("span", "hl", ch)));
          var b = el("span", "b", ch);
          b.setAttribute("data-layout-allow-occlusion", "");
          inn.appendChild(b);
          slot.appendChild(inn);
          line.appendChild(slot);
          sheen.appendChild(layered(el("span", "", ch)));
        }
        line.appendChild(sheen);
      }
      buildWord(document.getElementById("word"));

      var tl = gsap.timeline({ paused: true });
      var slots = gsap.utils.toArray("#word > .slot");
      var inners = gsap.utils.toArray("#word > .slot > .in");
      var glows = gsap.utils.toArray("#word .g");

      // letters slam in on "SHELF" (54.88 = t 0.78): scale 1.24 -> 1 with a small compress-overshoot,
      // motion blur resolving to sharp, short left-to-right stagger
      var T_HIT = 0.72, ST = 0.04;
      tl.fromTo(slots, { scale: 1.24, y: -18 }, { scale: 1, y: 0, duration: 0.34, ease: "back.out(1.8)", stagger: ST }, T_HIT);
      tl.fromTo(inners, { opacity: 0, filter: "blur(16px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: ST }, T_HIT);
      // blue impact bloom per letter, gone shortly after
      tl.fromTo(glows, { opacity: 0 }, { opacity: 0.5, duration: 0.06, ease: "power2.out", stagger: ST }, T_HIT + 0.04);
      tl.to(glows, { opacity: 0, duration: 0.34, ease: "power2.out", stagger: ST, immediateRender: false }, T_HIT + 0.11);
      // one light sweep across the settled word
      tl.fromTo("#sheen", { "--p": "-30%" }, { "--p": "130%", duration: 0.36, ease: "power2.inOut" }, 1.0);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
