<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>notifs / storm</title>
    <script src="./vendor/gsap.min.js"></script>
    <!-- design/ links to videos/shelf-reel/design: fonts + tokens + base components -->
    <link rel="stylesheet" href="./design/shelf.css" />
    <!-- shared notification card + storm engine (master: slots/notifs/_shared) -->
    <link rel="stylesheet" href="./lib/notif-kit.css" />
    <script src="./lib/notif-kit.js"></script>
    <script src="./lib/notif-storm.js"></script>
    <style>
      #stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }
      #world { position: absolute; inset: 0; transform-origin: 540px 760px; }
    </style>
  </head>
  <body>
    <!--
      notifs/storm — output window 44.600 -> 51.833 s (7.2333 s = 217 frames), layer FRONT.
      "What the f*ck — why are my notes scattered in so many groups?" then head in hand.
        44.65 What: burst of 7 from the centre · 45.20 f*ck · 45.58 why are my notes
        46.36 scattered: everything flung to the corners (rot -14..14, scale 0.55-1.0)
        47.20 many groups?: fast pileup of small cards
        48.03-51.40 head in hand: arrivals ACCELERATE (to 2 per frame), badges count up,
                    whole storm drifts/rotates (vertigo), density peaks ~51.3
        51.45-51.80 everything spirals into the centre and vanishes. Empty after 51.80.
      The cold open (notifs/storm_hook) is this same storm's first beats, shifted +0.2 s.
    -->
    <div id="stage" data-composition-id="main" data-start="0" data-duration="7.233333" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="7.233333" data-track-index="0">
        <div id="world"></div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var D = 7.233333;
        var tl = gsap.timeline({ paused: true });
        var storm = NK.buildStorm(tl, document.getElementById("world"), { off: 0, full: true, seed: 4465 });

        // badge counts are text: one state function driven by the timeline clock
        var clock = { t: 0 };
        tl.fromTo(
          clock,
          { t: 0 },
          { t: D, duration: D, ease: "none", onUpdate: function () { storm.applyState(clock.t); } },
          0
        );
        storm.applyState(0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
