<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <!-- design/ links to videos/shelf-reel/design: fonts + tokens + base components -->
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }
      #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      #tiles { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      /* The S.H.E.L.F tile: .tile from design/shelf.css (dark-navy glass, silver Sora label, blue glow)
         plus a top sheen and a silver label gradient. Positioned by its centre from the script. */
      .tile.tt { left: 0; top: 0; white-space: nowrap; visibility: hidden; }
      .tile.tt::before {
        content: "";
        position: absolute;
        left: 3px;
        right: 3px;
        top: 3px;
        height: 46%;
        border-radius: 27px 27px 12px 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0));
        pointer-events: none;
      }
      .tile.tt .label {
        background: linear-gradient(180deg, #ffffff 0%, #eef3fa 46%, #b6c4d7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tile svg { fill: none; stroke: #eaf0f8; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .tile svg .ac { stroke: #6cb0ff; }
      .tile svg .acf { fill: #6cb0ff; stroke: none; }
      .tile svg .dot { fill: #eaf0f8; stroke: none; opacity: 0.62; }
      .tile svg .red { fill: #ff3b30; stroke: none; }
      .tile svg .cut { stroke: #142441; stroke-width: 2.6; }

      #fx path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="13.3" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="13.3" data-track-index="0">
        <div id="world">
          <svg id="fx" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="headFade">
                <stop offset="0.7" stop-color="#000" />
                <stop offset="1" stop-color="#fff" />
              </radialGradient>
              <mask id="headMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
                <rect x="0" y="0" width="1080" height="1920" fill="#fff" />
                <ellipse id="headEll" cx="660" cy="790" rx="190" ry="250" fill="url(#headFade)" />
              </mask>
            </defs>
            <g id="ringsBack" mask="url(#headMask)"></g>
            <g id="ringsFront"></g>
            <g id="strands"></g>
          </svg>
          <div id="tiles"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var DUR = 13.3; // window 70.100 -> 83.400 on the reel's output timeline (399 frames)

        /* ---------------- utilities ---------------- */
        function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function prog(t, t0, d) { return clamp((t - t0) / d, 0, 1); }
        function sstep(e0, e1, x) { var u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); }
        var EO = gsap.parseEase("expo.out");
        var P2O = gsap.parseEase("power2.out");
        var P3O = gsap.parseEase("power3.out");
        var P3IO = gsap.parseEase("power3.inOut");
        var BO = gsap.parseEase("back.out(1.7)");
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(20261003);
        function rr(a, b) { return a + (b - a) * rnd(); }
        function hash01(n) { // deterministic per-frame noise
          n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4);
          n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
          return (n >>> 0) / 4294967296;
        }
        function track(tr, t) {
          t += 1 / 30;
          if (t <= tr[0][0]) return [tr[0][1], tr[0][2]];
          for (var i = 1; i < tr.length; i++) {
            if (t <= tr[i][0]) {
              var a = tr[i - 1], b = tr[i], u = (t - a[0]) / (b[0] - a[0]);
              return [lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
            }
          }
          var l = tr[tr.length - 1];
          return [l[1], l[2]];
        }

        /* ---------------- cue sheet (composition seconds = output seconds - 70.100) ---------------- */
        var T = {
          files: 0.24, filesX: 0.81, info: 1.66, infoX: 2.32,
          dead: 3.41, rem: 3.97, doc: 4.84, pers: 5.55,
          cutB: 6.8667,        // first frame of shot B (Kartik) as composited (output 76.967)
          somehow: 7.44, remember: 8.81, all: 9.35, of: 9.66, it: 9.96,
          cutC: 10.4667,       // first frame of shot C (Jnanottam in the nook), output 80.567
          but: 10.9, sound: 11.73, comp: 12.08,
          cutD: 13.2           // next shot (output 83.300): the tangle is gone by then
        };

        /* ---------------- sunglasses tracks (composition s, x, y) measured from the footage ---------------- */
        var TA = [[0.067,558,1020],[0.267,546,1022],[0.467,539,1027],[0.667,536,1028],[0.867,534,1033],[1.067,530,1038],[1.267,527,1041],[1.467,527,1042],[1.667,524,1041],[1.867,521,1041],[2.067,519,1039],[2.267,515,1045],[2.467,511,1049],[2.667,508,1053],[2.867,507,1055],[3.067,504,1054],[3.267,499,1052],[3.467,503,1056],[3.667,501,1056],[3.867,498,1057],[4.067,492,1059],[4.267,492,1058],[4.467,498,1058],[4.667,504,1058],[4.867,506,1056],[5.067,510,1053],[5.267,516,1045],[5.467,516,1035],[5.667,518,1029],[5.867,518,1025],[6.067,516,1022],[6.267,519,1009],[6.467,520,1001],[6.667,522,995],[6.867,527,991]];
        var TB = [[6.9,650,812],[7.1,648,814],[7.3,645,817],[7.5,644,820],[7.7,646,822],[7.9,647,827],[8.1,648,829],[8.3,651,831],[8.5,656,830],[8.7,662,833],[8.9,667,835],[9.1,678,834],[9.3,677,833],[9.5,678,835],[9.7,682,838],[9.9,681,839],[10.1,680,838],[10.3,680,839],[10.467,677,838]];
        var TC = [[10.5,540,915],[10.7,535,915],[10.9,517,912],[11.1,506,910],[11.3,499,907],[11.5,496,908],[11.7,495,906],[11.9,491,906],[12.1,490,907],[12.3,489,907],[12.5,489,906],[12.7,493,906],[12.9,492,904],[13.1,493,903],[13.2,494,903]];

        /* ---------------- the six tile types (one design, shared with slots/tiles/oneplace) ---------------- */
        var ICON = {
          files: '<path d="M5 14.2a4 4 0 0 1 4-4h8.4a3 3 0 0 1 2.2 1l3 3.3h16.4a4 4 0 0 1 4 4V36a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M5 20.4h38"/><path class="ac" d="M11.5 30.5h10.5"/>',
          info: '<circle cx="24" cy="24" r="18"/><path d="M24 22.2v11.6"/><circle class="acf" cx="24" cy="15.4" r="2.4"/>',
          dead: '<rect x="6" y="9.5" width="36" height="32" rx="4.5"/><path d="M6 18.4h36M15.5 5.5v7.6M32.5 5.5v7.6"/><circle class="dot" cx="14" cy="26" r="1.7"/><circle class="dot" cx="24" cy="26" r="1.7"/><circle class="dot" cx="34" cy="26" r="1.7"/><circle class="dot" cx="14" cy="34" r="1.7"/><circle class="dot" cx="24" cy="34" r="1.7"/><rect class="red" x="29.2" y="29.2" width="9.6" height="9.6" rx="2.2"/>',
          rem: '<path d="M24 6.8c-6.3 0-10.6 4.8-10.6 10.9v7.3c0 1.6-.6 3.2-1.6 4.4l-2.2 2.7c-.8 1-.1 2.5 1.2 2.5h26.4c1.3 0 2-1.5 1.2-2.5l-2.2-2.7c-1-1.2-1.6-2.8-1.6-4.4v-7.3c0-6.1-4.3-10.9-10.6-10.9z"/><path d="M19.7 38.4a4.5 4.5 0 0 0 8.6 0"/><circle class="acf cut" cx="35.6" cy="10.4" r="4.6"/>',
          doc: '<path d="M13 5.5h15.6l9.4 9.4v25.6a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3v-32a3 3 0 0 1 3-3z"/><path d="M28.6 5.5v9.4H38"/><path class="ac" d="M16.2 23.6h9"/><path d="M16.2 29.6h15.6M16.2 35.6h15.6"/>',
          pers: '<rect x="4.5" y="10" width="39" height="28" rx="4.5"/><circle class="ac" cx="16" cy="20.8" r="4.3"/><path d="M9.6 31.6c1-3.5 3.5-5.3 6.4-5.3s5.4 1.8 6.4 5.3"/><path d="M27.6 19.4h10M27.6 25h10M27.6 30.6h6"/>'
        };
        var LABEL = { files: "Files", info: "Information", dead: "Deadlines", rem: "Reminders", doc: "Documents", pers: "Personal Info" };
        var BASEW = { files: 260, info: 471, dead: 397, rem: 409, doc: 436, pers: 508 }; // measured .tile widths at scale 1

        /* ---------------- the cast: 25 tiles ----------------
           [type, clutter scale, role, spawn time, hero-exit time]
           hero  = pops big at the hero spot over his head, later docks into the clutter
           copy  = sprays out of the current hero ("everywhere")
           final = PERSONAL INFO, stays at the hero spot and settles smaller */
        var SPEC = [
          ["files", 0.8, "hero", T.files, 1.6],
          ["files", 0.62, "copy", 0.81], ["files", 0.5, "copy", 0.865], ["files", 0.58, "copy", 0.92],
          ["files", 0.47, "copy", 0.975], ["files", 0.66, "copy", 1.03], ["files", 0.52, "copy", 1.085],
          ["info", 0.7, "hero", T.info, 3.35],
          ["info", 0.55, "copy", 2.32], ["info", 0.47, "copy", 2.375], ["info", 0.6, "copy", 2.43],
          ["info", 0.5, "copy", 2.485], ["info", 0.45, "copy", 2.54], ["info", 0.52, "copy", 2.595],
          ["dead", 0.78, "hero", T.dead, 3.92], ["dead", 0.5, "copy", 3.66], ["dead", 0.56, "copy", 3.72],
          ["rem", 0.72, "hero", T.rem, 4.79], ["rem", 0.52, "copy", 4.24], ["rem", 0.47, "copy", 4.3],
          ["doc", 0.74, "hero", T.doc, 5.5], ["doc", 0.5, "copy", 5.1], ["doc", 0.55, "copy", 5.16],
          ["pers", 0.85, "final", T.pers, 6.05], ["pers", 0.55, "copy", 5.82]
        ];
        // clutter spots around Jnanottam (shot A) and scatter spots around him in the nook (shot C):
        // seeded annealing, offline; faces, the caption band 1290-1460 and the IG rail stay clear.
        var PLAN_A = [[388,291,-0.4],[921,682,-3.1],[503,580,0.3],[930,279,0.0],[139,1136,2.1],[163,287,0.1],[142,944,-0.2],[835,831,0.5],[605,489,-0.9],[186,1044,-0.5],[218,493,3.8],[655,280,-0.4],[311,589,-0.8],[801,371,-5.0],[230,850,-0.5],[805,1245,0.2],[502,394,-2.1],[223,1229,1.9],[181,688,-0.2],[833,1159,-0.1],[844,941,0.2],[774,584,-1.9],[882,475,0.6],[525,712,-1.5],[217,393,-0.1]];
        var PLAN_C = [[893,294,-0.2],[156,943,2.0],[737,1137,5.6],[852,1238,2.8],[705,273,0.2],[167,686,6.9],[936,419,-1.2],[547,1235,0.2],[204,586,1.0],[238,1172,-0.2],[690,448,1.3],[878,1054,-0.7],[437,275,0.7],[200,1084,-0.1],[510,601,0.4],[178,806,2.2],[190,288,-2.7],[845,752,1.5],[559,353,0.7],[173,1246,-0.5],[844,645,0.0],[896,537,-2.1],[878,860,5.2],[295,452,-0.1],[856,960,2.1]];
        var HERO = { x: 525, y: 712 };

        /* ---------------- orbit rig around Kartik's head (shot B) ---------------- */
        var F = 1300; // camera distance for the perspective divide
        // Saturn-style rings seen from above: the near arc passes under his chin, the far arc over his hair,
        // the small halo rides his hairline. R = horizontal radius, Ry = vertical radius (kept when they tighten).
        var RINGS = [
          { dx: -45, dy: -22, R: 335, Ry: 266, roll: -9, dir: 1, spd: 1.0, s: 0.5, n: 10 },
          { dx: -35, dy: -14, R: 312, Ry: 276, roll: 11, dir: -1, spd: 0.9, s: 0.47, n: 9 },
          { dx: 8, dy: -214, R: 246, Ry: 66, roll: -4, dir: 1, spd: 1.25, s: 0.42, n: 6 }
        ];
        RINGS.forEach(function (R) {
          var b = (R.roll * Math.PI) / 180;
          R.sb = Math.sin(b); R.cb = Math.cos(b);
        });
        function ringGeo(R, t) {
          var rad = R.R * radiusK(t), sa = clamp(R.Ry / rad, 0, 0.985);
          return { rad: rad, sa: sa, ca: Math.sqrt(1 - sa * sa) };
        }
        function wrapPi(a) { a = (a + Math.PI) % 6.283185307; if (a < 0) a += 6.283185307; return a - Math.PI; }
        // keeps tiles in transit off a face: anything inside the ellipse slides out to its rim
        function pushOut(S, f, w, o) {
          var ex = f[2] + o.hw * S.s * Math.cos(((S.yaw || 0) * Math.PI) / 180) * 0.9, ey = f[3] + 55 * S.s;
          var dx = S.x - f[0], dy = S.y - f[1], d = Math.sqrt((dx * dx) / (ex * ex) + (dy * dy) / (ey * ey));
          if (d >= 1 || d < 1e-4 || w <= 0) return S;
          var k = lerp(1, 1 / d, w);
          S.x = f[0] + dx * k; S.y = f[1] + dy * k;
          return S;
        }
        function faceB(t) { var g = track(TB, t); return [g[0] + 5, g[1] + 72, 168, 150]; }   // Kartik: brow to chin
        function faceC(t) { var g = track(TC, t); return [g[0] - 10, g[1] + 8, 170, 215]; }   // Jnanottam in the nook
        var HEADB = { dx: 16, dy: -42, rx: 182, ry: 242 };
        function kick(t, t0, amp, tau) {
          if (t < t0) return 0;
          var u = t - t0;
          return amp * (1 - Math.exp(-u / 0.06)) * Math.exp(-u / tau);
        }
        function omega(t) { // rad/s: accelerates on "somehow", "remember", peaks on "all of it"
          var w = 1.15;
          w += 0.65 * sstep(6.9, 7.5, t);
          w += 0.9 * sstep(7.5, 8.81, t);
          w += 1.5 * sstep(8.81, 9.35, t);
          w += 2.6 * sstep(9.35, 9.8, t);
          w += kick(t, T.somehow, 2.6, 0.38) + kick(t, T.remember, 3.0, 0.38) + kick(t, T.all, 3.4, 0.35);
          w += kick(t, T.of, 1.6, 0.25) + kick(t, T.it, 1.8, 0.3);
          return w;
        }
        // integrate the spin once (seek-safe lookup table)
        var TH0 = 6.6, THDT = 1 / 240, THN = Math.ceil((10.9 - TH0) / THDT) + 2, THT = new Float64Array(THN);
        for (var k = 1; k < THN; k++) {
          var tm = TH0 + (k - 0.5) * THDT;
          THT[k] = THT[k - 1] + omega(tm) * THDT;
        }
        function theta(t) {
          var f = clamp((t - TH0) / THDT, 0, THN - 1.001), i = Math.floor(f);
          return lerp(THT[i], THT[i + 1], f - i);
        }
        function radiusK(t) { return 1 - 0.19 * P3IO(prog(t, T.all, 0.5)); } // "all of it": tightest

        /* ---------------- build the tiles ---------------- */
        var layer = document.getElementById("tiles");
        var tiles = [];
        var ringCount = [0, 0, 0];
        // the hairline halo carries short labels; the two big rings share the rest, types interleaved
        var ringOf = [];
        [2, 4, 6, 16, 19, 15].forEach(function (idx) { ringOf[idx] = 2; });
        var rest = []; for (var q = 0; q < SPEC.length; q++) if (ringOf[q] == null) rest.push(q);
        for (var q2 = rest.length - 1; q2 > 0; q2--) { var j = Math.floor(rnd() * (q2 + 1)); var tmp = rest[q2]; rest[q2] = rest[j]; rest[j] = tmp; }
        rest.forEach(function (idx, n) { ringOf[idx] = n % 2; });

        function keepIn(o, kx, ky, x, y, sc) { // flip drift components that point at a nearby edge
          var hw = (BASEW[o.type] * sc) / 2 + 40, hh = 55 * sc + 40;
          if ((x - hw < 64 && o[kx] < 0) || (x + hw > 1016 && o[kx] > 0) || (y + hh > 1100 && x + hw > 940 && o[kx] > 0)) o[kx] = -o[kx];
          if ((y - hh < 236 && o[ky] < 0) || (y + hh > 1284 && o[ky] > 0) || (y + hh > 1100 && x + hw > 940 && o[ky] > 0)) o[ky] = -o[ky];
        }
        SPEC.forEach(function (sp, i) {
          var el = document.createElement("div");
          el.className = "tile tt";
          el.setAttribute("data-layout-allow-occlusion", ""); // tiles pile and orbit in depth on purpose
          el.id = "tile-" + i;
          el.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true">' + ICON[sp[0]] + '</svg><div class="label">' + LABEL[sp[0]] + "</div>";
          layer.appendChild(el);
          var pa = PLAN_A[i], pc = PLAN_C[i];
          var o = {
            i: i, el: el, type: sp[0], cs: sp[1], role: sp[2], spawn: sp[3], heroEnd: sp[4],
            hw: BASEW[sp[0]] / 2,
            ax: pa[0], ay: pa[1], ar: clamp(pa[2] + rr(-5.5, 5.5), -8, 8),
            // slow drift
            vx: 0, vy: 0, vr: rr(-0.55, 0.55), bobA: rr(2, 4), bobW: rr(1.5, 2.6), bobP: rr(0, 6.283),
            // spray-out bulge for copies
            bend: rr(-0.22, 0.22), spin0: rr(-24, 24),
            // orbit
            ring: ringOf[i], phi: 0, rj: rr(-0.05, 0.05),
            sw0: T.cutB - 0.0333, swd: rr(0.8, 1.0), // every tile lets go on the same frame
            // scatter (shot C)
            cx: pc[0], cy: pc[1], cr: clamp(pc[2] + rr(-5, 5), -8, 8), cvx: 0, cvy: 0, cvr: rr(-0.8, 0.8),
            sc0: T.cutC - 0.0667 + rr(0, 0.03)
          };
          var da = rr(0, 6.283), dv = rr(3, 6.5);
          o.vx = Math.cos(da) * dv; o.vy = Math.sin(da) * dv;
          var dc = rr(0, 6.283), dvc = rr(4, 9);
          o.cvx = Math.cos(dc) * dvc; o.cvy = Math.sin(dc) * dvc;
          keepIn(o, "vx", "vy", pa[0], pa[1], sp[1]);
          keepIn(o, "cvx", "cvy", pc[0], pc[1], sp[1]);
          o.phi = (ringCount[o.ring]++ / RINGS[o.ring].n) * 6.2832 + rr(-0.1, 0.1) + o.ring * 0.4;
          // wide tiles ride slightly inside their ring so nothing leaves the frame
          o.rpen = Math.max(0, o.hw * RINGS[o.ring].s - 95) * 0.6;
          tiles.push(o);
        });
        // the hero pulses when it multiplies
        tiles[0].pulse = T.filesX; tiles[7].pulse = T.infoX; tiles[14].pulse = 3.66; tiles[17].pulse = 4.24; tiles[20].pulse = 5.1; tiles[23].pulse = 5.82;

        /* ---------------- phase A: pop, multiply, clutter (Jnanottam at the mirror) ---------------- */
        function drift(o, t, t0) {
          var dt = Math.max(0, t - t0), w = sstep(0, 0.9, dt);
          return [
            (o.vx * dt + o.bobA * Math.sin(o.bobW * t + o.bobP)) * w,
            (o.vy * dt + o.bobA * Math.cos(o.bobW * 0.83 * t + o.bobP)) * w,
            o.vr * dt * w
          ];
        }
        function stateA(o, t) {
          var st = o.spawn;
          if (t < st) return null;
          if (o.role === "copy") {
            var u = prog(t, st, 0.56), p = EO(u);
            var x0 = HERO.x, y0 = HERO.y, x1 = o.ax, y1 = o.ay;
            var dx = x1 - x0, dy = y1 - y0;
            var mx = (x0 + x1) / 2 - dy * o.bend, my = (y0 + y1) / 2 + dx * o.bend;
            var qq = 1 - p;
            var x = qq * qq * x0 + 2 * qq * p * mx + p * p * x1;
            var y = qq * qq * y0 + 2 * qq * p * my + p * p * y1;
            var d = drift(o, t, st + 0.2);
            return {
              x: x + d[0], y: y + d[1], s: o.cs * lerp(0.3, 1, P3O(u)), r: lerp(o.spin0, o.ar, P3O(u)) + d[2],
              a: clamp(u / 0.1, 0, 1), b: 7 * (1 - sstep(0, 0.5, u)), z: 100 + o.i
            };
          }
          // hero / final: pop at the hero spot
          var pu = prog(t, st, 0.44);
          var s = BO(pu), a = clamp((t - st) / 0.09, 0, 1), b = 8 * (1 - sstep(0, 0.22, t - st));
          var x = HERO.x + 2.5 * Math.sin(2.1 * t + o.i), y = HERO.y + 46 * (1 - P3O(pu)) + 2.5 * Math.cos(1.7 * t + o.i), r = 0;
          if (o.pulse != null && t > o.pulse) {
            var pl = prog(t, o.pulse, 0.36);
            s *= 1 + 0.085 * Math.sin(Math.PI * P2O(pl));
          }
          var z = 900;
          if (o.role === "hero" && t >= o.heroEnd) {
            var lu = prog(t, o.heroEnd, 0.62), lp = EO(lu);
            var d2 = drift(o, t, o.heroEnd + 0.35);
            x = lerp(x, o.ax, lp) + d2[0]; y = lerp(y, o.ay, lp) + d2[1];
            s = lerp(s, o.cs, P3O(lu)); r = lerp(0, o.ar, lp) + d2[2];
            b = Math.max(b, 4.5 * (1 - sstep(0, 0.42, lu)));
            z = lu < 1 ? 880 : 100 + o.i;
          } else if (o.role === "final" && t >= o.heroEnd) {
            var fu = P3IO(prog(t, o.heroEnd, 0.5));
            var d3 = drift(o, t, o.heroEnd + 0.2);
            x = lerp(x, o.ax, fu) + d3[0]; y = lerp(y, o.ay, fu) + d3[1];
            s = lerp(s, o.cs, fu); r = lerp(0, o.ar, fu) + d3[2];
          }
          return { x: x, y: y, s: s, r: r, a: a, b: b, z: z };
        }

        /* ---------------- phase B: orbit (Kartik) ---------------- */
        function ringCenter(o, t) {
          var g = track(TB, t), R = RINGS[o.ring];
          return [g[0] + R.dx, g[1] + R.dy];
        }
        function phase(o, t) { var R = RINGS[o.ring]; return o.phi + R.dir * theta(t) * R.spd; }
        function stateB(o, t) {
          var R = RINGS[o.ring], c = ringCenter(o, t), g = track(TB, t);
          var G = ringGeo(R, t);
          var rad = G.rad * (1 + o.rj) - o.rpen;
          var ph = phase(o, t);
          var X = rad * Math.cos(ph), Z = rad * Math.sin(ph);
          var oy = -Z * G.sa, depth = Z * G.ca;
          var rx = X * R.cb - oy * R.sb, ry = X * R.sb + oy * R.cb;
          var p = F / (F + depth);
          var x = c[0] + rx * p, y = c[1] + ry * p;
          var back = clamp(depth / (rad * G.ca + 1), 0, 1);
          var a = lerp(1, 0.52, back);
          if (depth > 0) { // passing behind his head: hide where the head would cover it
            var hx = g[0] + HEADB.dx, hy = g[1] + HEADB.dy;
            var dd = Math.sqrt(Math.pow((x - hx) / HEADB.rx, 2) + Math.pow((y - hy) / HEADB.ry, 2));
            a *= lerp(1, sstep(0.74, 1.04, dd), clamp(depth / 40, 0, 1));
          }
          var speed = Math.abs(omega(t) * R.spd) * rad * p;
          return {
            x: x, y: y, s: R.s * p, r: R.roll * 0.5 - 4 * Math.cos(ph) * R.dir,
            yaw: 62 * Math.cos(ph), // carousel: tiles turn edge-on at the sides of the ring
            a: a, b: Math.max(clamp((speed - 560) / 420, 0, 3), 1.1 * back), z: Math.round(3000 - depth)
          };
        }
        // continuous screen-space angle of a ring position around its centre (no wrap jumps)
        function psiOf(o, S, c, t) { var ph = phase(o, t); return -ph + wrapPi(Math.atan2(S.y - c[1], S.x - c[0]) + ph); }
        function stateSwirl(o, t) { // shot A clutter -> swirls into the rings, starting on the cut
          var R = RINGS[o.ring];
          if (!o.fa) {
            o.fa = stateA(o, o.sw0) || { x: HERO.x, y: HERO.y, s: 0.5, r: 0, a: 1, b: 0 };
            var c0 = ringCenter(o, o.sw0), B0 = stateB(o, o.sw0), pB0 = psiOf(o, B0, c0, o.sw0);
            o.faR = Math.hypot(o.fa.x - c0[0], o.fa.y - c0[1]);
            // start angle, unwrapped next to the target, biased to travel with the ring's spin
            o.faPsi = pB0 + wrapPi(Math.atan2(o.fa.y - c0[1], o.fa.x - c0[0]) - pB0);
          }
          var A = o.fa, B = stateB(o, t), c = ringCenter(o, t);
          var u = prog(t, o.sw0, o.swd), p = EO(u);
          var rB = Math.hypot(B.x - c[0], B.y - c[1]);
          var spin = -R.dir * (theta(t) - theta(o.sw0)) * R.spd * Math.min(1, rB / o.faR);
          var ang = lerp(o.faPsi + spin, psiOf(o, B, c, t), P3O(u));
          var rad = lerp(o.faR, rB, p);
          var S = {
            x: c[0] + rad * Math.cos(ang), y: c[1] + rad * Math.sin(ang), s: lerp(A.s, B.s, P3O(u)), r: lerp(A.r, B.r, p),
            yaw: B.yaw * p, a: lerp(1, B.a, P3O(u)), b: Math.max(B.b, 10 * Math.pow(1 - u, 2.2)), z: B.z
          };
          return t >= T.cutB ? pushOut(S, faceB(t), 1 - sstep(0.6, 1, u), o) : S;
        }

        /* ---------------- phase C: scatter + tangle (Jnanottam in the nook) ---------------- */
        function jit(t) { return sstep(T.comp - 0.04, T.comp + 0.1, t) * (1 - 0.35 * sstep(12.7, 13.15, t)); }
        function stateC(o, t) {
          var dt = t - T.cutC;
          var x = o.cx + o.cvx * dt + 2.5 * Math.sin(1.9 * t + o.i);
          var y = o.cy + o.cvy * dt + 2.5 * Math.cos(1.6 * t + o.i * 1.7);
          var r = o.cr + o.cvr * dt;
          var j = jit(t);
          if (j > 0) {
            var f = Math.round(t * 30);
            x += (hash01(f * 131 + o.i * 7919) - 0.5) * 6 * j;
            y += (hash01(f * 173 + o.i * 104729) - 0.5) * 6 * j;
            r += (hash01(f * 211 + o.i * 31) - 0.5) * 2 * j;
          }
          return { x: x, y: y, s: o.cs, r: r, a: 1, b: 0, z: 100 + ((o.i * 7) % 25) };
        }
        function stateScatter(o, t) {
          if (!o.fb) o.fb = stateB(o, o.sc0);
          var B = o.fb, C = stateC(o, t);
          var u = prog(t, o.sc0, 0.58), p = EO(u);
          var S = {
            x: lerp(B.x, C.x, p), y: lerp(B.y, C.y, p), s: lerp(B.s, C.s, P3O(u)), r: lerp(B.r, C.r, p),
            yaw: B.yaw * (1 - p), a: lerp(B.a, 1, P3O(u)), b: Math.max(B.b * (1 - u), 9 * (1 - sstep(0, 0.5, u))), z: C.z
          };
          return pushOut(S, t >= T.cutC ? faceC(t) : faceB(t), 1, o);
        }

        function stateOf(o, t) {
          if (t < o.sw0) return stateA(o, t);
          if (t < o.sc0) return o.sw0 + o.swd > t ? stateSwirl(o, t) : stateB(o, t);
          if (t < o.sc0 + 0.58) return stateScatter(o, t);
          return stateC(o, t);
        }

        /* ---------------- glowing strands (shot C) ---------------- */
        var SVGNS = "http://www.w3.org/2000/svg";
        var gStr = document.getElementById("strands");
        var strands = [];
        (function buildStrands() {
          var waves = [[T.but, 12, 0.035], [T.sound, 14, 0.028], [T.comp, 20, 0.02]];
          var used = {};
          var FX = 488, FY = 912, FRX = 185, FRY = 232; // Jnanottam's face (shot C) plus a margin for the jitter
          function bez(a, b, c, d, u) { var v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; }
          waves.forEach(function (w) {
            var n = 0, guard = 0;
            while (n < w[1] && guard++ < 6000) {
              var a = Math.floor(rnd() * tiles.length), b = Math.floor(rnd() * tiles.length);
              if (a === b) continue;
              var key = a < b ? a + "-" + b : b + "-" + a;
              if (used[key]) continue;
              var A = tiles[a], B = tiles[b];
              var dx = B.cx - A.cx, dy = B.cy - A.cy, L = Math.hypot(dx, dy);
              if (L < 260) continue;
              var o1 = rr(0.18, 0.42) * (rnd() < 0.5 ? -1 : 1), o2 = rr(0.18, 0.42) * (rnd() < 0.5 ? -1 : 1);
              var f1 = rr(0.22, 0.4), f2 = rr(0.6, 0.8), nx = -dy / L, ny = dx / L;
              var c1x = A.cx + dx * f1 + nx * o1 * L, c1y = A.cy + dy * f1 + ny * o1 * L;
              var c2x = A.cx + dx * f2 + nx * o2 * L, c2y = A.cy + dy * f2 + ny * o2 * L;
              var hit = false;
              for (var k2 = 0; k2 <= 24 && !hit; k2++) {
                var px = bez(A.cx, c1x, c2x, B.cx, k2 / 24), py = bez(A.cy, c1y, c2y, B.cy, k2 / 24);
                if (Math.pow((px - FX) / FRX, 2) + Math.pow((py - FY) / FRY, 2) < 1) hit = true;
                if (py > 1282 || py < 236 || px < 40 || px > 1040) hit = true; // stay out of the caption band / edges
              }
              if (hit) continue;
              used[key] = 1;
              var s = { a: a, b: b, t0: w[0] + n * w[2] + rr(0, 0.04), o1: o1, o2: o2, f1: f1, f2: f2, w: rr(0.8, 1.25), seed: strands.length + 1 };
              s.bloom = document.createElementNS(SVGNS, "path");
              s.glow = document.createElementNS(SVGNS, "path");
              s.core = document.createElementNS(SVGNS, "path");
              [s.bloom, s.glow, s.core].forEach(function (pth) {
                pth.setAttribute("pathLength", "1");
                pth.setAttribute("stroke-dasharray", "1 1");
                pth.style.visibility = "hidden";
                gStr.appendChild(pth);
              });
              strands.push(s);
              n++;
            }
          });
        })();
        function mixc(c1, c2, u) {
          return "rgb(" + Math.round(lerp(c1[0], c2[0], u)) + "," + Math.round(lerp(c1[1], c2[1], u)) + "," + Math.round(lerp(c1[2], c2[2], u)) + ")";
        }
        function drawStrands(t) {
          var red = sstep(T.comp - 0.03, T.comp + 0.12, t);
          var pulse = t > T.comp ? 0.5 + 0.5 * Math.cos(6.2832 * 3.1 * (t - T.comp)) : 0;
          var j = jit(t), f = Math.round(t * 30);
          var coreC = mixc([214, 232, 255], [255, 128, 118], red);
          var glowC = mixc([79, 157, 255], [255, 59, 48], red);
          strands.forEach(function (s) {
            var u = prog(t, s.t0, 0.55);
            var vis = u > 0 && t >= T.cutC + 0.25;
            if (!vis) {
              if (s.on) { s.bloom.style.visibility = s.glow.style.visibility = s.core.style.visibility = "hidden"; s.on = false; }
              return;
            }
            var A = tiles[s.a].cur, B = tiles[s.b].cur;
            var dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
            var c1x = A.x + dx * s.f1 + nx * s.o1 * L, c1y = A.y + dy * s.f1 + ny * s.o1 * L;
            var c2x = A.x + dx * s.f2 + nx * s.o2 * L, c2y = A.y + dy * s.f2 + ny * s.o2 * L;
            if (j > 0) {
              c1x += (hash01(f * 97 + s.seed * 389) - 0.5) * 14 * j; c1y += (hash01(f * 89 + s.seed * 617) - 0.5) * 14 * j;
              c2x += (hash01(f * 83 + s.seed * 991) - 0.5) * 14 * j; c2y += (hash01(f * 79 + s.seed * 271) - 0.5) * 14 * j;
            }
            var d = "M" + A.x.toFixed(1) + " " + A.y.toFixed(1) + "C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + B.x.toFixed(1) + " " + B.y.toFixed(1);
            var off = (1 - P2O(u)).toFixed(4);
            [s.bloom, s.glow, s.core].forEach(function (pth) {
              pth.setAttribute("d", d);
              pth.style.strokeDashoffset = off;
              pth.style.visibility = "visible";
            });
            s.on = true;
            s.bloom.style.stroke = glowC; s.bloom.style.strokeWidth = (16 * s.w).toFixed(2); s.bloom.style.opacity = (0.07 + 0.08 * pulse * red).toFixed(3);
            s.glow.style.stroke = glowC; s.glow.style.strokeWidth = ((6 + 2.5 * pulse * red) * s.w).toFixed(2); s.glow.style.opacity = (0.3 + 0.28 * pulse * red).toFixed(3);
            s.core.style.stroke = coreC; s.core.style.strokeWidth = ((2.1 + 0.9 * pulse * red) * s.w).toFixed(2); s.core.style.opacity = "0.92";
          });
        }

        /* ---------------- orbit trails (shot B) ---------------- */
        var gBack = document.getElementById("ringsBack"), gFront = document.getElementById("ringsFront");
        var headEll = document.getElementById("headEll");
        var trails = RINGS.map(function () {
          var t = {};
          t.back = document.createElementNS(SVGNS, "path"); t.front = document.createElementNS(SVGNS, "path");
          t.backG = document.createElementNS(SVGNS, "path"); t.frontG = document.createElementNS(SVGNS, "path");
          [t.backG, t.back].forEach(function (p) { gBack.appendChild(p); });
          [t.frontG, t.front].forEach(function (p) { gFront.appendChild(p); });
          [t.back, t.front, t.backG, t.frontG].forEach(function (p) { p.setAttribute("pathLength", "1"); p.setAttribute("stroke-dasharray", "1 1"); p.style.visibility = "hidden"; });
          return t;
        });
        function drawTrails(t) {
          var on = t >= T.cutB - 0.034 && t < T.cutC - 0.001;
          var g = track(TB, t);
          headEll.setAttribute("cx", (g[0] + HEADB.dx).toFixed(1));
          headEll.setAttribute("cy", (g[1] + HEADB.dy).toFixed(1));
          RINGS.forEach(function (R, k) {
            var tr = trails[k];
            if (!on) { tr.back.style.visibility = tr.front.style.visibility = tr.backG.style.visibility = tr.frontG.style.visibility = "hidden"; return; }
            var cx = g[0] + R.dx, cy = g[1] + R.dy, G = ringGeo(R, t), rad = G.rad * 0.985;
            var back = "", front = "";
            for (var n = 0; n <= 40; n++) {
              var ph = (n / 40) * Math.PI; // 0..pi: far half (Z > 0)
              for (var h = 0; h < 2; h++) {
                var phi = h === 0 ? ph : ph + Math.PI;
                var X = rad * Math.cos(phi), Z = rad * Math.sin(phi), oy = -Z * G.sa, depth = Z * G.ca;
                var rx = X * R.cb - oy * R.sb, ry = X * R.sb + oy * R.cb, p = F / (F + depth);
                var seg = (n === 0 ? "M" : "L") + (cx + rx * p).toFixed(1) + " " + (cy + ry * p).toFixed(1);
                if (h === 0) back += seg; else front += seg;
              }
            }
            var draw = P3O(prog(t, T.cutB + 0.02 + k * 0.06, 0.7));
            var fade = 1 - prog(t, T.cutC - 0.1, 0.09);
            var spinBoost = sstep(9.3, 9.8, t);
            [[tr.back, back, 0.3], [tr.backG, back, 0.1], [tr.front, front, 0.55], [tr.frontG, front, 0.16]].forEach(function (it, idx) {
              var pth = it[0];
              pth.setAttribute("d", it[1]);
              pth.style.visibility = "visible";
              pth.style.strokeDashoffset = (1 - draw).toFixed(4);
              var glow = idx % 2 === 1;
              pth.style.stroke = glow ? "rgb(79,157,255)" : "rgb(190,218,255)";
              pth.style.strokeWidth = glow ? (8 + 4 * spinBoost).toFixed(1) : (1.8 + 0.6 * spinBoost).toFixed(2);
              pth.style.opacity = (it[2] * fade * (1 + 0.4 * spinBoost)).toFixed(3);
            });
          });
        }

        /* ---------------- per-frame render ---------------- */
        var world = document.getElementById("world");
        function vanish(t) { // hard reset: 83.30 -> nothing visible on the last frame (83.367)
          if (t < T.cutD - 0.045) return 1;    // ... frame 394 (83.233)
          if (t < T.cutD - 0.015) return 0.42;  // frame 395 (83.267): the tangle snaps shut
          return 0;                             // frames 396-398 (83.300 on, the next shot): nothing
        }
        function render(t) {
          var v = vanish(t);
          world.style.opacity = v.toFixed(3);
          world.style.visibility = v <= 0 ? "hidden" : "visible";
          if (v > 0 && v < 1) {
            var sc = lerp(0.9, 1, v);
            world.style.transform = "scale(" + sc.toFixed(3) + ")";
          } else world.style.transform = "none";
          tiles.forEach(function (o) {
            var s = stateOf(o, t);
            o.cur = s;
            var el = o.el;
            if (!s || s.a <= 0.003 || s.s <= 0.002) { el.style.visibility = "hidden"; return; }
            el.style.visibility = "visible";
            var yaw = s.yaw || 0;
            el.style.transform = "translate(-50%,-50%) translate(" + s.x.toFixed(2) + "px," + s.y.toFixed(2) + "px) rotate(" + s.r.toFixed(2) + "deg)" +
              (Math.abs(yaw) > 0.05 ? " perspective(900px) rotateY(" + yaw.toFixed(2) + "deg)" : "") + " scale(" + s.s.toFixed(4) + ")";
            el.style.opacity = s.a.toFixed(3);
            el.style.filter = s.b > 0.15 ? "blur(" + s.b.toFixed(2) + "px)" : "none";
            el.style.zIndex = String(s.z);
          });
          drawTrails(t);
          drawStrands(t);
        }

        /* ---------------- one paused timeline; a single clock drives the deterministic render ---------------- */
        // GSAP writes clock.t on every render (also when a seek suppresses callbacks); the setter redraws.
        var clockT = 0, clock = {};
        Object.defineProperty(clock, "t", { get: function () { return clockT; }, set: function (v) { clockT = v; render(v); } });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", lazy: false, immediateRender: false }, 0);
        render(0);
        window.__tilesDebug = { render: render, tiles: tiles, stateOf: stateOf };
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
