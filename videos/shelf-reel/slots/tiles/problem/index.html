    <style>
      /* tiles/problem v2 — the scattered study material as WhatsApp dark-mode message bubbles.
         v1's approved choreography is kept (pop on the words, multiply, orbit his head, tangle, hard vanish);
         every tile is now a message from a different chat, and every bubble pulses on the bar downbeats. */
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }
      #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      #fx path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      #bubbles { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }

      /* ---------- a WhatsApp dark-mode message bubble (incoming, first of its run: tail top-left) ----------
         Authored at scale 1 with fixed sizes (the layout planner uses the same numbers); the script places
         each one by its centre and scales it. */
      .wb {
        position: absolute; left: 0; top: 0; box-sizing: border-box; visibility: hidden;
        border-radius: 0 20px 20px 20px; padding: 12px 16px 10px 18px;
        font-family: var(--font-ui); color: #e9edef;
        background: linear-gradient(180deg, #26353d 0%, #202c33 46%, #1d282f 100%);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.42), 0 3px 8px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.075);
      }
      .wb .tl { position: absolute; left: -15px; top: 0; width: 16px; height: 25px; display: block; }
      .wb .chat { font: 600 22px/28px var(--font-ui); letter-spacing: 0.005em; white-space: nowrap; color: var(--c, #53bdeb); }
      .wb .tm { font: 400 16.5px/20px var(--font-ui); color: #93a2aa; white-space: nowrap; }
      .wb .tm.r { text-align: right; }
      .wb .txt { font: 400 27px/34px var(--font-ui); letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .wb.doc { width: 460px; height: 166px; }
      .wb.fwd, .wb.pin { width: 470px; height: 136px; }
      .wb.voice { width: 440px; height: 140px; }
      .wb.text { width: 360px; height: 108px; }
      .wb.photo { width: 340px; height: 288px; }

      /* document */
      .docbox { display: flex; align-items: center; gap: 14px; height: 80px; margin-top: 6px; padding: 0 14px 0 12px; border-radius: 12px; background: rgba(11, 20, 26, 0.55); }
      .docbox .pdf { width: 44px; height: 54px; flex: none; display: block; }
      .dn { min-width: 0; flex: 1; }
      .fn { font: 600 23.5px/29px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .fm { font: 400 18px/23px var(--font-ui); color: #93a2aa; white-space: nowrap; margin-top: 1px; }
      .foot { display: flex; justify-content: space-between; align-items: center; height: 24px; margin-top: 6px; font: 400 17px/24px var(--font-ui); color: #93a2aa; }

      /* forwarded / pinned text */
      .lbl { display: flex; align-items: center; gap: 7px; height: 24px; margin-top: 2px; font: italic 400 19px/24px var(--font-ui); color: #93a2aa; white-space: nowrap; }
      .lbl.pinned { font-style: normal; }
      .lbl svg { width: 22px; height: 22px; display: block; flex: none; }
      .wb.fwd .txt, .wb.pin .txt { margin-top: 3px; }
      .wb.pin .txt { display: flex; align-items: center; gap: 9px; font-weight: 600; }
      .wb.pin .txt svg { width: 27px; height: 27px; flex: none; display: block; }

      /* voice note */
      .vrow { display: flex; align-items: center; gap: 12px; height: 62px; margin-top: 6px; }
      .vav { position: relative; width: 56px; height: 56px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 25px/1 var(--font-ui); color: #fff; }
      .vav .mic { position: absolute; right: -4px; bottom: -3px; width: 24px; height: 24px; border-radius: 50%; background: #25d366; display: grid; place-items: center; box-shadow: 0 0 0 2.5px #202c33; }
      .vav .mic svg { width: 12px; height: 15px; display: block; }
      .vrow .play { width: 24px; height: 28px; flex: none; display: block; }
      .vrow .wave { width: 268px; height: 40px; flex: none; display: block; }
      .vfoot { display: flex; justify-content: space-between; height: 20px; margin-top: 4px; padding-left: 104px; font: 400 16.5px/20px var(--font-ui); color: #93a2aa; }

      /* photo (a blurry phone photo of a page — never a real photo) */
      .pic { position: relative; width: 306px; height: 196px; margin-top: 6px; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 90% at 30% 20%, #4a3e33 0%, #2c241d 70%, #211b16 100%); }

      .pic .pg::before { content: ""; position: absolute; left: 18%; top: 12%; width: 64%; height: 80%; transform: rotate(var(--r, -6deg));
        background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0 12px, rgba(70, 92, 140, var(--rl, 0.3)) 12px 13.5px), linear-gradient(160deg, var(--p0, #f1ebde) 0%, var(--p1, #e2d9c6) 60%, var(--p2, #cfc4ae) 100%);

      .pic .pg::after { content: ""; position: absolute; left: 26%; top: 22%; width: 48%; height: 60%; transform: rotate(var(--r, -6deg));

          linear-gradient(90deg, rgba(40, 46, 70, 0.6) 0 64%, transparent 64%) 0 4% / 100% 5px no-repeat,
          linear-gradient(90deg, rgba(40, 46, 70, 0.5) 0 88%, transparent 88%) 0 20% / 100% 4px no-repeat,
          linear-gradient(90deg, rgba(40, 46, 70, 0.5) 0 58%, transparent 58%) 0 36% / 100% 4px no-repeat,
          linear-gradient(90deg, rgba(40, 46, 70, 0.5) 0 82%, transparent 82%) 0 52% / 100% 4px no-repeat,
          linear-gradient(90deg, rgba(150, 40, 40, 0.45) 0 44%, transparent 44%) 0 68% / 100% 4px no-repeat,
          linear-gradient(90deg, rgba(40, 46, 70, 0.5) 0 72%, transparent 72%) 0 84% / 100% 4px no-repeat; }
      .pic.pyq .pg { --p0: #f4f5f6; --p1: #e2e4e7; --p2: #c4c8cd; --rl: 0; filter: blur(3.4px); }
      .pic.pyq .pg::after { background:
          linear-gradient(90deg, rgba(30, 30, 40, 0.75) 0 50%, transparent 50%) 25% 3% / 100% 6px no-repeat,
          repeating-linear-gradient(180deg, transparent 0 15px, rgba(30, 30, 40, 0.45) 15px 17px) 0 20% / 100% 80% no-repeat,
          linear-gradient(90deg, transparent 0 22%, rgba(30, 30, 40, 0.45) 22% 24%, transparent 24% 70%, rgba(30, 30, 40, 0.45) 70% 72%, transparent 72%) 0 20% / 100% 80% no-repeat; }
      .pic.id { background: radial-gradient(120% 90% at 60% 30%, #3e4a55 0%, #26303a 70%, #1c242c 100%); }
      .pic.id .pg::before { left: 16%; top: 20%; width: 68%; height: 62%; border-radius: 10px; background: linear-gradient(150deg, #e3ebf3 0%, #c9d6e3 70%, #b3c2d2 100%); }
      .pic.id .pg::after { left: 22%; top: 30%; width: 56%; height: 42%;
        background:
          linear-gradient(#7d8fa3, #7d8fa3) 0 0 / 30% 100% no-repeat,
          linear-gradient(90deg, rgba(40, 50, 70, 0.55) 0 100%) 100% 8% / 60% 6px no-repeat,
          linear-gradient(90deg, rgba(40, 50, 70, 0.45) 0 100%) 100% 34% / 54% 5px no-repeat,
          linear-gradient(90deg, rgba(40, 50, 70, 0.45) 0 100%) 100% 58% / 60% 5px no-repeat,
          linear-gradient(90deg, rgba(200, 60, 60, 0.5) 0 100%) 100% 84% / 40% 5px no-repeat; }
      .pic .tmo { position: absolute; right: 10px; bottom: 7px; font: 400 16px/20px var(--font-ui); color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); z-index: 2; }
      .pic::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(180deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.45)); }
      .cap { display: flex; align-items: center; gap: 8px; height: 32px; margin-top: 6px; font: 500 21px/32px var(--font-ui); white-space: nowrap; overflow: hidden; }
      .cap svg { width: 22px; height: 22px; flex: none; display: block; }
    </style>

          var S = {
            x: lerp(B.x, C.x, p), y: lerp(B.y, C.y, p), s: lerp(B.s, C.s, P3O(u)), r: lerp(B.r, C.r, p),
            yaw: B.yaw * (1 - p), a: lerp(B.a, 1, P3O(u)), b: Math.max(B.b * (1 - u), 9 * (1 - sstep(0, 0.5, u))), z: C.z
          };
          return pushOut(S, headC(t), 1, o);
        }

        function stateOf(o, t) {
          if (t < o.sw0) return stateA(o, t);
          if (t < o.sc0) return o.sw0 + o.swd > t ? stateSwirl(o, t) : stateB(o, t);
          if (t < o.sc0 + 0.58) return stateScatter(o, t);
          return stateC(o, t);
        }

        /* ---------------- glowing strands (shot C): WhatsApp green turning red ---------------- */
        var SVGNS = "http://www.w3.org/2000/svg";
        var gStr = document.getElementById("strands");
        var strands = [];
        (function buildStrands() {
          var waves = [[T.but, 12, 0.035], [T.sound, 14, 0.028], [T.comp, 20, 0.02]];
          var used = {};
          var FX = 482, FY = 896, FRX = 190, FRY = 240; // his head in the nook (hair included) plus a margin for the jitter
          function bez(a, b, c, d, u) { var v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; }
          waves.forEach(function (w) {
            var n = 0, guard = 0;
            while (n < w[1] && guard++ < 6000) {
              var a = Math.floor(rnd() * bubbles.length), b = Math.floor(rnd() * bubbles.length);
              if (a === b) continue;
              var key = a < b ? a + "-" + b : b + "-" + a;
              if (used[key]) continue;
              var A = bubbles[a], B = bubbles[b];
              var dx = B.cx - A.cx, dy = B.cy - A.cy, L = Math.hypot(dx, dy);
              if (L < 260) continue;
              var o1 = rr(0.18, 0.42) * (rnd() < 0.5 ? -1 : 1), o2 = rr(0.18, 0.42) * (rnd() < 0.5 ? -1 : 1);
              var f1 = rr(0.22, 0.4), f2 = rr(0.6, 0.8), nx = -dy / L, ny = dx / L;
              var c1x = A.cx + dx * f1 + nx * o1 * L, c1y = A.cy + dy * f1 + ny * o1 * L;
              var c2x = A.cx + dx * f2 + nx * o2 * L, c2y = A.cy + dy * f2 + ny * o2 * L;
              var hit = false;
              for (var k2 = 0; k2 <= 24 && !hit; k2++) {
                var px = bez(A.cx, c1x, c2x, B.cx, k2 / 24), py = bez(A.cy, c1y, c2y, B.cy, k2 / 24);
                if (Math.pow((px - FX) / FRX, 2) + Math.pow((py - FY) / FRY, 2) < 1) hit = true;
                if (py > 1280 || py < 236 || px < 40 || px > 1040) hit = true; // out of the caption band / edges
              }
              if (hit) continue;
              used[key] = 1;
              var s = { a: a, b: b, t0: w[0] + n * w[2] + rr(0, 0.04), o1: o1, o2: o2, f1: f1, f2: f2, w: rr(0.8, 1.25), seed: strands.length + 1 };
              s.bloom = document.createElementNS(SVGNS, "path");
              s.glow = document.createElementNS(SVGNS, "path");
              s.core = document.createElementNS(SVGNS, "path");
              [s.bloom, s.glow, s.core].forEach(function (pth) {
                pth.setAttribute("pathLength", "1");
                pth.setAttribute("stroke-dasharray", "1 1");
                pth.style.visibility = "hidden";
                gStr.appendChild(pth);
              });
              strands.push(s);
              n++;
            }
          });
        })();
        function mixc(c1, c2, u) {
          return "rgb(" + Math.round(lerp(c1[0], c2[0], u)) + "," + Math.round(lerp(c1[1], c2[1], u)) + "," + Math.round(lerp(c1[2], c2[2], u)) + ")";
        }
        function drawStrands(t) {
          var red = sstep(T.comp - 0.03, T.comp + 0.12, t);
          var pulseR = t > T.comp ? 0.5 + 0.5 * Math.cos(6.2832 * 3.1 * (t - T.comp)) : 0;
          var j = jit(t), f = Math.round(t * 30);
          // WhatsApp green turning alarm red as it gets "complicated"
          var g1 = sstep(T.but - 0.1, T.comp - 0.1, t);
          var coreC = mixc(mixc0([208, 252, 224], [255, 214, 196], g1 * 0.5), [255, 128, 118], red);
          var glowC = mixc(mixc0([37, 211, 102], [140, 200, 90], g1 * 0.3), [255, 59, 48], red);
          strands.forEach(function (s) {
            var u = prog(t, s.t0, 0.55);
            var vis = u > 0 && t >= T.cutC + 0.25;
            if (!vis) {
              if (s.on) { s.bloom.style.visibility = s.glow.style.visibility = s.core.style.visibility = "hidden"; s.on = false; }
              return;
            }
            var A = bubbles[s.a].cur, B = bubbles[s.b].cur;
            var dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
            var c1x = A.x + dx * s.f1 + nx * s.o1 * L, c1y = A.y + dy * s.f1 + ny * s.o1 * L;
            var c2x = A.x + dx * s.f2 + nx * s.o2 * L, c2y = A.y + dy * s.f2 + ny * s.o2 * L;
            if (j > 0) {
              c1x += (hash01(f * 97 + s.seed * 389) - 0.5) * 14 * j; c1y += (hash01(f * 89 + s.seed * 617) - 0.5) * 14 * j;
              c2x += (hash01(f * 83 + s.seed * 991) - 0.5) * 14 * j; c2y += (hash01(f * 79 + s.seed * 271) - 0.5) * 14 * j;
            }
            var d = "M" + A.x.toFixed(1) + " " + A.y.toFixed(1) + "C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + B.x.toFixed(1) + " " + B.y.toFixed(1);
            var off = (1 - P2O(u)).toFixed(4);
            [s.bloom, s.glow, s.core].forEach(function (pth) {
              pth.setAttribute("d", d);
              pth.style.strokeDashoffset = off;
              pth.style.visibility = "visible";
            });
            s.on = true;
            s.bloom.style.stroke = glowC; s.bloom.style.strokeWidth = (16 * s.w).toFixed(2); s.bloom.style.opacity = (0.07 + 0.08 * pulseR * red).toFixed(3);
            s.glow.style.stroke = glowC; s.glow.style.strokeWidth = ((6 + 2.5 * pulseR * red) * s.w).toFixed(2); s.glow.style.opacity = (0.3 + 0.18 * pulseR * red).toFixed(3);
            s.core.style.stroke = coreC; s.core.style.strokeWidth = ((2.1 + 0.9 * pulseR * red) * s.w).toFixed(2); s.core.style.opacity = "0.92";
          });
        }
        function mixc0(c1, c2, u) { return [lerp(c1[0], c2[0], u), lerp(c1[1], c2[1], u), lerp(c1[2], c2[2], u)]; }

        /* ---------------- orbit trails (shot B) ---------------- */
        var gBack = document.getElementById("ringsBack"), gFront = document.getElementById("ringsFront");
        var headEll = document.getElementById("headEll");
        var trails = RINGS.map(function () {
          var tr = {};
          tr.back = document.createElementNS(SVGNS, "path"); tr.front = document.createElementNS(SVGNS, "path");
          tr.backG = document.createElementNS(SVGNS, "path"); tr.frontG = document.createElementNS(SVGNS, "path");
          [tr.backG, tr.back].forEach(function (p) { gBack.appendChild(p); });
          [tr.frontG, tr.front].forEach(function (p) { gFront.appendChild(p); });
          [tr.back, tr.front, tr.backG, tr.frontG].forEach(function (p) { p.setAttribute("pathLength", "1"); p.setAttribute("stroke-dasharray", "1 1"); p.style.visibility = "hidden"; });
          return tr;
        });
        function drawTrails(t) {
          var on = t >= T.cutB - 0.005 && t < T.cutC - 0.001;
          var g = track(TB, t);
          headEll.setAttribute("cx", (g[0] + HEADB.dx).toFixed(1));
          headEll.setAttribute("cy", (g[1] + HEADB.dy).toFixed(1));
          RINGS.forEach(function (R, k) {
            var tr = trails[k];
            if (!on) { tr.back.style.visibility = tr.front.style.visibility = tr.backG.style.visibility = tr.frontG.style.visibility = "hidden"; return; }
            var cx = g[0] + R.dx, cy = g[1] + R.dy, Gm = ringGeo(R, t), rad = Gm.rad * 0.985;
            var back = "", front = "";
            for (var n = 0; n <= 40; n++) {
              var ph = (n / 40) * Math.PI; // 0..pi: far half (Z > 0)
              for (var h = 0; h < 2; h++) {
                var phi = h === 0 ? ph : ph + Math.PI;
                var X = rad * Math.cos(phi), Z = rad * Math.sin(phi), oy = -Z * Gm.sa, depth = Z * Gm.ca;
                var rx = X * R.cb - oy * R.sb, ry = X * R.sb + oy * R.cb, p = FOC / (FOC + depth);
                var seg = (n === 0 ? "M" : "L") + (cx + rx * p).toFixed(1) + " " + (cy + ry * p).toFixed(1);
                if (h === 0) back += seg; else front += seg;
              }
            }
            var draw = P3O(prog(t, T.cutB + 0.02 + k * 0.06, 0.7));
            var fade = 1 - prog(t, T.cutC - 0.1, 0.09);
            var spinBoost = sstep(9.3, 9.8, t);
            [[tr.back, back, 0.28], [tr.backG, back, 0.09], [tr.front, front, 0.5], [tr.frontG, front, 0.15]].forEach(function (it, idx) {
              var pth = it[0];
              pth.setAttribute("d", it[1]);
              pth.style.visibility = "visible";
              pth.style.strokeDashoffset = (1 - draw).toFixed(4);
              var glow = idx % 2 === 1;
              pth.style.stroke = glow ? "rgb(37,211,102)" : "rgb(200,245,215)";
              pth.style.strokeWidth = glow ? (8 + 4 * spinBoost).toFixed(1) : (1.8 + 0.6 * spinBoost).toFixed(2);
              pth.style.opacity = (it[2] * fade * (1 + 0.4 * spinBoost)).toFixed(3);
            });
          });
        }

        /* ---------------- per-frame render ---------------- */
        var world = document.getElementById("world");
        function vanish(t) { // hard reset (the music resets too): 83.333 full, 83.367 snaps shut, 83.400 nothing
          if (t < T.cutD - 0.018) return 1;     // ... frame 397 (83.333)
          if (t < T.cutD + 0.016) return 0.36;  // frame 398 (83.367): the tangle implodes
          return 0;                             // frame 399 (83.400): nothing visible
        }
        function render(t) {
          var v = vanish(t);
          world.style.opacity = v.toFixed(3);
          world.style.visibility = v <= 0 ? "hidden" : "visible";
          world.style.transformOrigin = "540px 820px";
          world.style.transform = v > 0 && v < 1 ? "scale(" + lerp(0.86, 1, v).toFixed(3) + ")" : "none";
          var pk = pulse(t);
          bubbles.forEach(function (o) {
            var s = stateOf(o, t);
            o.cur = s;
            var el = o.el;
            if (!s || s.a <= 0.003 || s.s <= 0.002) { el.style.visibility = "hidden"; return; }
            el.style.visibility = "visible";
            var yaw = s.yaw || 0, sc = s.s * pk;
            el.style.transform = "translate(" + (s.x - o.hw).toFixed(2) + "px," + (s.y - o.hh).toFixed(2) + "px) rotate(" + s.r.toFixed(2) + "deg)" +
              (Math.abs(yaw) > 0.05 ? " perspective(900px) rotateY(" + yaw.toFixed(2) + "deg)" : "") + " scale(" + sc.toFixed(4) + ")";
            el.style.opacity = s.a.toFixed(3);
            el.style.filter = s.b > 0.15 ? "blur(" + s.b.toFixed(2) + "px)" : "none";
            el.style.zIndex = String(s.z);
          });
          drawTrails(t);
          drawStrands(t);
        }

        /* ---------------- one paused timeline; a single clock drives the deterministic render ---------------- */
        // GSAP writes clock.t on every render (also when a seek suppresses callbacks); the setter redraws.
        var clockT = 0, clock = {};
        Object.defineProperty(clock, "t", { get: function () { return clockT; }, set: function (v) { clockT = v; render(v); } });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", lazy: false, immediateRender: false }, 0);
        render(0);
        window.__tilesDebug = { render: render, bubbles: bubbles, stateOf: stateOf };
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
