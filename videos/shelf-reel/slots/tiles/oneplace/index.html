<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>
    <!-- design/ links to videos/shelf-reel/design: fonts + tokens + base components -->
    <link rel="stylesheet" href="./design/shelf.css" />
    <style>
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      .scene { position: absolute; inset: 0; }
      #world { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #tiles { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 3; }

      /* The S.H.E.L.F tile (same design as slots/tiles/problem): .tile from design/shelf.css.
         Its glass lives on an inner layer so it can melt into the panel when the stack docks. */
      .tile.tt { left: 0; top: 0; white-space: nowrap; visibility: hidden; background: none; border-color: transparent; box-shadow: none; }
      .tile.tt .glass {
        position: absolute;
        inset: -2px;
        pointer-events: none;
        border-radius: 30px;
        background: linear-gradient(160deg, rgba(40, 62, 104, 0.9), var(--navy-glass) 55%);
        border: 2px solid var(--navy-edge);
        box-shadow: 0 0 34px rgba(var(--glow), 0.28), 0 18px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }
      .tile.tt .glass::before {
        content: "";
        position: absolute;
        left: 3px;
        right: 3px;
        top: 3px;
        height: 46%;
        border-radius: 27px 27px 12px 12px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0));
      }
      .tile.tt svg, .tile.tt .label { position: relative; }
      .tile.tt .label {
        background: linear-gradient(180deg, #ffffff 0%, #eef3fa 46%, #b6c4d7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tile svg { fill: none; stroke: #eaf0f8; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .tile svg .ac { stroke: #6cb0ff; }
      .tile svg .acf { fill: #6cb0ff; stroke: none; }
      .tile svg .dot { fill: #eaf0f8; stroke: none; opacity: 0.62; }
      .tile svg .red { fill: #ff3b30; stroke: none; }
      .tile svg .cut { stroke: #142441; stroke-width: 2.6; }

      /* ONE glass panel: beside Kartik's head (his hair ends at x ~728), clear of the IG rail */
      .pbox { position: absolute; left: 736px; top: 466px; width: 280px; height: 592px; border-radius: 36px; }
      #aura {
        z-index: 1;
        pointer-events: none;
        opacity: 0;
        box-shadow: 0 0 46px 4px rgba(79, 157, 255, 0.55), 0 0 110px 18px rgba(79, 157, 255, 0.22);
      }
      #panel {
        z-index: 2;
        opacity: 0;
        overflow: hidden;
        background: linear-gradient(165deg, rgba(46, 72, 120, 0.95) 0%, rgba(15, 26, 50, 0.92) 44%, rgba(8, 15, 31, 0.94) 100%);
        border: 2px solid rgba(150, 195, 255, 0.45);
        box-shadow: 0 0 40px rgba(var(--glow), 0.32), 0 26px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      #panel::before {
        content: "";
        position: absolute;
        left: 3px;
        right: 3px;
        top: 3px;
        height: 34%;
        border-radius: 33px 33px 16px 16px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0));
      }
      #mark {
        position: absolute;
        left: 86px;
        top: 20px;
        width: 104px;
        height: 91px;
        filter: drop-shadow(0 0 14px rgba(120, 180, 255, 0.5));
      }
      #word {
        position: absolute;
        left: 0;
        top: 120px;
        width: 276px;
        text-align: center;
        font: 800 44px/1.1 var(--font-brand);
        letter-spacing: 0.03em;
        white-space: nowrap;
        filter: drop-shadow(0 0 14px rgba(var(--glow), 0.4));
      }
      #word .ch {
        display: inline-block;
        background: linear-gradient(180deg, #ffffff 0%, #e3eaf4 50%, #a9b8cd 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #rule {
        position: absolute;
        left: 24px;
        top: 184px;
        width: 228px;
        height: 2px;
        background: linear-gradient(90deg, rgba(190, 215, 255, 0), rgba(190, 215, 255, 0.75), rgba(190, 215, 255, 0));
      }
      .shelf-line {
        position: absolute;
        left: 16px;
        width: 244px;
        height: 1px;
        background: linear-gradient(90deg, rgba(170, 200, 245, 0), rgba(170, 200, 245, 0.22), rgba(170, 200, 245, 0));
      }
      #sheen { z-index: 4; overflow: hidden; pointer-events: none; }
      #band {
        position: absolute;
        top: -20%;
        left: 0;
        width: 46%;
        height: 140%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.08) 30%, rgba(255, 255, 255, 0.42) 50%, rgba(255, 255, 255, 0.08) 70%, rgba(255, 255, 255, 0) 100%);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="3.733" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="3.733" data-track-index="0">
        <div id="world">
        <div id="aura" class="pbox"></div>
        <div id="panel" class="pbox">
          <img id="mark" src="./design/shelf-mark.png" alt="" />
          <div id="word" data-layout-allow-occlusion><span class="ch" data-layout-allow-occlusion>S</span><span class="ch" data-layout-allow-occlusion>.</span><span class="ch" data-layout-allow-occlusion>H</span><span class="ch" data-layout-allow-occlusion>.</span><span class="ch" data-layout-allow-occlusion>E</span><span class="ch" data-layout-allow-occlusion>.</span><span class="ch" data-layout-allow-occlusion>L</span><span class="ch" data-layout-allow-occlusion>.</span><span class="ch" data-layout-allow-occlusion>F</span></div>
          <div id="rule"></div>
          <div id="shelves"></div>
        </div>
        <div id="tiles"></div>
        <div id="sheen" class="pbox"><div id="band" data-layout-allow-overflow></div></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        var DUR = 3.733; // window 89.000 -> 92.733 on the reel's output timeline (112 frames)

        /* ---------------- utilities ---------------- */
        function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function prog(t, t0, d) { return clamp((t - t0) / d, 0, 1); }
        function sstep(e0, e1, x) { var u = clamp((x - e0) / (e1 - e0), 0, 1); return u * u * (3 - 2 * u); }
        var P4O = gsap.parseEase("power4.out");
        var P3O = gsap.parseEase("power3.out");
        var P2O = gsap.parseEase("power2.out");
        var P3IO = gsap.parseEase("power3.inOut");
        var BO = gsap.parseEase("back.out(1.5)");
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(92192026);
        function rr(a, b) { return a + (b - a) * rnd(); }

        /* ---------------- cue sheet (composition seconds = output seconds - 89.000) ---------------- */
        var T = {
          agent: 0.56,   // "an agent": six tiles fly in from the edges
          keep: 1.71,    // "keep all of it": they line up into a vertical stack
          inOne: 2.57,   // "in one place": the stack snaps into ONE panel
          place: 3.19,   // "place": light sweep + glow, hold to the end
          cut: 3.7       // 92.700: the composite already shows the next shot here, so this frame stays empty
        };

        /* ---------------- the six tile types (same design as slots/tiles/problem) ---------------- */
        var ICON = {
          files: '<path d="M5 14.2a4 4 0 0 1 4-4h8.4a3 3 0 0 1 2.2 1l3 3.3h16.4a4 4 0 0 1 4 4V36a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M5 20.4h38"/><path class="ac" d="M11.5 30.5h10.5"/>',
          info: '<circle cx="24" cy="24" r="18"/><path d="M24 22.2v11.6"/><circle class="acf" cx="24" cy="15.4" r="2.4"/>',
          dead: '<rect x="6" y="9.5" width="36" height="32" rx="4.5"/><path d="M6 18.4h36M15.5 5.5v7.6M32.5 5.5v7.6"/><circle class="dot" cx="14" cy="26" r="1.7"/><circle class="dot" cx="24" cy="26" r="1.7"/><circle class="dot" cx="34" cy="26" r="1.7"/><circle class="dot" cx="14" cy="34" r="1.7"/><circle class="dot" cx="24" cy="34" r="1.7"/><rect class="red" x="29.2" y="29.2" width="9.6" height="9.6" rx="2.2"/>',
          rem: '<path d="M24 6.8c-6.3 0-10.6 4.8-10.6 10.9v7.3c0 1.6-.6 3.2-1.6 4.4l-2.2 2.7c-.8 1-.1 2.5 1.2 2.5h26.4c1.3 0 2-1.5 1.2-2.5l-2.2-2.7c-1-1.2-1.6-2.8-1.6-4.4v-7.3c0-6.1-4.3-10.9-10.6-10.9z"/><path d="M19.7 38.4a4.5 4.5 0 0 0 8.6 0"/><circle class="acf cut" cx="35.6" cy="10.4" r="4.6"/>',
          doc: '<path d="M13 5.5h15.6l9.4 9.4v25.6a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3v-32a3 3 0 0 1 3-3z"/><path d="M28.6 5.5v9.4H38"/><path class="ac" d="M16.2 23.6h9"/><path d="M16.2 29.6h15.6M16.2 35.6h15.6"/>',
          pers: '<rect x="4.5" y="10" width="39" height="28" rx="4.5"/><circle class="ac" cx="16" cy="20.8" r="4.3"/><path d="M9.6 31.6c1-3.5 3.5-5.3 6.4-5.3s5.4 1.8 6.4 5.3"/><path d="M27.6 19.4h10M27.6 25h10M27.6 30.6h6"/>'
        };
        var LABEL = { files: "Files", info: "Information", dead: "Deadlines", rem: "Reminders", doc: "Documents", pers: "Personal Info" };
        var BASEW = { files: 260, info: 471, dead: 397, rem: 409, doc: 436, pers: 508 }; // measured .tile widths at scale 1

        /* ---------------- choreography data ----------------
           from: off-frame entry point (every edge but the bottom: captions own it)
           land: loose constellation around his head (face stays clear)
           via:  control point of the curved path into the stack (over his hair or under his chin) */
        var S_LAND = 0.66, S_ROW = 0.55, ROW_LEFT = 735.6, ROW_Y0 = 698.25, ROW_PITCH = 63; // rows: icon at x 751, label ends <= 996
        var CAST = [
          { type: "files", from: [-190, 600], spin: -22, land: [200, 655], via: [520, 440], t0: 0.5 },
          { type: "info", from: [-200, 150], spin: -16, land: [300, 452], via: [580, 420], t0: 0.55 },
          { type: "dead", from: [690, -110], spin: 14, land: [652, 396], via: [810, 470], t0: 0.6 },
          { type: "rem", from: [1290, 470], spin: 20, land: [880, 590], via: [900, 760], t0: 0.53 },
          { type: "doc", from: [1300, 930], spin: 16, land: [868, 838], via: [905, 905], t0: 0.63 },
          { type: "pers", from: [-260, 1190], spin: -18, land: [236, 1070], via: [560, 1150], t0: 0.68 }
        ];
        var layer = document.getElementById("tiles");
        var shelves = document.getElementById("shelves");
        for (var sl = 1; sl < 6; sl++) {
          var line = document.createElement("div");
          line.className = "shelf-line";
          line.style.top = (ROW_Y0 + (sl - 0.5) * ROW_PITCH - 466 - 2).toFixed(1) + "px"; // panel top = 466, minus its border
          shelves.appendChild(line);
        }
        CAST.forEach(function (o, k) {
          var el = document.createElement("div");
          el.className = "tile tt";
          el.id = "tile-" + o.type;
          el.setAttribute("data-layout-allow-occlusion", "");
          el.setAttribute("data-layout-allow-overflow", ""); // they fly in from beyond the frame edges
          el.innerHTML = '<div class="glass"></div><svg viewBox="0 0 48 48" aria-hidden="true">' + ICON[o.type] + '</svg><div class="label" data-layout-allow-occlusion>' + LABEL[o.type] + "</div>";
          layer.appendChild(el);
          o.el = el;
          o.glass = el.querySelector(".glass");
          o.k = k;
          o.row = [ROW_LEFT + (BASEW[o.type] * S_ROW) / 2, ROW_Y0 + k * ROW_PITCH];
          o.landR = rr(-3.5, 3.5);
          o.bobP = rr(0, 6.283);
          o.bobW = rr(2.2, 3.0);
          o.st = T.keep + k * 0.055; // stack flight start (top row first)
        });

        /* ---------------- per-frame tile state ---------------- */
        function stateOf(o, t) {
          if (t < o.t0) return null;
          // 1) fly in from the edge (motion blur that resolves to sharp)
          var u = prog(t, o.t0, 0.46), p = P4O(u);
          var x = lerp(o.from[0], o.land[0], p), y = lerp(o.from[1], o.land[1], p);
          var s = lerp(0.95, S_LAND, P3O(u)) * (1 + 0.06 * Math.sin(Math.PI * sstep(0.45, 1, u)));
          var r = lerp(o.spin, o.landR, P3O(u));
          var b = 16 * (1 - sstep(0, 0.62, u));
          var a = clamp(u / 0.07, 0, 1);
          // 2) float while it lands ("agent", "that helps you")
          var fw = sstep(0.4, 1, u) * (1 - sstep(o.st - 0.1, o.st + 0.05, t));
          x += 4 * Math.sin(o.bobW * t + o.bobP) * fw;
          y += 5 * Math.cos(o.bobW * 0.8 * t + o.bobP) * fw;
          r += 1.2 * Math.sin(o.bobW * 0.6 * t + o.bobP) * fw;
          // 3) "keep all of it": curve into the stack, over his hair or under his chin
          var g = 1; // tile glass
          if (t >= o.st) {
            var v = prog(t, o.st, 0.44), q = P3IO(v);
            var sx = o.land[0], sy = o.land[1], m = 1 - q;
            x = m * m * sx + 2 * m * q * o.via[0] + q * q * o.row[0];
            y = m * m * sy + 2 * m * q * o.via[1] + q * q * o.row[1];
            s = lerp(S_LAND, S_ROW, P3O(v));
            r = lerp(o.landR, 0, P3O(v));
            b = 5 * Math.sin(Math.PI * v);
          }
          // 4) "in one place": the stack squeezes as the panel clamps on, then each tile's own glass melts
          var sq = sstep(T.inOne - 0.02, T.inOne + 0.08, t) * (1 - sstep(T.inOne + 0.1, T.inOne + 0.3, t));
          y = lerp(y, o.row[1] - (o.k - 2.5) * 4, sq);
          g = 1 - P2O(prog(t, T.inOne + 0.06, 0.24));
          return { x: x, y: y, s: s, r: r, b: b, a: a, g: g };
        }

        var world = document.getElementById("world");
        function render(t) {
          var gone = t >= T.cut - 0.005;
          world.style.opacity = gone ? "0" : "1";
          world.style.visibility = gone ? "hidden" : "visible";
          CAST.forEach(function (o) {
            var S = stateOf(o, t), el = o.el;
            if (!S || S.a <= 0.003) { el.style.visibility = "hidden"; return; }
            el.style.visibility = "visible";
            el.style.transform = "translate(-50%,-50%) translate(" + S.x.toFixed(2) + "px," + S.y.toFixed(2) + "px) rotate(" + S.r.toFixed(2) + "deg) scale(" + S.s.toFixed(4) + ")";
            el.style.opacity = S.a.toFixed(3);
            el.style.filter = S.b > 0.15 ? "blur(" + S.b.toFixed(2) + "px)" : "none";
            o.glass.style.opacity = S.g.toFixed(3);
          });
        }

        /* ---------------- one paused timeline ---------------- */
        var tl = gsap.timeline({ paused: true });
        // the tiles: a clock whose setter redraws (GSAP writes it on every render, events or not)
        var clockT = 0, clock = {};
        Object.defineProperty(clock, "t", { get: function () { return clockT; }, set: function (v) { clockT = v; render(v); } });
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", lazy: false, immediateRender: false }, 0);

        // the panel clamps around the stack (it grows up out of the rows; header on top)
        tl.fromTo("#panel", { scaleX: 0.95, scaleY: 0.66, transformOrigin: "50% 100%" },
          { scaleX: 1, scaleY: 1, duration: 0.42, ease: "back.out(1.4)" }, T.inOne + 0.04);
        tl.fromTo("#panel", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power2.out", immediateRender: false }, T.inOne + 0.04);
        tl.fromTo("#aura", { opacity: 0 }, { opacity: 0.35, duration: 0.3, ease: "power2.out" }, T.inOne + 0.06);
        tl.fromTo("#mark", { opacity: 0, y: -26, scale: 0.78 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(1.7)" }, T.inOne + 0.16);
        // wordmark tracks in: each glyph slides in from a wider spacing (transforms only)
        tl.fromTo("#word", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.46, ease: "expo.out" }, T.inOne + 0.24);
        tl.fromTo("#word .ch", { x: function (i) { return (i - 4) * 8; } }, { x: 0, duration: 0.5, ease: "expo.out" }, T.inOne + 0.24);
        tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, T.inOne + 0.32);
        tl.fromTo(".shelf-line", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.36, ease: "power3.out", stagger: 0.03 }, T.inOne + 0.2);

        // "place": one light sweep across the glass, then it glows and holds
        tl.fromTo("#band", { xPercent: -140, skewX: -16 }, { xPercent: 300, skewX: -16, duration: 0.4, ease: "power2.inOut" }, T.place);
        tl.fromTo("#aura", { opacity: 0.35 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, T.place + 0.06);
        tl.fromTo("#panel", { borderColor: "rgba(150, 195, 255, 0.45)" }, { borderColor: "rgba(205, 228, 255, 0.9)", duration: 0.24, ease: "power2.out", immediateRender: false }, T.place + 0.06);
        tl.fromTo("#mark", { scale: 1 }, { scale: 1.06, duration: 0.14, ease: "power2.out", immediateRender: false }, T.place + 0.08);
        tl.fromTo("#mark", { scale: 1.06 }, { scale: 1, duration: 0.26, ease: "power2.inOut", immediateRender: false }, T.place + 0.22);

        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
