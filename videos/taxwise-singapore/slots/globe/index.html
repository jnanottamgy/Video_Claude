<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="./vendor/gsap.min.js"></script>

    <!-- land dot matrix + India's official outline, generated by tools/build_geo.py (Natural Earth) -->

    <style>
      #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050a17; }
      .scene { position: absolute; inset: 0; }
      #cv, #fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #fx { visibility: hidden; }
      #labels, #titles { position: absolute; inset: 0; }

      /* city labels: zero-size anchors moved every frame from the globe projection; glass pills */
      .lab { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .lab .pill { position: absolute; top: -29px; right: 26px; height: 58px; display: flex; align-items: center;
        padding: 0 24px; border-radius: 29px; white-space: nowrap;
        background: linear-gradient(180deg, rgba(14, 27, 58, 0.8), rgba(6, 13, 32, 0.76));
        border: 1px solid rgba(212, 178, 106, 0.55);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 247, 222, 0.14);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      .lab .pill span { font-family: var(--tw-sans); font-weight: 700; font-size: 30px; line-height: 1;
        letter-spacing: 0.16em; margin-right: -0.16em; color: var(--tw-ivory); }
      .lab .lead { position: absolute; top: -1px; right: 9px; width: 17px; height: 2px; transform-origin: 100% 50%;
        background: linear-gradient(90deg, rgba(212, 178, 106, 0.6), rgba(243, 226, 174, 0.95)); }

      /* Singapore: bigger pill under the pin, NEW OFFICE tag under it */
      .lab.below .col { position: absolute; left: -300px; width: 600px; top: 10px; display: flex;
        flex-direction: column; align-items: center; }
      .lab.below .stem { width: 2px; height: 30px; transform-origin: 50% 0%;
        background: linear-gradient(180deg, rgba(243, 226, 174, 0.95), rgba(212, 178, 106, 0.4)); }
      .lab.below .pill { position: relative; top: 0; right: auto; height: 70px; padding: 0 30px; border-radius: 35px;
        border-color: rgba(232, 203, 134, 0.8); }
      .lab.below .pill span { font-size: 38px; letter-spacing: 0.18em; margin-right: -0.18em; }
      .tag { margin-top: 14px; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px 0 12px;
        border-radius: 23px; border: 1px solid rgba(212, 178, 106, 0.6);
        background: linear-gradient(180deg, rgba(40, 32, 14, 0.6), rgba(20, 16, 8, 0.6)); }
      .tag svg { width: 30px; height: 30px; display: block; }
      .tag b { font-family: var(--tw-sans); font-weight: 700; font-size: 28px; line-height: 1; letter-spacing: 0.24em;
        margin-right: -0.24em; background: var(--tw-gold-grad); -webkit-background-clip: text; background-clip: text;
        color: transparent; }

      /* closing titles */
      #t1 { position: absolute; left: 0; right: 0; top: 300px; height: 112px; display: flex; justify-content: center;
        align-items: center; gap: 26px; font-size: 92px; letter-spacing: 0.02em; }
      #t1 .m { display: block; overflow: hidden; padding: 8px 6px 12px; margin: -8px -6px -12px; }
      #t1 .r { display: block; }
      #t1 .x .r { width: 50px; height: 50px; margin-top: -8px; }
      #t1 .x svg { display: block; width: 50px; height: 50px; overflow: visible;
        filter: drop-shadow(0 0 10px rgba(232, 196, 120, 0.55)); }
      #t2 { position: absolute; left: 0; right: 0; top: 440px; height: 64px; display: flex; flex-direction: column;
        align-items: center; }
      #t2 .hl { width: 560px; height: 2px; }
      #t2 .tw { position: relative; margin-top: 18px; }
      #t2 .txt { position: relative; font-family: var(--tw-sans); font-weight: 600; font-size: 36px;
        line-height: 1; letter-spacing: 0.3em; margin-right: -0.3em; white-space: nowrap;
        background: var(--tw-gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 2px 0 rgba(60, 40, 10, 0.35)) drop-shadow(0 0 16px rgba(232, 196, 120, 0.25)); }
      #t2 .txt.sh { position: absolute; left: 0; top: 0; filter: none;
        background: linear-gradient(100deg, rgba(255, 250, 232, 0) 42%, rgba(255, 250, 232, 0.95) 50%, rgba(255, 250, 232, 0) 58%);
        background-size: 260% 100%; background-repeat: no-repeat; background-position: 140% 0;
        -webkit-background-clip: text; background-clip: text; }
      #t3 { position: absolute; left: 0; right: 0; top: 1442px; display: flex; justify-content: center; align-items: center;
        gap: 22px; font-family: var(--tw-sans); font-weight: 500; font-size: 28px; line-height: 1; letter-spacing: 0.3em;
        color: var(--tw-ivory-dim); }
      #t3 span { display: block; }
      #t3 .dot { color: var(--tw-gold); letter-spacing: 0; }
      #t3 span:last-child { margin-right: -0.3em; }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="10.1" data-width="1080" data-height="1920">
      <div id="scene" class="clip scene" data-start="0" data-duration="10.1" data-track-index="0">
        <div class="tw-ground"></div>
        <canvas id="cv" width="1080" height="1920" data-layout-allow-overflow></canvas>
        <div id="labels">
          <div id="lab-blr" class="lab"><div class="lead"></div><div class="pill"><span>BANGALORE</span></div></div>
          <div id="lab-chn" class="lab"><div class="pill"><span>CHENNAI</span></div></div>
          <div id="lab-sg" class="lab below">
            <div class="col">
              <div class="stem"></div>
              <div class="pill"><span>SINGAPORE</span></div>
              <div class="tag">
                <svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="#e8cb86" stroke-width="2" />
                  <path class="tick" d="M7.5 13.4 L11.4 17.2 L18.8 9.4" fill="none" stroke="#fbefc8" stroke-width="2.6"
                    stroke-linecap="round" stroke-linejoin="round" /></svg>
                <b>NEW OFFICE</b>
              </div>
            </div>
          </div>
        </div>
        <div id="titles">
          <div id="t1" class="tw-display">
            <span class="m"><span class="r" data-layout-allow-occlusion data-layout-allow-overflow>INDIA</span></span>
            <span class="m x"><span class="r" data-layout-allow-overflow><svg viewBox="0 0 50 50"><defs><linearGradient id="xg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fbefc8" /><stop offset="0.45" stop-color="#e8cb86" /><stop offset="1" stop-color="#b08a3e" /></linearGradient></defs>
              <path d="M7 7 L43 43 M43 7 L7 43" stroke="url(#xg)" stroke-width="4" stroke-linecap="round" fill="none" /></svg></span></span>
            <span class="m"><span class="r" data-layout-allow-occlusion data-layout-allow-overflow>SINGAPORE</span></span>
          </div>
          <div id="t2"><div class="hl tw-hairline"></div><div class="tw"><div class="txt" data-layout-allow-occlusion>CROSS-BORDER FINANCE</div><div class="txt sh" data-layout-ignore>CROSS-BORDER FINANCE</div></div></div>
          <div id="t3"><span data-layout-allow-occlusion>TAX</span><span class="dot" data-layout-allow-occlusion>&middot;</span><span data-layout-allow-occlusion>COMPLIANCE</span><span class="dot" data-layout-allow-occlusion>&middot;</span><span data-layout-allow-occlusion>ADVISORY</span></div>
        </div>
        <canvas id="fx" width="1080" height="1920"></canvas>
      </div>
    </div>
    <script>
      (function () {
        "use strict";
        // ================================================================== constants
        // window 25.470-35.570 output s; local t = output - 25.47; 303 frames
        var DUR = 10.1;
        var W = 1080, H = 1920, D2R = Math.PI / 180;
        var SHUTTER = 1 / 80;   // ~135-degree shutter: dots streak only in the fast moves
        var CITY = { blr: [77.59, 12.97], chn: [80.27, 13.08], sg: [103.82, 1.35] };
        // cue times (local)
        var T = {
          pinBlr: 2.05,   // 27.52 "India"
          pinChn: 2.17,   // 27.64
          launch: 2.93,   // 28.40 "helping"
          arrive: 4.45,   // 29.92 "Singapore's"
          cityOut: 5.15,  // BANGALORE / CHENNAI hand focus to Singapore as the push starts
          glow: 7.78,     // 33.25 "connections"
          sgOut: 8.0,
          charge: 9.45,   // 34.92 the Singapore pin charges
          pulse: 9.73,    // 35.20 pulse expands
          full: 10.03     // 35.50 frame filled
        };

        // ================================================================== helpers
        function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
        function lerp(a, b, k) { return a + (b - a) * k; }
        function sstep(a, b, v) { var k = clamp((v - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); }
        function seg(t, t0, t1, ease) { if (t <= t0) return 0; if (t >= t1) return 1; return ease((t - t0) / (t1 - t0)); }
        function hash(i) {
          var x = (i * 0x9e3779b1 + 0x7f4a7c15) | 0;
          x = Math.imul(x ^ (x >>> 16), 0x85ebca6b); x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35); x ^= x >>> 16;
          return (x >>> 0) / 4294967296;
        }
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        function bez(x1, y1, x2, y2) { // CSS cubic-bezier timing function
          var cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
          var cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
          function sx(u) { return ((ax * u + bx) * u + cx) * u; }
          function sy(u) { return ((ay * u + by) * u + cy) * u; }
          return function (x) {
            if (x <= 0) return 0; if (x >= 1) return 1;
            var lo = 0, hi = 1, u = x;
            for (var i = 0; i < 48; i++) { var v = sx(u); if (Math.abs(v - x) < 1e-7) break; if (v < x) lo = u; else hi = u; u = (lo + hi) / 2; }
            return sy(u);
          };
        }
        var E = {
          spin: bez(0.52, 0.0, 0.1, 1.0),
          zoom: bez(0.45, 0.0, 0.18, 1.0),
          reveal: bez(0.3, 0.45, 0.4, 1.0),
          comet: bez(0.42, 0.0, 0.3, 1.0),
          fast: bez(0.3, 0.0, 0.5, 1.0),
          back2: bez(0.28, 0.0, 0.12, 1.0),
          io2: gsap.parseEase("power2.inOut"),
          o2: gsap.parseEase("power2.out"),
          o3: gsap.parseEase("power3.out"),
          i2: gsap.parseEase("power2.in"),
          i3: gsap.parseEase("power3.in"),
          sio: gsap.parseEase("sine.inOut"),
          back: gsap.parseEase("back.out(2.4)")
        };
        function b64(s, Ty) {
          var bin = atob(s), u8 = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
          return new Ty(u8.buffer);
        }
        function vec(lon, lat) {
          var a = lon * D2R, b = lat * D2R, cb = Math.cos(b);
          return [cb * Math.cos(a), cb * Math.sin(a), Math.sin(b)];
        }

        // ================================================================== data
        var GD = window.GLOBE_DATA;
        var N = GD.n, LL = b64(GD.ll, Int16Array), COV = b64(GD.cov, Uint8Array), IND = b64(GD.ind, Uint8Array);
        var VX = new Float32Array(N), VY = new Float32Array(N), VZ = new Float32Array(N);
        var HS = new Float32Array(N), CF = new Float32Array(N);
        for (var i = 0; i < N; i++) {
          var v0 = vec(LL[2 * i] / 100, LL[2 * i + 1] / 100);
          VX[i] = v0[0]; VY[i] = v0[1]; VZ[i] = v0[2];
          HS[i] = hash(i); CF[i] = COV[i] / 255;
        }
        var IDX = [];
        for (i = 0; i < N; i++) if (IND[i]) IDX.push(i);

        // India, official outline: mainland as two LineStrings that run from the southern tip (Kanyakumari)
        // up both coasts to meet in the north, so the outline can trace itself; islands as closed rings
        var INDIA_FWD, INDIA_REV, INDIA_ISL = [];
        (function () {
          GD.india.forEach(function (flat, k) {
            var c = [];
            for (var j = 0; j < flat.length; j += 2) c.push([flat[j], flat[j + 1]]);
            if (k > 0) { c.push(c[0]); INDIA_ISL.push({ type: "LineString", coordinates: c }); return; }
            var s = 0;
            for (j = 1; j < c.length; j++) if (c[j][1] < c[s][1]) s = j;
            var ring = c.slice(s).concat(c.slice(0, s)), half = Math.floor(ring.length / 2);
            ring.push(ring[0]);
            INDIA_FWD = { type: "LineString", coordinates: ring.slice(0, half + 1) };
            INDIA_REV = { type: "LineString", coordinates: ring.slice(half).reverse() };
          });
        })();

        // graticule (15 deg) as unit-vector polylines; "major" = the 30 deg wireframe of the match cut
        var GRAT = [];
        (function () {
          var la, lo, k, pts;
          for (la = -75; la <= 75; la += 15) {
            pts = []; for (k = 0; k <= 120; k++) pts.push(vec(-180 + k * 3, la));
            GRAT.push({ pts: pts, major: la % 30 === 0 && Math.abs(la) <= 60, eq: la === 0 });
          }
          for (lo = -180; lo < 180; lo += 15) {
            pts = []; for (k = 0; k <= 60; k++) pts.push(vec(lo, -90 + k * 3));
            GRAT.push({ pts: pts, major: lo % 30 === 0 });
          }
        })();

        // ================================================================== camera (pure function of t)
        function camAt(t) {
          var a = seg(t, 0.10, 2.05, E.spin);   // Atlantic -> India, lands on "India" 27.52
          var z = seg(t, 0.12, 2.05, E.zoom);   // r 400 -> 560
          var b = seg(t, 2.62, 4.45, E.io2);    // east + tilt so India and Singapore share the frame; lands 29.92
          var c = seg(t, 5.24, 6.40, E.io2);    // the push: the picture scales about Singapore (30.71-31.87)
          var c2 = seg(t, 6.40, 8.20, E.sio);   // slow creep under the bridge
          var d = seg(t, 8.00, 9.05, E.back2);  // ease back as the titles land ("Across" 33.74)
          var d2 = seg(t, 9.05, 10.1, E.sio);
          // the match cut inherits the previous scene's sphere (tilt 18, meridian phase +3.6 deg, spinning 12 deg/s
          // the other way); that spin eases to a stop, a wind-up, before the eastward whip
          var lon = -33.6 - 12 * 0.12 * (1 - Math.exp(-t / 0.12)) + 114 * a + 11 * b + 0.4 * t;
          var lat = 18 - 38 * b, roll = -3 * b;
          var r = 400 + 160 * z + 150 * b, cx = 540, cy = 900 + 250 * b;
          var k = 1 + 0.38 * c + 0.06 * c2, ax = 697, ay = 904;   // Singapore's screen position after the landing
          r *= k; cx = ax + (cx - ax) * k; cy = ay + (cy - ay) * k;
          // closing framing: the whole India-Singapore story on one globe under the titles
          lon = lerp(lon, 86.55 + 0.4 * t, d); lat = lerp(lat, -16, d); roll = lerp(roll, 0, d);
          r = lerp(r, 430 - 8 * d2, d); cx = lerp(cx, 540, d); cy = lerp(cy, 980, d);
          var pk = 1 + punch(t, T.arrive, 0.022) + punch(t, T.glow, 0.013);   // impact punches on 29.92 and 33.25
          return { lon: lon, lat: lat, roll: roll, r: r * pk, cx: cx, cy: cy };
        }
        function punch(t, t0, amp) { // a fast push-in on a hit that decays over ~0.4 s
          var u = t - t0;
          if (u < -0.02 || u > 0.7) return 0;
          return amp * seg(u, -0.02, 0.04, E.o2) * Math.exp(-Math.max(0, u - 0.04) / 0.15);
        }
        // d3.geoRotation([-lon, -lat, roll]) as a 3x3 matrix; rows = depth, screen-right, screen-up
        function rotM(cm) {
          var a = -cm.lon * D2R, b = -cm.lat * D2R, g = cm.roll * D2R;
          var ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b), cg = Math.cos(g), sg = Math.sin(g);
          return [ca * cb, -sa * cb, -sb,
            sa * cg - ca * sb * sg, ca * cg + sa * sb * sg, -cb * sg,
            sa * sg + ca * sb * cg, ca * sg - sa * sb * cg, cb * cg];
        }
        // project a unit vector lifted to (1 + alt) radii: [x, y, depth, visible]
        function proj(m, cm, v, alt) {
          var k = 1 + (alt || 0);
          var d = (m[0] * v[0] + m[1] * v[1] + m[2] * v[2]) * k;
          var rx = (m[3] * v[0] + m[4] * v[1] + m[5] * v[2]) * k;
          var uy = (m[6] * v[0] + m[7] * v[1] + m[8] * v[2]) * k;
          var vis = d >= 0 || rx * rx + uy * uy > 1;   // occluded only when behind the globe AND inside its disc
          return [cm.cx + cm.r * rx, cm.cy - cm.r * uy, d, vis];
        }
        // the d3 orthographic projection, kept in step with the camera (pins, India outline)
        var PJ = d3.geoOrthographic().clipAngle(90).precision(0.3);
        function setPJ(cm) { PJ.scale(cm.r).translate([cm.cx, cm.cy]).rotate([-cm.lon, -cm.lat, cm.roll]); }

        // ================================================================== arcs (d3.geoInterpolate great circles)
        var NS = 140;
        function makeArc(from, to, h, t0, t1, ease, width) {
          var gi = d3.geoInterpolate(CITY[from], CITY[to]), pts = [], alt = [];
          for (var k = 0; k <= NS; k++) {
            var s = k / NS, ll = gi(s);
            pts.push(vec(ll[0], ll[1]));
            alt.push(h * Math.pow(Math.sin(Math.PI * s), 0.9));
          }
          return { pts: pts, alt: alt, t0: t0, t1: t1, ease: ease, w: width };
        }
        var ARCS = [
          makeArc("blr", "sg", 0.30, 2.93, 4.45, E.comet, 1.2),    // hero: launches 28.40, lands 29.92
          makeArc("chn", "sg", 0.16, 3.01, 4.45, E.comet, 1.0),    // its twin from Chennai, same landing
          makeArc("sg", "blr", 0.42, 6.53, 7.03, E.io2, 0.9),      // bridge: 32.00 -> 32.50
          makeArc("chn", "sg", 0.07, 7.03, 7.53, E.io2, 0.85),     // 32.50 -> 33.00
          makeArc("sg", "chn", 0.23, 7.03, 7.53, E.io2, 0.85),     // 32.50 -> 33.00
          makeArc("blr", "sg", 0.36, 7.53, 7.78, E.fast, 0.9)      // 33.00 -> 33.25 "connections"
        ];

        // particles of light rising off the hero arcs ("financial landscape" 30.72-31.60)
        var PARTS = [];
        (function () {
          var rnd = mulberry32(20261031);
          for (var k = 0; k < 130; k++) {
            PARTS.push({ arc: k % 3 === 2 ? 1 : 0, s: 0.05 + 0.9 * rnd(), ts: 5.0 + 2.0 * rnd(), life: 0.8 + 0.9 * rnd(),
              rise: 60 + 150 * rnd(), dx: (rnd() - 0.5) * 34, size: 1.0 + 1.8 * rnd(), ph: rnd() * 6.283 });
          }
        })();
        // fine gold dust in the background
        var DUST = [];
        (function () {
          var rnd = mulberry32(777);
          for (var k = 0; k < 70; k++) {
            DUST.push({ x: rnd() * W, y: rnd() * H, vx: (rnd() - 0.3) * 6, vy: -4 - rnd() * 10, z: 0.3 + rnd() * 0.7,
              s: 0.7 + rnd() * 1.4, a: 0.1 + rnd() * 0.28, f: 0.3 + rnd() * 0.8, ph: rnd() * 6.283 });
          }
        })();

        // ================================================================== canvases, sprites, colour ramp
        var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
        var fx = document.getElementById("fx"), fctx = fx.getContext("2d");
        var pathCv = d3.geoPath(PJ, ctx), pathLen = d3.geoPath(PJ);
        function sprite(size, stops) {
          var c = document.createElement("canvas"); c.width = c.height = size;
          var g = c.getContext("2d"), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
          stops.forEach(function (s) { gr.addColorStop(s[0], s[1]); });
          g.fillStyle = gr; g.fillRect(0, 0, size, size);
          return c;
        }
        var GLOW = sprite(256, [[0, "rgba(255,252,240,1)"], [0.08, "rgba(255,244,214,0.95)"], [0.22, "rgba(246,220,160,0.5)"],
          [0.5, "rgba(222,186,110,0.14)"], [1, "rgba(212,178,106,0)"]]);
        var SOFT = sprite(128, [[0, "rgba(243,226,174,0.9)"], [0.4, "rgba(232,196,120,0.35)"], [1, "rgba(212,178,106,0)"]]);

        // dot colours: champagne gold, brighter toward the light (14 steps so there is no banding)
        var NB = 14, NZ = 4, RAMP = [];
        (function () {
          var st = [[0, 136, 104, 46, 0.26], [0.35, 194, 158, 88, 0.55], [0.62, 222, 190, 120, 0.78],
            [0.82, 240, 216, 158, 0.9], [1, 255, 243, 212, 1]];
          for (var b = 0; b < NB; b++) {
            var u = b / (NB - 1), j = 0;
            while (j < st.length - 2 && u > st[j + 1][0]) j++;
            var k = (u - st[j][0]) / (st[j + 1][0] - st[j][0]), c = [];
            for (var q = 1; q < 5; q++) c.push(lerp(st[j][q], st[j + 1][q], k));
            RAMP.push("rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + c[3].toFixed(3) + ")");
          }
        })();
        var SZ = [0.55, 0.7, 0.85, 1.0];
        var VB = { x0: new Float32Array(N), y0: new Float32Array(N), x1: new Float32Array(N), y1: new Float32Array(N), k: new Uint8Array(N) };

            var pn = PINS[q], ll = CITY[pn.id];
            var xy = PJ(ll), dep = proj(m, cm, vec(ll[0], ll[1]), 0)[2];
            pinPos[pn.id] = [xy[0], xy[1], dep];
            pinPos[pn.id + "_head"] = [xy[0], xy[1] - pn.h * hz * 0.66];
            if (t < pn.t0 - 0.02 || dep < 0) continue;
            var u = clamp((t - pn.t0) / 0.42, 0, 1), sc = E.back(u);
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            // surface rings: the pop, a few gentle pings, and the shared flare on "connections"
            var age = t - pn.t0, maxR = pn.big ? 10 : 4.2;
            if (age < 1.1) {
              var e = E.o3(clamp(age / 1.1, 0, 1));
              surfRing(m, cm, ll, 0.2 + maxR * e, (1 - e) * 0.95, pn.big ? 3 : 2);
              if (pn.big && age > 0.12) { var e2 = E.o2(clamp((age - 0.12) / 1.3, 0, 1)); surfRing(m, cm, ll, 0.2 + 16 * e2, (1 - e2) * 0.6, 1.6); }
            }
            for (var n = 0; n < 4; n++) {
              var pa = (t - (pn.t0 + 1.25 + n * 1.5)) / 1.2;
              if (pa > 0 && pa < 1 && t < 8.1) surfRing(m, cm, ll, 0.2 + (pn.big ? 4.5 : 2.6) * E.o2(pa), (1 - pa) * 0.45, 1.4);
            }
            if (t > T.glow && t < T.glow + 1.0) {
              var gaa = (t - T.glow) / 1.0; surfRing(m, cm, ll, 0.2 + (pn.big ? 6 : 3.5) * E.o3(gaa), (1 - gaa) * 0.9, 2);
            }
            ctx.restore();
            // the pin, scaled from its tip; the Singapore pin drops in
            var h = pn.h * hz * sc, drop = pn.big ? (1 - E.o3(u)) * -26 : 0;
            if (h > 0.5) {
              var glow = pn.big ? clamp(G + seg(t, T.arrive, T.arrive + 0.1, E.o2) * (1 - seg(t, T.arrive + 0.15, T.arrive + 0.95, E.o2)), 0, 1) : G;
              drawPin(xy[0], xy[1] + drop, h, pn.big, glow);
            }
          }
          // arrival flash on Singapore (29.92)
          var fa = t - T.arrive;
          if (fa > -0.02 && fa < 0.6) {
            var k = clamp(fa / 0.6, 0, 1), s = 80 + 280 * E.o3(k);
            ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = (1 - k) * 0.85;
            ctx.drawImage(GLOW, pinPos.sg[0] - s / 2, pinPos.sg[1] - s / 2, s, s); ctx.restore();
          }
          // bloom over the bridge on "connections"
          if (G > 0.01) {
            var mx = (pinPos.sg[0] + pinPos.blr[0]) / 2, my = (pinPos.sg[1] + pinPos.blr[1]) / 2 - 60;
            var span = Math.hypot(pinPos.sg[0] - pinPos.blr[0], pinPos.sg[1] - pinPos.blr[1]) * 1.7;
            ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.3 * G;
            ctx.drawImage(SOFT, mx - span / 2, my - span * 0.32, span, span * 0.64); ctx.restore();
          }
          // CHENNAI's elbow leader (its pill sits under BANGALORE's, left of the pins)
          var la = seg(t, T.pinChn + 0.02, T.pinChn + 0.36, E.o3), lo = 1 - seg(t, T.cityOut, T.cityOut + 0.3, E.i2);
          if (la > 0 && lo > 0) {
            var c0 = pinPos.chn, hb = pinPos.blr_head, yb = hb[1] + 68, xe = hb[0] - 26;
            var seg1 = yb - (c0[1] + 5), seg2 = c0[0] - xe, tot = seg1 + seg2;
            ctx.save();
            ctx.globalAlpha = 0.9 * lo;
            ctx.strokeStyle = "rgba(236,208,146,1)"; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.setLineDash([tot * la + 0.01, tot * 2]);
            ctx.beginPath(); ctx.moveTo(c0[0], c0[1] + 5); ctx.lineTo(c0[0], yb); ctx.lineTo(xe, yb); ctx.stroke();
            ctx.restore();
          }
        }

        var LAB = { blr: document.getElementById("lab-blr"), chn: document.getElementById("lab-chn"), sg: document.getElementById("lab-sg") };
        function placeLabels() {
          var hb = pinPos.blr_head, s = pinPos.sg;
          LAB.blr.style.transform = "translate(" + hb[0].toFixed(2) + "px," + hb[1].toFixed(2) + "px)";
          LAB.chn.style.transform = "translate(" + hb[0].toFixed(2) + "px," + (hb[1] + 68).toFixed(2) + "px)";
          LAB.sg.style.transform = "translate(" + s[0].toFixed(2) + "px," + s[1].toFixed(2) + "px)";
        }

        function drawFx(t) {
          fctx.clearRect(0, 0, W, H);
          if (t < T.charge) return;
          var x = pinPos.sg[0], y = pinPos.sg[1] - 16;
          // charge from 34.92 (into the 35.00 beat): the Singapore pin swells with light, an anamorphic streak opens
          var ch = seg(t, T.charge, T.pulse + 0.02, E.i2), out = seg(t, T.pulse + 0.05, T.full, E.o2);
          fctx.save();
          fctx.globalCompositeOperation = "lighter";
          fctx.globalAlpha = 0.85 * ch * (1 - 0.6 * out);
          var sw = 140 + 900 * ch, sh = 14 + 16 * ch;
          fctx.drawImage(GLOW, x - sw / 2, y - sh / 2, sw, sh);
          var s0 = 60 + 170 * ch;
          fctx.drawImage(GLOW, x - s0 / 2, y - s0 / 2, s0, s0);
          fctx.restore();
          if (t < T.pulse) return;
          // the pulse: a luminous gold field that expands from Singapore and fills the frame by 35.50
          var k = seg(t, T.pulse, T.full, E.i3), far = 0;
          [[0, 0], [W, 0], [0, H], [W, H]].forEach(function (c) { far = Math.max(far, Math.hypot(c[0] - x, c[1] - y)); });
          var r = 36 + (far + 260) * k, A = 0.85;
          var g = fctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, "rgba(255,250,236," + Math.min(0.95, A + 0.08) + ")");
          g.addColorStop(0.35, "rgba(250,232,186," + A + ")");
          g.addColorStop(0.78, "rgba(234,200,128," + A + ")");
          g.addColorStop(0.92, "rgba(252,236,192," + A + ")");
          g.addColorStop(1, "rgba(236,204,140,0)");
          fctx.fillStyle = g;
          fctx.beginPath(); fctx.arc(x, y, r, 0, 6.2832); fctx.fill();
        }

        function draw(t) {
          t = clamp(t, 0, DUR);
          var cm = camAt(t), cp = camAt(Math.max(0, t - SHUTTER));
          var m = rotM(cm), mp = rotM(cp);
          setPJ(cm);
          pinPos = {};
          ctx.clearRect(0, 0, W, H);
          drawDust(t, cm);
          drawSphereBase(cm, t);
          drawLines(m, cm, t);
          var dotD = drawDots(m, mp, cm, cp, t);
          drawIndia(m, cm, t, dotD);
          drawSphereTop(cm, t);
          drawArcs(m, cm, t);
          drawParticles(m, cm, t);
          drawPins(m, cm, t);
          placeLabels();
          drawFx(t);
        }
        window.__globeDraw = draw;

        // ================================================================== timeline
        var tl = gsap.timeline({ paused: true });
        var clock = { t: 0 };
        // one linear tween drives every canvas frame from the timeline time
        tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { draw(clock.t); } }, 0);

        // BANGALORE on "India" (27.52), CHENNAI 0.12 s later; both hand off as the push starts (30.62)
        tl.fromTo("#lab-blr .lead", { scaleX: 0 }, { scaleX: 1, duration: 0.26, ease: "expo.out" }, T.pinBlr + 0.02);
        [["#lab-blr", T.pinBlr + 0.06], ["#lab-chn", T.pinChn + 0.16]].forEach(function (L) {
          tl.fromTo(L[0] + " .pill", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.26, ease: "power2.out" }, L[1]);
          tl.fromTo(L[0] + " .pill", { x: 30, scale: 0.86 }, { x: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, L[1]);
        });
        tl.to("#lab-blr .pill, #lab-chn .pill, #lab-blr .lead", { opacity: 0, x: -24, duration: 0.3, ease: "power2.in", immediateRender: false }, T.cityOut);
        // SINGAPORE + NEW OFFICE on the arrival (29.92)
        tl.fromTo("#lab-sg .stem", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "expo.out" }, T.arrive + 0.02);
        tl.fromTo("#lab-sg .pill", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "power2.out" }, T.arrive + 0.07);
        tl.fromTo("#lab-sg .pill", { y: -18, scale: 0.8 }, { y: 0, scale: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, T.arrive + 0.07);
        tl.fromTo("#lab-sg .tag", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, T.arrive + 0.27);
        tl.fromTo("#lab-sg .tick", { strokeDasharray: 18, strokeDashoffset: 18 }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, T.arrive + 0.41);
        tl.to("#lab-sg .col", { opacity: 0, duration: 0.3, ease: "power2.in" }, T.sgOut);

        // INDIA x SINGAPORE lands on "Across" (33.74)
        tl.fromTo("#t1 .r", { yPercent: 115, filter: "blur(10px)" },
          { yPercent: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out", stagger: 0.05 }, 8.21);
        tl.fromTo("#t1 .x svg", { rotation: -135, scale: 0.3 }, { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.2)" }, 8.27);
        // CROSS-BORDER FINANCE on "borders" (34.38), a light sweep across it at 34.59
        tl.fromTo("#t2 .hl", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 8.86);
        tl.fromTo("#t2 .tw", { opacity: 0, clipPath: "inset(-30% 50% -30% 50%)", filter: "blur(8px)" },
          { opacity: 1, clipPath: "inset(-30% 0% -30% 0%)", filter: "blur(0px)", duration: 0.62, ease: "expo.out" }, 8.88);
        tl.fromTo("#t2 .sh", { backgroundPosition: "140% 0%" }, { backgroundPosition: "-40% 0%", duration: 0.6, ease: "power2.inOut", immediateRender: false }, 9.12);
        // TAX . COMPLIANCE . ADVISORY on 34.60
        tl.fromTo("#t3 span", { opacity: 0, y: 14, filter: "blur(6px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", stagger: 0.02 }, 9.08);
        // the overlay canvas only exists for the closing pulse
        tl.set("#fx", { visibility: "visible" }, T.charge - 0.01);

        window.__timelines["main"] = tl;
        draw(0);
        tl.seek(0);
      })();
    </script>
  </body>
</html>
