    <script>
      (function () {
        "use strict";
        /* ======================================================================
           team_services (full) - output window 14.220 to 25.470, 337 frames.
           Local t = output time - 14.22. Every frame is a pure function of t:
           render(t) is driven by one proxy tween; GSAP tweens own the type,
           the mark and the card details. No randomness except mulberry32.
           ====================================================================== */
        var W = 1080, H = 1920;
        var DUR = 11.2333; // 337 frames at 30 fps (frame N = 14.22 + (N-1)/30)
        var Q = {
          BURST: 0.28, LOCK: 1.24, LAND: 2.12, SHEEN: 2.28, HAIR: 2.52, SUB: 2.60, RIPPLE: 3.16,
          SWIRL: 3.96, CONDENSE: 4.52, EXPERT: 5.00, PORTS: 5.96, HUBPULSE: 6.28,
          LIFT: 10.28, LIFT_ARRIVE: 10.56, FOLD: 10.78
        };
        var HUB = { x: 540, y: 820 };
        var SPH = { cx: 540, cy: 900, R: 400, tilt: 18 * Math.PI / 180, spinRate: 12 * Math.PI / 180 };

        /* ---------- deterministic helpers ---------- */
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            var t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        var rnd = mulberry32(0x7a5c0de);
        function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function seg(t, a, b) { return c01((t - a) / (b - a)); }
        function sstep(a, b, x) { var u = c01((x - a) / (b - a)); return u * u * (3 - 2 * u); }
        var EZ = {
          expoOut: function (p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); },
          p2o: function (p) { return 1 - (1 - p) * (1 - p); },
          p3o: function (p) { return 1 - Math.pow(1 - p, 3); },
          p4o: function (p) { return 1 - Math.pow(1 - p, 4); },
          p2i: function (p) { return p * p; },
          p3i: function (p) { return p * p * p; },
          p2io: function (p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; },
          p3io: function (p) { return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; },
          sio: function (p) { return -(Math.cos(Math.PI * p) - 1) / 2; },
          backOut: function (p, s) { s = s || 1.70158; var c3 = s + 1; return 1 + c3 * Math.pow(p - 1, 3) + s * Math.pow(p - 1, 2); }
        };
        // attack-decay envelope: linear rise over att, exponential decay with time constant dec
        function env(t, t0, att, dec) {
          if (t < t0) return 0;
          if (t < t0 + att) return (t - t0) / att;
          return Math.exp(-(t - t0 - att) / dec);
        }
        function wrapPi(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a <= -Math.PI) a += 2 * Math.PI; return a; }

        /* ---------- canvas + glow sprite ---------- */
        var cv = document.getElementById("fx");
        var ctx = cv.getContext("2d");
        var spr = document.createElement("canvas");
        spr.width = spr.height = 128;
        (function () {
          var g = spr.getContext("2d");
          var rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
          rg.addColorStop(0, "rgba(255,246,222,1)");
          rg.addColorStop(0.16, "rgba(248,226,168,0.8)");
          rg.addColorStop(0.42, "rgba(232,196,120,0.24)");
          rg.addColorStop(1, "rgba(232,196,120,0)");
          g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
        })();
        function glow(x, y, r, a) {
          if (a <= 0.003 || r <= 0.5) return;
          ctx.globalAlpha = a > 1 ? 1 : a;
          ctx.drawImage(spr, x - r, y - r, 2 * r, 2 * r);
        }
        function radial(x, y, r, stops, alpha) {
          if (alpha <= 0.003) return;
          var g = ctx.createRadialGradient(x, y, 0, x, y, r);
          for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
          ctx.globalAlpha = alpha > 1 ? 1 : alpha;
          ctx.fillStyle = g;
          ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
        }
        var GOLD = "rgb(226,192,118)", GOLD_HI = "rgb(246,228,178)", IVORY = "rgb(244,239,227)";
        // a thin anamorphic streak of light through an impact point (lens-like, used on the four big hits)
        function flare(x, y, len, a) {
          if (a <= 0.004) return;
          ctx.globalAlpha = Math.min(1, a * 0.55);
          ctx.drawImage(spr, x - len, y - 16, 2 * len, 32);
          var g = ctx.createLinearGradient(x - len, 0, x + len, 0);
          g.addColorStop(0, "rgba(255,236,190,0)"); g.addColorStop(0.5, "rgba(255,247,226,1)"); g.addColorStop(1, "rgba(255,236,190,0)");
          ctx.fillStyle = g; ctx.globalAlpha = Math.min(1, a);
          ctx.fillRect(x - len, y - 1.1, 2 * len, 2.2);
        }

        /* ---------- dust (fine gold motes drifting in light) ---------- */
        var dust = [];
        for (var i = 0; i < 64; i++) {
          dust.push({ x: rnd() * W, y: rnd() * H, vy: 6 + rnd() * 16, amp: 4 + rnd() * 10, per: 3 + rnd() * 4,
            ph: rnd() * 6.283, s: 0.7 + rnd() * 1.7, a: 0.08 + rnd() * 0.26, tw: 1.2 + rnd() * 2.2 });
        }
        function drawDust(t) {
          var fade = sstep(0.0, 0.6, t) * (1 - sstep(10.86, 11.1, t));
          if (fade <= 0) return;
          ctx.globalCompositeOperation = "lighter";
          for (var i = 0; i < dust.length; i++) {
            var d = dust[i];
            var y = ((d.y - d.vy * t) % H + H) % H;
            var x = d.x + d.amp * Math.sin(t * 6.283 / d.per + d.ph);
            var a = d.a * (0.6 + 0.4 * Math.sin(t * d.tw + d.ph * 3)) * fade;
            glow(x, y, d.s * 4.2, a);
          }
          ctx.globalCompositeOperation = "source-over";
        }

        /* ---------- Act 1: the team formation ---------- */
        var FC = { x: 540, y: 830 };
        var ROWS = [6, 5, 6, 5, 6, 5], DX = 108, DY = 96;
        var icons = [];
        ROWS.forEach(function (n, r) {
          for (var c = 0; c < n; c++) {
            icons.push({ x: FC.x + (c - (n - 1) / 2) * DX, y: FC.y + (r - (ROWS.length - 1) / 2) * DY });
          }
        });
        var rMaxF = 0;
        icons.forEach(function (ic) { ic.rF = Math.hypot(ic.x - FC.x, ic.y - FC.y); rMaxF = Math.max(rMaxF, ic.rF); });
        icons.forEach(function (ic, k) {
          ic.drawAt = 0.70 + 0.30 * (ic.rF / rMaxF);       // outlines trace from the centre outward
          ic.dCtr = Math.hypot(ic.x - 540, ic.y - 790);    // distance from the counter (ripple)
          ic.ph = rnd() * 6.283;
        });
        // icon geometry (local px): head circle + two shoulder halves drawn from the top centre
        var HEAD_Y = -15, HEAD_R = 11;
        var SH = [[0, 1], [13, 1], [23, 9], [23, 27]];
        function bez(p0, p1, p2, p3, u) {
          var v = 1 - u;
          return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0],
                  v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]];
        }
        var SH_PTS = [];
        for (var j = 0; j <= 14; j++) SH_PTS.push(bez(SH[0], SH[1], SH[2], SH[3], j / 14));
        function strokePartial(pts, prog, ox, oy, sx, sc) {
          // stroke the first `prog` fraction of a polyline (by point count; segments are near-uniform)
          if (prog <= 0) return;
          var n = pts.length - 1, upto = prog * n, k = Math.floor(upto);
          ctx.beginPath();
          ctx.moveTo(ox + pts[0][0] * sx * sc, oy + pts[0][1] * sc);
          for (var q = 1; q <= k && q <= n; q++) ctx.lineTo(ox + pts[q][0] * sx * sc, oy + pts[q][1] * sc);
          if (k < n) {
            var f = upto - k;
            ctx.lineTo(ox + lerp(pts[k][0], pts[k + 1][0], f) * sx * sc, oy + lerp(pts[k][1], pts[k + 1][1], f) * sc);
          }
          ctx.stroke();
        }
        function drawPerson(x, y, sc, headP, shP, shA) {
          if (headP > 0) {
            ctx.beginPath();
            ctx.arc(x, y + HEAD_Y * sc, HEAD_R * sc, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * headP);
            ctx.stroke();
          }
          if (shP > 0 && shA > 0) {
            var a0 = ctx.globalAlpha;
            ctx.globalAlpha = a0 * shA;
            strokePartial(SH_PTS, shP, x, y, 1, sc);
            strokePartial(SH_PTS, shP, x, y, -1, sc);
            ctx.globalAlpha = a0;
          }
        }

        // stream-in particles: 8 per person, burst from the centre on the 14.50 downbeat

          var pc = seg(t, Q.CONDENSE, Q.CONDENSE + 0.6);
          if (pc > 0 && pc < 1) ring(hc[0], hc[1], lerp(130, 470, EZ.expoOut(pc)), lerp(3, 1, pc), 0.7 * (1 - pc), GOLD_HI);
          var ph = seg(t, Q.HUBPULSE, Q.HUBPULSE + 0.55);
          if (ph > 0 && ph < 1) ring(hc[0], hc[1], lerp(150, 330, EZ.expoOut(ph)), 1.6, 0.55 * (1 - ph), GOLD_HI);
          var pl = seg(t, Q.LIFT, Q.LIFT + 0.75);
          if (pl > 0 && pl < 1) ring(hc[0], hc[1], lerp(160, 760, EZ.expoOut(pl)), lerp(4, 1, pl), 0.75 * (1 - pl), GOLD_HI);
          var pl2 = seg(t, Q.LIFT + 0.1, Q.LIFT + 0.85);
          if (pl2 > 0 && pl2 < 1) ring(hc[0], hc[1], lerp(160, 620, EZ.expoOut(pl2)), 1.3, 0.45 * (1 - pl2), GOLD);
          ctx.globalCompositeOperation = "source-over";

          // connectors
          var liftGlow = env(t, Q.LIFT, 0.06, 0.55) + 0.35 * sstep(Q.LIFT, Q.LIFT + 0.3, t);
          ctx.shadowColor = "rgba(232,196,120,0.65)";
          CARDS.forEach(function (c, k) {
            if (t < c.word) return;
            var u = cardFly(c, t);
            var pts = connectorScreenPts(c, t, u);
            var lg = Math.min(1, liftGlow) * (1 - sstep(Q.FOLD, Q.FOLD + 0.2, t));
            var mm = morphAt(t);
            var aConn = lerp(0.78 + 0.22 * lg, 0.85, mm);
            var wConn = lerp(2.0 + 0.8 * lg, 1.8, mm);
            var cg = Math.round(lerp(192, 226, lg)), cr = Math.round(lerp(226, 246, lg)), cb = Math.round(lerp(118, 170, lg));
            strokeRuns(pts, wConn, aConn, 0.16, "rgb(" + cr + "," + cg + "," + cb + ")", true);
            ctx.globalCompositeOperation = "lighter";
            // comet head while the card flies
            var fl = seg(t, c.word, c.word + 0.5);
            if (fl < 1) { var hd = pts[pts.length - 1]; glow(hd[0], hd[1], 26, 0.9 * (1 - fl)); }
            // landing tick of light where the line meets the card
            var tk = env(t, c.word + 0.24, 0.03, 0.13);
            if (tk > 0.01 && foldGone < 1) {
              var a3 = N2S(c.p3[0], c.p3[1]);
              glow(a3[0], a3[1], 30 + 20 * tk, 0.9 * tk);
              ctx.globalAlpha = 0.85 * tk; ctx.strokeStyle = "rgb(255,246,222)"; ctx.lineWidth = 1.6;
              var L = 34 * tk + 8;
              ctx.beginPath(); ctx.moveTo(a3[0] - L, a3[1]); ctx.lineTo(a3[0] + L, a3[1]);
              ctx.moveTo(a3[0], a3[1] - L * 0.6); ctx.lineTo(a3[0], a3[1] + L * 0.6); ctx.stroke();
            }
            // the lift: a pulse of light races out along every line
            var pp = seg(t, Q.LIFT, Q.LIFT_ARRIVE);
            if (pp > 0 && pp < 1 && t < Q.FOLD) {
              var uu = EZ.p2i(pp);
              for (var q = 0; q < 7; q++) {
                var uq = uu - q * 0.035;
                if (uq < 0) break;
                var pq = polyAt(c.pts, uq), sq = N2S(pq[0], pq[1]);
                glow(sq[0], sq[1], 24 - q * 2.4, (0.95 - q * 0.13) * (1 - sstep(0.85, 1, pp) * 0.4));
              }
            }
            var arr = env(t, Q.LIFT_ARRIVE, 0.02, 0.18) * (1 - foldGone);
            if (arr > 0.01) { var a4 = N2S(c.p3[0], c.p3[1]); glow(a4[0], a4[1], 40, 0.85 * arr); }
            ctx.globalCompositeOperation = "source-over";
          });
          ctx.shadowBlur = 0;

          // ports: five sockets light up around the hub on "across"
          ctx.globalCompositeOperation = "lighter";
          CARDS.forEach(function (c, k) {
            var tp = Q.PORTS + 0.05 * k;
            if (t < tp) return;
            var pp2 = seg(t, tp, tp + 0.35);
            var sP = N2S(c.p0[0], c.p0[1]);
            var a5 = (1 - foldGone) * (t < c.word ? 1 : 1);
            ctx.globalAlpha = a5; ctx.fillStyle = GOLD_HI;
            ctx.beginPath(); ctx.arc(sP[0], sP[1], 3.4 * EZ.backOut(pp2, 2.4), 0, 6.2832); ctx.fill();
            var pr2 = seg(t, tp, tp + 0.45);
            if (pr2 > 0 && pr2 < 1) ring(sP[0], sP[1], lerp(4, 20, EZ.expoOut(pr2)), 1.3, 0.8 * (1 - pr2) * a5, GOLD_HI);
            glow(sP[0], sP[1], 14 + 10 * env(t, tp, 0.03, 0.15), (0.5 + 0.5 * env(t, tp, 0.03, 0.15)) * a5);
          });
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = 1;
        }

        /* ---------- DOM state driven from t ---------- */
        var stripT = document.getElementById("stripT"), stripO = document.getElementById("stripO");
        (function () {
          stripT.textContent = "\u00a0\n1\n2\n3";
          var o = [];
          for (var v = 0; v <= 30; v++) o.push(String(v % 10));
          stripO.textContent = o.join("\n");
        })();
        var colT = document.getElementById("colT"), colO = document.getElementById("colO");
        var vbTg = document.getElementById("vbTg"), vbOg = document.getElementById("vbOg");
        var CELL = 300;
        function countVal(t) { return 30 * EZ.p2o(seg(t, Q.LOCK, Q.LAND)); }
        function tensPos(v) { var b = Math.floor(v / 10); return Math.min(3, b + sstep(9.0, 10.0, v - b * 10)); }
        function updateCounter(t) {
          var v = countVal(t), v1 = countVal(t - 1 / 30);
          var tp = tensPos(v), tp1 = tensPos(v1);
          stripO.style.transform = "translate3d(0," + (-v * CELL).toFixed(2) + "px,0)";
          stripT.style.transform = "translate3d(0," + (-tp * CELL).toFixed(2) + "px,0)";
          var bO = Math.min(22, Math.abs(v - v1) * CELL * 0.32), bT = Math.min(22, Math.abs(tp - tp1) * CELL * 0.32);
          vbOg.setAttribute("stdDeviation", "0 " + bO.toFixed(2));
          vbTg.setAttribute("stdDeviation", "0 " + bT.toFixed(2));
          colO.style.filter = bO > 0.05 ? "url(#vbO)" : "none";
          colT.style.filter = bT > 0.05 ? "url(#vbT)" : "none";
        }
        function updateCards(t) {
          CARDS.forEach(function (c) {
            if (t < c.word) { c.el.style.opacity = "0"; return; }
            var u = cardFly(c, t);
            var sc = lerp(0.12, 1, EZ.backOut(seg(t, c.word, c.word + 0.55), 1.9));
            var op = EZ.p2o(seg(t, c.word, c.word + 0.09));
            var bl = 10 * (1 - EZ.p3o(seg(t, c.word, c.word + 0.32)));
            var rot = c.rot0 * (1 - EZ.expoOut(seg(t, c.word, c.word + 0.6)));
            var a = polyAt(c.pts, u);
            var x = a[0] + c.off[0] * sc, y = a[1] + c.off[1] * sc;
            y += 3 * Math.sin((t - c.word) * 2.3 + c.ph) * sstep(c.word + 0.4, c.word + 1.0, t);
            // the fold: cards fall into the sphere and dissolve
            var f = seg(t, Q.FOLD, Q.FOLD + 0.24);
            if (f > 0) {
              var fe = EZ.p2i(f);
              x = lerp(x, HUB.x, 0.18 * fe); y = lerp(y, HUB.y, 0.18 * fe);
              sc *= lerp(1, 0.7, fe); op *= 1 - fe; bl += 7 * fe;
            }
            c.el.style.opacity = op.toFixed(3);
            c.el.style.transform = "translate3d(" + (x - CW / 2).toFixed(2) + "px," + (y - CH / 2).toFixed(2) + "px,0) scale(" + sc.toFixed(4) + ") rotate(" + rot.toFixed(2) + "deg)";
            c.el.style.filter = bl > 0.05 ? "blur(" + bl.toFixed(2) + "px)" : "none";
          });
        }
        var netEl = document.getElementById("net");

        var P = { t: 0 };
        function render(t) {
          camAt(t);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none"; ctx.shadowBlur = 0;
          ctx.clearRect(0, 0, W, H);
          // warm light: the burst flash and a soft pool under the crowd
          ctx.globalCompositeOperation = "lighter";
          var pre = sstep(0.04, Q.BURST, t) * (1 - seg(t, Q.BURST, Q.BURST + 0.1));
          var flash = env(t, Q.BURST, 0.025, 0.16);
          radial(FC.x, FC.y, 190 + 90 * flash, [[0, "rgba(255,240,205,0.75)"], [0.28, "rgba(232,196,120,0.26)"], [1, "rgba(232,196,120,0)"]], 0.3 * pre + 0.62 * flash);
          var pool = sstep(Q.BURST, 1.2, t) * (1 - sstep(Q.SWIRL, Q.CONDENSE, t));
          radial(FC.x, FC.y + 10, 560, [[0, "rgba(232,196,120,0.16)"], [1, "rgba(232,196,120,0)"]], pool);
          var sw0 = seg(t, Q.BURST, Q.BURST + 0.7);
          if (sw0 > 0 && sw0 < 1) ring(FC.x, FC.y, lerp(30, 720, EZ.expoOut(sw0)), lerp(2.2, 0.6, sw0), 0.4 * (1 - sw0), GOLD_HI);
          flare(FC.x, FC.y, 360 + 160 * seg(t, Q.BURST, Q.BURST + 0.4), 0.6 * env(t, Q.BURST, 0.02, 0.16));
          flare(490, 790, 380 + 200 * seg(t, Q.LAND, Q.LAND + 0.5), 0.7 * env(t, Q.LAND, 0.02, 0.18));
          ctx.globalCompositeOperation = "source-over";
          // a navy halo behind the counter keeps the number crisp over the crowd
          var halo = sstep(Q.LOCK, Q.LOCK + 0.3, t) * (1 - sstep(Q.SWIRL, Q.SWIRL + 0.2, t));
          radial(510, 830, 470, [[0, "rgba(4,8,20,0.82)"], [0.55, "rgba(4,8,20,0.5)"], [1, "rgba(4,8,20,0)"]], halo);
          drawDust(t);
          drawAct1(t);
          drawSlam(t);
          drawNetwork(t);
          drawSphere(t);
          ctx.globalAlpha = 1;
          updateCounter(t);
          updateCards(t);
          netEl.style.transform = "translate3d(0," + cam.y.toFixed(2) + "px,0) scale(" + cam.s.toFixed(5) + ")";
        }

        /* ---------- the timeline ---------- */
        var tl = gsap.timeline({ paused: true });
        // "tracking in" without animating letter-spacing: each glyph starts pushed out from the centre by
        // `extra` px per character step and settles to its laid-out place (x transforms only)
        function trackIn(sel, extra, at, dur) {
          var el = document.querySelector(sel), txt = el.textContent;
          el.textContent = "";
          var spans = [];
          for (var i = 0; i < txt.length; i++) {
            var sp = document.createElement("span");
            sp.style.display = "inline-block";
            sp.style.whiteSpace = "pre";
            sp.textContent = txt[i];
            el.appendChild(sp); spans.push(sp);
          }
          var mid = (txt.length - 1) / 2;
          tl.fromTo(spans, { x: function (i) { return (i - mid) * extra; } },
            { x: 0, duration: dur, ease: "power3.out" }, at);
        }
        tl.to(P, { t: DUR, duration: DUR, ease: "none", onUpdate: function () { render(P.t); },
          onReverseComplete: function () { render(0); } }, 0);

        // Act 1: counter rises (15.46) and slams on "thirty" (16.34)
        tl.fromTo("#cRise", { y: 96, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.46, ease: "expo.out" }, Q.LOCK);
        tl.fromTo("#cPunch", { scale: 1 }, { scale: 1.085, duration: 0.07, ease: "power2.out" }, Q.LAND);
        tl.to("#cPunch", { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, Q.LAND + 0.07);
        tl.fromTo("#plus", { scale: 2.6 }, { scale: 1, duration: 0.34, ease: "back.out(1.4)" }, Q.LAND);
        tl.fromTo("#plus", { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.24, ease: "expo.out" }, Q.LAND);
        tl.to("#plus", { opacity: 1, duration: 0.05, ease: "none" }, Q.LAND);
        tl.fromTo("#sheen30", { backgroundPosition: "88% 0%" }, { backgroundPosition: "12% 0%", duration: 0.46, ease: "power1.inOut" }, Q.SHEEN);
        tl.fromTo("#cWrap", { scale: 1, rotation: 0, opacity: 1, filter: "blur(0px)" },
          { scale: 0.3, rotation: -16, opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, Q.SWIRL - 0.1);

        // IN-HOUSE SPECIALISTS (16.82) with a gold hairline (16.74)
        tl.fromTo("#hair", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, Q.HAIR);
        tl.fromTo("#subText", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, Q.SUB);
        trackIn("#subText", 36 * 0.3, Q.SUB, 0.8);
        // "specialists" (17.38): a glint runs along the hairline
        tl.fromTo("#hairGlint", { x: 0, opacity: 0 }, { x: 420, duration: 0.5, ease: "power2.inOut" }, Q.RIPPLE);
        tl.to("#hairGlint", { opacity: 1, duration: 0.1, ease: "none" }, Q.RIPPLE);
        tl.to("#hairGlint", { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, Q.RIPPLE + 0.38);
        tl.fromTo("#sub", { opacity: 1, y: 0 }, { opacity: 0, y: 14, duration: 0.18, ease: "power2.in" }, Q.SWIRL - 0.12);

        // the TW mark condenses on "together" (18.74)
        var markSvg = document.getElementById("markSvg");
        var mFill = document.getElementById("mFill"), mHot = document.getElementById("mHot");
        var mStroke = document.getElementById("mStroke"), mClip = document.getElementById("markClip");
        ["t", "w", "diamond"].forEach(function (k) {
          [mFill, mHot, mClip].forEach(function (g) {
            var p = document.createElementNS(NS, "path"); p.setAttribute("d", TW_PATHS[k]); g.appendChild(p);
          });
          var ps = document.createElementNS(NS, "path"); ps.setAttribute("d", TW_PATHS[k]); mStroke.appendChild(ps);
        });
        var strokePaths = Array.prototype.slice.call(mStroke.querySelectorAll("path"));
        strokePaths.forEach(function (p, k) {
          var L = mLens[k] * 1.02;
          p.style.strokeDasharray = L + " " + L;
          p.style.strokeDashoffset = String(L);
          tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.out" }, 4.34 + 0.03 * k);
        });
        tl.set("#hub", { opacity: 1 }, 4.33);
        tl.fromTo(mHot, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "power1.out" }, Q.CONDENSE - 0.02);
        tl.to(mHot, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, Q.CONDENSE + 0.04);
        tl.fromTo(mFill, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, Q.CONDENSE);
        tl.fromTo(mStroke, { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: "power2.out" }, Q.CONDENSE + 0.2);
        tl.fromTo(markSvg, { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "back.out(2.2)" }, Q.CONDENSE);
        // shine on "expertise" (19.22) and on the lift (24.50)
        tl.fromTo("#mSheen", { attr: { x: -700 } }, { attr: { x: 1500 }, duration: 0.55, ease: "power2.inOut" }, Q.EXPERT);
        tl.fromTo("#mSheen", { attr: { x: -700 } }, { attr: { x: 1500 }, duration: 0.5, ease: "power2.inOut", immediateRender: false }, Q.LIFT);
        tl.to(mHot, { opacity: 0.45, duration: 0.06, ease: "power1.out", immediateRender: false }, Q.LIFT);
        tl.to(mHot, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, Q.LIFT + 0.06);
        // EXPERTISE ACROSS (19.22)
        tl.fromTo("#hdrText", { yPercent: 115 }, { yPercent: 0, duration: 0.55, ease: "expo.out" }, Q.EXPERT);
        trackIn("#hdrText", 27 * 0.32, Q.EXPERT, 0.85);

        // the five services: icons draw in, a tick of light on landing, a flash when the lift pulse arrives
        CARDS.forEach(function (c) {
          var paths = Array.prototype.slice.call(c.el.querySelectorAll(".ico path, .ico circle"));
          paths.forEach(function (p, k) {
            var L = (p.getTotalLength ? p.getTotalLength() : 100) * 1.04;
            p.style.strokeDasharray = L + " " + L;
            p.style.strokeDashoffset = String(L);
            tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, c.word + 0.12 + 0.08 * k);
          });
          var fl = c.el.querySelector(".card-flash");
          tl.fromTo(fl, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "power1.out" }, c.word + 0.22);
          tl.to(fl, { opacity: 0, duration: Math.min(0.45, Q.LIFT_ARRIVE - (c.word + 0.27) - 0.01), ease: "power2.out", immediateRender: false }, c.word + 0.27);
          tl.to(fl, { opacity: 0.9, duration: 0.05, ease: "power1.out", immediateRender: false }, Q.LIFT_ARRIVE);
          tl.to(fl, { opacity: 0.25, duration: 0.2, ease: "power2.out", immediateRender: false }, Q.LIFT_ARRIVE + 0.05);
        });

        // ONE CONNECTED FINANCE FUNCTION (24.46 - 25.30)
        tl.set("#tag", { opacity: 1 }, 10.16);
        tl.fromTo("#tag .wi", { yPercent: 118 }, { yPercent: 0, duration: 0.5, ease: "expo.out", stagger: 0.035 }, 10.16);
        tl.to("#tag", { opacity: 0, y: -8, duration: 0.07, ease: "power1.in", immediateRender: false }, 11.01);

        // the fold (25.00): type and hub leave, the sphere takes over
        tl.fromTo("#hdr", { opacity: 1 }, { opacity: 0, duration: 0.1, ease: "power1.in" }, Q.FOLD);
        tl.fromTo("#hub", { scale: 1, filter: "blur(0px)" }, { scale: 0.5, filter: "blur(6px)", duration: 0.2, ease: "power2.in", immediateRender: false }, Q.FOLD);
        tl.to("#hub", { opacity: 0, duration: 0.18, ease: "power2.in", immediateRender: false }, Q.FOLD + 0.02);

        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
