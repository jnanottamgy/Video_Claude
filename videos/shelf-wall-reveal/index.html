<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Sora"; font-weight: 400; src: url("assets/fonts/sora-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Sora"; font-weight: 600; src: url("assets/fonts/sora-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Sora"; font-weight: 700; src: url("assets/fonts/sora-latin-700-normal.woff2") format("woff2"); }

      /* Palette for a LIGHT wall: the mark keeps its own glass colours, the type
         is dark so it reads on beige. Triplets feed rgba() so alpha can animate. */
      :root {
        --ink: #0d1b36;
        --ink-soft: #2e3d58;
        --accent: #1f5fd6;
        --halo: 70, 150, 255;
        --shadow: 45, 35, 25;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Transparent all the way down — this renders as an alpha overlay. */
      html, body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: transparent;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: transparent;
      }

      #lockup {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 90px 80px;
      }

      #markWrap {
        position: relative;
        width: 315px;
        height: 360px;
        margin-bottom: 56px;
        opacity: 0;
        will-change: transform, filter, opacity;
      }
      /* Halo = LED glow on the wall behind the mark; second shadow = contact
         shadow, lit from the ceiling downlight above-right. */
      #markImg {
        display: block;
        width: 100%;
        height: 100%;
        --mh: 0;
        --mhb: 40px;
        --ms: 0;
        --msx: -16px;
        --msy: 30px;
        --msb: 36px;
        filter: drop-shadow(0 0 var(--mhb) rgba(var(--halo), var(--mh)))
          drop-shadow(var(--msx) var(--msy) var(--msb) rgba(var(--shadow), var(--ms)));
      }
      #spec {
        position: absolute;
        inset: 0;
        -webkit-mask-image: url("assets/mark.png");
        mask-image: url("assets/mark.png");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        background-image: linear-gradient(
          102deg,
          rgba(255, 255, 255, 0) 40%,
          rgba(235, 245, 255, 0.45) 47%,
          rgba(255, 255, 255, 0.88) 50%,
          rgba(235, 245, 255, 0.45) 53%,
          rgba(255, 255, 255, 0) 60%
        );
        background-size: 280% 100%;
        background-repeat: no-repeat;
        background-position: -90% 0%;
        opacity: 0;
      }

      #name {
        display: flex;
        align-items: baseline;
        gap: 12px;
        font: 700 136px/1 "Sora", sans-serif;
        color: var(--ink);
      }
      #name > span {
        display: inline-block;
        opacity: 0;
        --ls: 0;
        --lh: 0;
        text-shadow: -3px 6px 7px rgba(var(--shadow), var(--ls)), 0 0 20px rgba(var(--halo), var(--lh));
        will-change: transform, filter, opacity;
      }

      #rule {
        width: 560px;
        height: 3px;
        margin: 34px 0;
        background: linear-gradient(
          90deg,
          rgba(31, 95, 214, 0) 0%,
          rgba(31, 95, 214, 0.9) 22%,
          rgba(90, 156, 255, 1) 50%,
          rgba(31, 95, 214, 0.9) 78%,
          rgba(31, 95, 214, 0) 100%
        );
        box-shadow: 0 0 12px rgba(var(--halo), 0.45);
        transform: scaleX(0);
        opacity: 0;
      }

      #tagline {
        font: 400 52px/1.28 "Sora", sans-serif;
        letter-spacing: 0.005em;
        color: var(--ink-soft);
        text-align: center;
      }
      #tagline .w {
        display: inline-block;
        opacity: 0;
        text-shadow: -2px 3px 4px rgba(var(--shadow), 0.22);
      }
      #tagline .w b {
        font-weight: 700;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1350"
    >
      <div id="lockup" class="clip" data-start="0" data-duration="10" data-track-index="0">
        <div id="markWrap">
          <img id="markImg" src="assets/mark.png" alt="" />
          <div id="spec"></div>
        </div>

        <div id="name">
          <span id="c0">S</span><span id="d0">.</span><span id="c1">H</span><span id="d1">.</span><span id="c2">E</span><span id="d2">.</span><span id="c3">L</span><span id="d3">.</span><span id="c4">F</span>
        </div>

        <div id="rule"></div>

        <div id="tagline">
          <div><span class="w" id="w0"><b>S</b>emantic</span> <span class="w" id="w1"><b>H</b>ybrid</span> <span class="w" id="w2"><b>E</b>ntity</span></div>
          <div><span class="w" id="w3"><b>L</b>inking</span> <span class="w" id="w4"><b>F</b>ramework</span></div>
        </div>
      </div>
    </div>

    <script>
      var INK = "#0d1b36";
      var FLASH = "#3d8bff";
      var tl = gsap.timeline({ paused: true });

      /* 1 — the mark flies in and HITS the wall at HIT (the impact SFX lands here).
             It accelerates in out of a defocus; its shadow converges onto it and
             reaches contact exactly at impact; the halo flashes; a small recoil settles it. */
      var HIT = 0.85; // tools/mix_sfx.py parses this — the impact SFX follows it
      tl.fromTo("#markWrap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, ease: "sine.out" }, 0.25);
      tl.fromTo(
        "#markWrap",
        { scale: 1.35, filter: "blur(14px)" },
        { scale: 1, filter: "blur(0px)", duration: HIT - 0.25, ease: "power2.in", immediateRender: false },
        0.25
      );
      tl.to("#markWrap", { scale: 0.985, duration: 0.07, ease: "power2.out" }, HIT);
      tl.to("#markWrap", { scale: 1, duration: 0.3, ease: "power2.out" }, HIT + 0.07);
      tl.fromTo(
        "#markImg",
        { "--ms": 0, "--msx": "-16px", "--msy": "30px", "--msb": "36px", "--mh": 0, "--mhb": "40px" },
        { "--ms": 0.34, "--msx": "-5px", "--msy": "9px", "--msb": "11px", "--mh": 0.4, "--mhb": "30px", duration: HIT - 0.25, ease: "power2.in" },
        0.25
      );
      tl.to("#markImg", { "--mh": 1.0, "--mhb": "18px", duration: 0.05, ease: "power2.out" }, HIT);
      tl.to("#markImg", { "--mh": 0.6, "--mhb": "22px", duration: 0.7, ease: "power2.out" }, HIT + 0.05);

      /* 2 — specular rake across the glass */
      tl.fromTo("#spec", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: "sine.out" }, 1.55);
      tl.fromTo(
        "#spec",
        { backgroundPosition: "-90% 0%" },
        { backgroundPosition: "190% 0%", duration: 1.0, ease: "power2.inOut", immediateRender: false },
        1.55
      );
      tl.to("#spec", { autoAlpha: 0, duration: 0.25, ease: "sine.in" }, 2.35);

      /* 3 — S.H.E.L.F resolves glyph by glyph */
      ["#c0", "#d0", "#c1", "#d1", "#c2", "#d2", "#c3", "#d3", "#c4"].forEach(function (sel, i) {
        tl.fromTo(
          sel,
          { autoAlpha: 0, y: 30, filter: "blur(10px)", "--ls": 0, "--lh": 0 },
          { autoAlpha: 1, y: 0, filter: "blur(0px)", "--ls": 0.3, "--lh": 0.42, duration: 0.7, ease: "power3.out" },
          1.75 + i * 0.065
        );
      });

      /* 4 — accent rule */
      tl.fromTo("#rule", { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.7, ease: "power2.out" }, 2.55);

      /* 5 — decode: each word lands and lights the letter it stands for */
      for (var k = 0; k < 5; k++) {
        var t0 = 3.0 + k * 0.24;
        tl.fromTo(
          "#w" + k,
          { autoAlpha: 0, y: 16, filter: "blur(6px)" },
          { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" },
          t0
        );
        tl.fromTo("#c" + k, { color: INK }, { color: FLASH, duration: 0.14, ease: "sine.out", immediateRender: false }, t0 + 0.05);
        tl.to("#c" + k, { color: INK, duration: 0.5, ease: "sine.inOut" }, t0 + 0.22);
      }

      /* 6 — hold on the wall; the halo breathes through the longer hold */
      tl.to("#markImg", { "--mh": 0.78, duration: 1.2, ease: "sine.inOut" }, 5.0);
      tl.to("#markImg", { "--mh": 0.6, duration: 1.2, ease: "sine.inOut" }, 6.2);
      tl.to("#markImg", { "--mh": 0.78, duration: 1.1, ease: "sine.inOut" }, 7.6);
      tl.to("#markImg", { "--mh": 0.6, duration: 1.1, ease: "sine.inOut" }, 8.7);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
