<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg-deep: #04070f;
        --bg-mid: #0a1324;
        --plate: #060c18;
        --steel: #c9d6e8;
        --ice: #eaf2ff;
        --accent: #4f9dff;
        --glow: #5ab0ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-deep);
      }

      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg-deep);
      }

      /* Everything the camera moves lives in here. */
      #camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Deep field: a cool core that keeps the mark's own contact shadow reading
         as shadow rather than as a dirty edge. */
      #field {
        position: absolute;
        inset: -10%;
        background:
          radial-gradient(58% 52% at 50% 46%, #0c1830 0%, #081122 42%, var(--bg-deep) 78%);
      }

      /* Blue bloom behind the mark. */
      #bloom {
        position: absolute;
        left: 50%;
        top: 48%;
        width: 1180px;
        height: 1180px;
        margin-left: -590px;
        margin-top: -590px;
        background: radial-gradient(circle, rgba(90, 176, 255, 0.40) 0%, rgba(58, 120, 220, 0.16) 34%, rgba(20, 50, 110, 0.0) 68%);
        filter: blur(36px);
        opacity: 0;
      }

      /* Floor kiss — a tight pool under the lockup. */
      #floor {
        position: absolute;
        left: 50%;
        top: 806px;
        width: 900px;
        height: 150px;
        margin-left: -450px;
        background: radial-gradient(ellipse at center, rgba(96, 170, 255, 0.34) 0%, rgba(60, 120, 210, 0.10) 46%, rgba(0, 0, 0, 0) 72%);
        filter: blur(24px);
        opacity: 0;
      }

      #logoWrap {
        position: absolute;
        left: 677px;
        top: 214px;
        width: 565px;
        height: 620px;
        opacity: 0;
        will-change: transform, filter, opacity;
      }
      #logoImg {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* Specular rake, clipped to the mark's own silhouette. This is what
         reads as chrome rather than as a lit rectangle. */
      #spec {
        position: absolute;
        inset: 0;
        -webkit-mask-image: url("assets/logo-mask.png");
        mask-image: url("assets/logo-mask.png");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        background-image: linear-gradient(
          102deg,
          rgba(255, 255, 255, 0) 40%,
          rgba(214, 236, 255, 0.55) 47%,
          rgba(255, 255, 255, 0.95) 50%,
          rgba(214, 236, 255, 0.55) 53%,
          rgba(255, 255, 255, 0) 60%
        );
        background-size: 280% 100%;
        background-repeat: no-repeat;
        background-position: -90% 0%;
        mix-blend-mode: screen;
        opacity: 0;
      }

      /* Anamorphic rake that "finds" the mark. */
      #streakWrap {
        position: absolute;
        left: 0;
        top: 523px;
        width: 100%;
        height: 40px;
        opacity: 0;
      }
      #streakCore {
        position: absolute;
        left: 0;
        top: 18px;
        width: 760px;
        height: 3px;
        background: linear-gradient(
          90deg,
          rgba(120, 180, 255, 0) 0%,
          rgba(170, 212, 255, 0.5) 28%,
          rgba(240, 249, 255, 1) 50%,
          rgba(170, 212, 255, 0.5) 72%,
          rgba(120, 180, 255, 0) 100%
        );
        filter: blur(1.5px);
      }
      #streakHalo {
        position: absolute;
        left: 0;
        top: 2px;
        width: 760px;
        height: 36px;
        background: linear-gradient(
          90deg,
          rgba(70, 140, 240, 0) 0%,
          rgba(90, 176, 255, 0.34) 50%,
          rgba(70, 140, 240, 0) 100%
        );
        filter: blur(14px);
      }

      /* Accent rule beneath the lockup. */
      #rule {
        position: absolute;
        left: 50%;
        top: 892px;
        width: 520px;
        height: 2px;
        margin-left: -260px;
        background: linear-gradient(
          90deg,
          rgba(79, 157, 255, 0) 0%,
          rgba(130, 190, 255, 0.75) 22%,
          rgba(226, 241, 255, 1) 50%,
          rgba(130, 190, 255, 0.75) 78%,
          rgba(79, 157, 255, 0) 100%
        );
        box-shadow: 0 0 18px 2px rgba(90, 176, 255, 0.55);
        transform: scaleX(0);
        transform-origin: 50% 50%;
        opacity: 0;
      }

      .mote {
        position: absolute;
        border-radius: 50%;
        background: rgba(190, 222, 255, 0.9);
        opacity: 0;
        will-change: transform, opacity;
      }

      /* Optical finish: vignette + fixed-seed grain. Deterministic. */
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          72% 66% at 50% 50%,
          rgba(0, 0, 0, 0) 52%,
          rgba(0, 0, 0, 0.42) 80%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }
      #grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.09;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='7' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.6'/></svg>");
        background-size: 180px 180px;
      }

      #blackout {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 1;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="camera">
          <div id="field"></div>
          <div id="bloom"></div>
          <div id="floor"></div>

          <div id="motes"></div>

          <div id="streakWrap">
            <div id="streakHalo"></div>
            <div id="streakCore"></div>
          </div>

          <div id="logoWrap">
            <img id="logoImg" src="assets/logo.png" alt="" />
            <div id="spec"></div>
          </div>

          <div id="rule"></div>
        </div>
        <div id="vignette"></div>
        <div id="grain"></div>
        <div id="blackout"></div>
      </div>
    </div>

    <script>
      /* Fixed mote table — authored, not generated, so every render is identical. */
      var MOTES = [
        [292, 742, 3.0, 0.00, -74], [1663, 318, 2.4, 0.42, -96], [498, 232, 2.0, 0.85, -62],
        [1402, 806, 3.4, 0.21, -88], [742, 902, 2.2, 1.08, -70], [1186, 164, 2.6, 0.63, -104],
        [386, 468, 1.8, 1.36, -58], [1548, 598, 3.1, 0.07, -92], [886, 136, 2.3, 1.52, -66],
        [1294, 942, 2.8, 0.94, -80], [214, 592, 2.1, 0.33, -72], [1736, 772, 2.5, 1.21, -98],
        [642, 334, 1.9, 1.64, -54], [1078, 854, 3.2, 0.50, -86], [1462, 442, 2.2, 1.77, -76],
        [334, 886, 2.7, 0.76, -90], [1620, 196, 2.0, 1.44, -60], [802, 622, 1.7, 1.90, -50],
        [1222, 528, 2.9, 0.14, -84]
      ];

      (function buildMotes() {
        var host = document.getElementById("motes");
        for (var i = 0; i < MOTES.length; i++) {
          var m = MOTES[i];
          var d = document.createElement("div");
          d.className = "mote";
          d.style.left = m[0] + "px";
          d.style.top = m[1] + "px";
          d.style.width = m[2] + "px";
          d.style.height = m[2] + "px";
          host.appendChild(d);
        }
      })();

      var tl = gsap.timeline({ paused: true });

      /* 1 — lift off black, core glow swells */
      tl.fromTo("#blackout", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.75, ease: "sine.inOut" }, 0.0);
      tl.fromTo("#bloom", { autoAlpha: 0, scale: 0.78 }, { autoAlpha: 0.62, scale: 1.0, duration: 1.30, ease: "sine.out" }, 0.10);

      /* 2 — anamorphic rake crosses the frame */
      tl.fromTo("#streakWrap", { autoAlpha: 0, x: -820 }, { autoAlpha: 1, duration: 0.30, ease: "sine.out" }, 0.35);
      tl.to("#streakWrap", { x: 1980, duration: 1.15, ease: "power2.inOut" }, 0.35);
      tl.to("#streakWrap", { autoAlpha: 0, duration: 0.34, ease: "sine.in" }, 1.16);

      /* 3 — the mark resolves out of the bloom as the light passes */
      tl.fromTo(
        "#logoWrap",
        { autoAlpha: 0, scale: 1.14, filter: "blur(18px)" },
        { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 1.25, ease: "power3.out" },
        0.70
      );
      tl.fromTo("#floor", { autoAlpha: 0 }, { autoAlpha: 0.9, duration: 0.95, ease: "sine.out" }, 1.05);

      /* 4 — specular rake across the glass, clipped to the silhouette */
      tl.fromTo("#spec", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.22, ease: "sine.out" }, 1.85);
      tl.fromTo(
        "#spec",
        { backgroundPosition: "-90% 0%" },
        { backgroundPosition: "190% 0%", duration: 1.05, ease: "power2.inOut", immediateRender: false },
        1.85
      );
      tl.to("#spec", { autoAlpha: 0, duration: 0.26, ease: "sine.in" }, 2.72);

      /* 5 — slow push-in under the whole second half */
      tl.fromTo("#camera", { scale: 1.0 }, { scale: 1.05, duration: 4.0, ease: "sine.inOut" }, 2.0);

      /* 6 — accent rule sweeps out */
      tl.fromTo("#rule", { autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.75, ease: "power2.out" }, 2.55);

      /* 7 — motes drift for parallax depth */
      for (var i = 0; i < MOTES.length; i++) {
        var m = MOTES[i];
        tl.fromTo(
          ".mote:nth-child(" + (i + 1) + ")",
          { autoAlpha: 0, y: 0 },
          { autoAlpha: 0.42, y: m[4] * 0.45, duration: 1.1, ease: "sine.out" },
          1.0 + m[3] * 0.5
        );
        tl.to(".mote:nth-child(" + (i + 1) + ")", { y: m[4], autoAlpha: 0, duration: 2.6, ease: "sine.inOut" }, 2.4 + m[3] * 0.5);
      }

      /* 8 — the bloom breathes once on the hold */
      tl.to("#bloom", { autoAlpha: 0.78, duration: 1.05, ease: "sine.inOut" }, 3.10);
      tl.to("#bloom", { autoAlpha: 0.60, duration: 1.05, ease: "sine.inOut" }, 4.15);

      /* 9 — fall to black */
      tl.to("#blackout", { autoAlpha: 1, duration: 0.70, ease: "sine.in" }, 5.30);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
